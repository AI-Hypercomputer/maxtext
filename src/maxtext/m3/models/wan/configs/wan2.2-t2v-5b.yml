# Wan 2.2 TI2V 5B (Wan-AI/Wan2.2-TI2V-5B-Diffusers), text-to-video configuration.

# Model Identity and Architecture
pretrained_model_name_or_path: 'Wan-AI/Wan2.2-TI2V-5B-Diffusers'
model_name: wan2.2
model_type: 'T2V'
# `model_type`s the pipeline implements for this model; others fail fast in sample.py. TI2V is a follow-up.
supported_types: ['T2V']
wan_transformer_pretrained_model_name_or_path: ${pretrained_model_name_or_path}

# Modules (import paths) and their architecture. A converted checkpoint's `<component>_config` takes precedence;
# these blocks are used when training from scratch (no checkpoint_directory). Values: Wan2.2-TI2V-5B.
transformer_class: maxtext.m3.models.wan.transformer_wan.WanModel
vae_class: maxtext.m3.models.wan.autoencoder_kl_wan.AutoencoderKLWan
transformer_config:
  patch_size: [1, 2, 2]
  num_attention_heads: 24
  attention_head_dim: 128
  in_channels: 48
  out_channels: 48
  text_dim: 4096
  freq_dim: 256
  ffn_dim: 14336
  num_layers: 30
  cross_attn_norm: True
  qk_norm: 'rms_norm_across_heads'
  eps: 1.0e-6
  image_dim: null
  added_kv_proj_dim: null
  rope_max_seq_len: 1024
vae_config:
  base_dim: 160
  decoder_base_dim: 256
  z_dim: 48
  dim_mult: [1, 2, 4, 4]
  num_res_blocks: 2
  attn_scales: []
  temperal_downsample: [False, True, True]
  is_residual: True
  in_channels: 12
  out_channels: 12
  patch_size: 2
  scale_factor_temporal: 4
  scale_factor_spatial: 16
  # Per-channel latent statistics (z_dim entries) from Wan-AI/Wan2.2-TI2V-5B-Diffusers vae/config.json.
  latents_mean: [
    -0.2289, -0.0052, -0.1323, -0.2339, -0.2799, 0.0174, 0.1838, 0.1557, -0.1382, 0.0542, 0.2813, 0.0891,
    0.157, -0.0098, 0.0375, -0.1825, -0.2246, -0.1207, -0.0698, 0.5109, 0.2665, -0.2108, -0.2158, 0.2502,
    -0.2055, -0.0322, 0.1109, 0.1567, -0.0729, 0.0899, -0.2799, -0.123, -0.0313, -0.1649, 0.0117, 0.0723,
    -0.2839, -0.2083, -0.052, 0.3748, 0.0152, 0.1957, 0.1433, -0.2944, 0.3573, -0.0548, -0.1681, -0.0667,
  ]
  latents_std: [
    0.4765, 1.0364, 0.4514, 1.1677, 0.5313, 0.499, 0.4818, 0.5013, 0.8158, 1.0344, 0.5894, 1.0901,
    0.6885, 0.6165, 0.8454, 0.4978, 0.5759, 0.3523, 0.7135, 0.6804, 0.5833, 1.4146, 0.8986, 0.5659,
    0.7069, 0.5338, 0.4889, 0.4917, 0.4069, 0.4999, 0.6866, 0.4093, 0.5709, 0.6065, 0.6415, 0.4944,
    0.5726, 1.2042, 0.5458, 1.6887, 0.3971, 1.06, 0.3943, 0.5537, 0.5444, 0.4089, 0.7468, 0.7744,
  ]

# Model dtypes
weights_dtype: 'bfloat16'
activations_dtype: 'bfloat16'
text_encoder_dtype: 'float32'
max_sequence_length: 512

# VAE parameters
vae_weights_dtype: 'float32'
vae_dtype: 'float32'
replicate_vae: False
vae_decode_chunk: 1
vae_encode_chunk: 4
vae_spatial: -1

# Noise Scheduler parameters
scheduler_dtype: 'float32'
use_experimental_scheduler: True
flow_shift: 5.0
prediction_type: "flow_prediction"
guidance_scale: 5.0
guidance_rescale: 0.0

# Execution & Attention parameters
precision: "DEFAULT"
scan_layers: True
scan_diffusion_loop: False
jit_initializers: True
from_pt: True
split_head_dim: True
attention: 'flash'
use_base2_exp: True
ulysses_shards: -1
ulysses_attention_chunks: 1
flash_min_seq_length: 4096
dropout: 0.0
mask_padding_tokens: True
attention_sharding_uniform: True
norm_num_groups: 32
remat_policy: "NONE"
names_which_can_be_saved: []
names_which_can_be_offloaded: []
enable_jax_named_scopes: False
use_batched_text_encoder: False
quantization: ''

flash_block_sizes:
  block_q: 512
  block_kv_compute: 512
  block_kv: 512
  block_q_dkv: 512
  block_kv_dkv: 512
  block_kv_dkv_compute: 512
  block_q_dq: 512
  block_kv_dq: 512
  use_fused_bwd_kernel: False

# Inference & Generation parameters
prompt_file: ""
prompt: "A cat and a dog baking a cake together in a kitchen. The cat is carefully measuring flour, while the dog is stirring the batter with a wooden spoon. The kitchen is cozy, with sunlight streaming through the window."
prompt_2: "A cat and a dog baking a cake together in a kitchen. The cat is carefully measuring flour, while the dog is stirring the batter with a wooden spoon. The kitchen is cozy, with sunlight streaming through the window."
negative_prompt: "Bright tones, overexposed, static, blurred details, subtitles, style, works, paintings, images, static, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, many people in the background, walking backwards"
do_classifier_free_guidance: True
height: 704
width: 1280
num_frames: 81
num_inference_steps: 50
fps: 24
seed: 0

# Device, Mesh Topology & SPMD Partitioning
hardware: 'tpu'
skip_jax_distributed_system: False
jax_cache_dir: ''
mesh_axes: ['data', 'fsdp', 'context', 'tensor']
# Logical-axis rule tables of the transformer / VAE / UMT5 text encoder, read by `WanSharding` (transformer_wan.py) /
# `WanVAESharding` (autoencoder_kl_wan.py) / `UMT5Sharding` (text_encoder_wan.py). Each entry maps a logical axis to a
# mesh axis, a list of mesh axes (their product shards the dimension) or null (replicated). Every logical axis a model
# uses must be listed, once; overridable on the command line (e.g. `logical_axis_rules=...` for the Ulysses / ring
# layout, attention q / kv sequence on `context`).
logical_axis_rules: [
  ['batch', ['data', 'fsdp']],
  ['activation_batch', ['data', 'fsdp']],
  ['activation_self_attn_heads', ['context', 'tensor']],
  ['activation_self_attn_q_length', null],
  ['activation_self_attn_kv_length', null],
  ['activation_cross_attn_heads', null],
  ['activation_cross_attn_q_length', ['context', 'tensor']],
  ['activation_cross_attn_kv_length', null],
  ['activation_length', 'context'],
  ['activation_kv_length', null],
  ['activation_heads', 'tensor'],
  ['activation_kv', null],
  ['activation_embed', null],
  ['mlp', 'tensor'],
  ['embed', ['context', 'fsdp']],
  ['heads', 'tensor'],
  ['norm', 'tensor'],
  ['conv_batch', ['data', 'context', 'fsdp']],
  ['out_channels', 'tensor'],
  ['conv_out', 'context'],
]
# The VAE runs on its own mesh (`redundant` x `vae_spatial`, a reshape of the devices; see `vae_spatial` below).
vae_logical_axis_rules: [
  ['activation_batch', 'redundant'],
  ['activation_length', 'vae_spatial'],
  ['activation_heads', null],
  ['activation_kv_length', null],
  ['embed', null],
  ['heads', null],
  ['norm', null],
  ['conv_batch', 'redundant'],
  ['out_channels', 'vae_spatial'],
  ['conv_out', 'vae_spatial'],
  ['conv_in', 'vae_spatial'],
]
# UMT5 text encoder, tensor parallel: heads / mlp / vocab split over these mesh axes, embed and activations
# replicated. The product of the listed axes must divide 64 (umt5-xxl has 64 heads), so all axes work up to 64 chips;
# drop axes here for bigger meshes (the encoder is then replicated over them).
text_encoder_logical_axis_rules: [
  ['vocab', ['data', 'fsdp', 'context', 'tensor']],
  ['heads', ['data', 'fsdp', 'context', 'tensor']],
  ['mlp', ['data', 'fsdp', 'context', 'tensor']],
  ['activation_heads', ['data', 'fsdp', 'context', 'tensor']],
  ['activation_mlp', ['data', 'fsdp', 'context', 'tensor']],
  ['embed', null],
  ['norm', null],
  ['activation_batch', null],
  ['activation_length', null],
  ['activation_embed', null],
]

data_sharding: [['data', 'fsdp', 'context', 'tensor']]
dcn_data_parallelism: 1
dcn_fsdp_parallelism: 1
dcn_context_parallelism: -1
dcn_tensor_parallelism: 1
ici_data_parallelism: 1
ici_fsdp_parallelism: 1
ici_context_parallelism: -1
ici_tensor_parallelism: 1
allow_split_physical_axes: False
compile_topology_num_slices: -1
num_slices: 1
quantization_local_shard_count: 1
per_device_batch_size: 1.0

# Checkpoint, Paths & Orbax
run_name: ''
base_output_directory: ""
checkpoint_directory: ""
output_dir: ""
checkpoint_every: -1
checkpoint_dir: ""
save_final_checkpoint: False
save_config_to_gcs: False
enable_single_replica_ckpt_restoring: False
aot_cache_dir: ""
revision: ""

# Profiling
enable_profiler: False
skip_first_n_steps_for_profiler: 1
profiler_steps: 1
