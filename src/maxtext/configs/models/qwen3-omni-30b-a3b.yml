# Model config for Qwen3-Omni-30B-A3B

# Core Architectural Parameters
decoder_block: "qwen3_moe"
base_emb_dim: 2048
base_mlp_dim: 768
base_num_query_heads: 32
base_num_kv_heads: 4
base_num_decoder_layers: 48
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 152064
normalization_layer_epsilon: 1.0e-6
use_qk_norm: true

# MoE Specific Parameters
num_experts: 128
num_experts_per_tok: 8
base_moe_mlp_dim: 768
norm_topk_prob: true

# RoPE Settings
rope_max_timescale: 1_000_000
max_position_embeddings: 65536

# General Model Settings
enable_dropout: false
scan_layers: false  # deepstack does not support scan_layers

# Vision Encoder Configuration
vision_encoder_block: "qwen3_omni"
# Based on https://github.com/huggingface/transformers/blob/main/src/transformers/models/qwen3_omni_moe/configuration_qwen3_omni_moe.py
image_size_for_vit: 768
hidden_size_for_vit: 1152
intermediate_size_for_vit: 4304
num_attention_heads_for_vit: 16
num_hidden_layers_for_vit: 27
num_channels_for_vit: 3
patch_size_for_vit: 16
temporal_patch_size_for_vit: 2
spatial_merge_size_for_vit: 2
out_hidden_size_for_vit: 2048
num_position_embeddings_for_vit: 2304
deepstack_visual_indexes_for_vit: [8, 16, 24]

use_multimodal: true
use_audio: true
# Audio Encoder Configuration (need to set use_audio=true to enable)
# Based on https://github.com/huggingface/transformers/blob/main/src/transformers/models/qwen3_omni_moe/configuration_qwen3_omni_moe.py
d_model_for_audio: 1280
encoder_layers_for_audio: 32
encoder_attention_heads_for_audio: 20
encoder_ffn_dim_for_audio: 5120
max_source_positions_for_audio: 1500
num_mel_bins_for_audio: 128
downsample_hidden_size_for_audio: 480
output_dim_for_audio: 2048
attention_dropout_for_audio: 0.0
n_window_for_audio: 50
n_window_infer_for_audio: 400
conv_chunksize_for_audio: 500
num_conv_layers_for_audio: 3
max_timescale_for_audio: 10000.0
max_sample_len_for_audio: 10000
# MRoPE Settings (Multi-dimensional RoPE for multimodal)
use_mrope: true
mrope_section: [24, 20, 20]
position_id_per_seconds: 13

# Speech output (HF talker_config / code2wav_config). Built and loaded only when enable_audio_output=true.
talker_hidden_size: 1024
talker_intermediate_size: 2048
talker_num_hidden_layers: 20
talker_num_attention_heads: 16
talker_num_key_value_heads: 2
talker_head_dim: 128
talker_num_experts: 128
talker_num_experts_per_tok: 6
talker_moe_intermediate_size: 384
talker_shared_expert_intermediate_size: 768
talker_norm_topk_prob: true
talker_vocab_size: 3072
talker_rope_theta: 1000000.0
num_code_groups: 16
thinker_hidden_size: 2048
accept_hidden_layer: 24
codec_pad_id: 2148
codec_bos_id: 2149
codec_eos_token_id: 2150
codec_nothink_id: 2155
codec_think_bos_id: 2156
codec_think_eos_id: 2157
speaker_id: {"chelsie": 2301, "ethan": 2302, "aiden": 2303}
code_predictor_hidden_size: 1024
code_predictor_intermediate_size: 3072
code_predictor_num_hidden_layers: 5
code_predictor_num_attention_heads: 16
code_predictor_num_key_value_heads: 8
code_predictor_head_dim: 128
code_predictor_vocab_size: 2048
code2wav_codebook_size: 2048
code2wav_hidden_size: 1024
code2wav_intermediate_size: 3072
code2wav_num_hidden_layers: 8
code2wav_num_attention_heads: 16
code2wav_num_key_value_heads: 16
code2wav_sliding_window: 72
code2wav_rope_theta: 10000.0
code2wav_rms_norm_eps: 1.0e-5
code2wav_num_quantizers: 16
code2wav_upsample_rates: [8, 5, 4, 3]
code2wav_upsampling_ratios: [2, 2]
code2wav_decoder_dim: 1536
