# model config for DeepSeek V3 - 671B that uses Lineage

# For DeepSeek default device-limited routing,
# please set n_routing_groups=8 and topk_routing_group=4 in your command-line arguments.

base_emb_dim: 7168
base_num_query_heads: 128
base_num_kv_heads: 128
base_mlp_dim: 18432
base_moe_mlp_dim: 2048
base_num_decoder_layers: 61
first_num_dense_layers: 3
mlp_activations: ["silu","linear"]
vocab_size: 129280
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-6
num_experts: 256
num_experts_per_tok: 8
n_routing_groups: 8
topk_routing_group: 4
shared_experts: 1
routed_scaling_factor: 2.5
routed_score_func: "sigmoid"
routed_bias: true
decoder_block: "deepseek"
# MLA
attention_type: "mla"
q_lora_rank: 1536
kv_lora_rank: 512
qk_nope_head_dim: 128
qk_rope_head_dim: 64
v_head_dim: 128
mscale: 1.0
# RoPE
rope_type: "yarn"
rope_max_timescale: 10_000 # DeepSeek uses  "rope_theta": 10000
max_position_embeddings: 163840
original_max_position_embeddings: 4096
rope_factor: 40
beta_fast: 32
rope_interleave: true
rope_truncate: true
rope_attention_scaling: false
use_lineage: true
allow_split_physical_axes: true
capacity_factor: 0.5
num_vocab_tiling: 1
compile_xla_flags: "--xla_tpu_scoped_vmem_limit_kib=65536 --xla_tpu_enable_offloading_copy_to_sparsecore=false --xla_tpu_enable_sparse_core_collective_offload_dense_all_to_all=false --xla_tpu_check_legacy_constraints_in_reduce_scatter_legalizer=false --xla_tpu_sparse_core_all_gather_offload_min_size_in_bytes=1000000 --xla_all_gather_latency_bound_threshold_in_bytes=1000000"
shard_mode: "explicit"
sharding_tolerance: 1.0
remove_size_one_mesh_axis_from_type: false
override_logical_axis_rules: true
mesh_axes: ['x', 'y', 'z', 'core']
ici_parallelism: [4, 4, 16, 2]
data_sharding: [['x', 'y', 'z'], ['core']]
logical_axis_rules: [
  ['embed', ['x', 'y', 'z', 'core']],
  ['embed_vocab', ['x', 'y', 'z', 'core']],
  ['embed_attn', ['x', 'y', 'z', 'core']],
  ['q_lora', ['x', 'y', 'z', 'core']],
  ['kv_lora', ['x', 'y', 'z', 'core']],
  ['exp', ['x', 'y', 'core']],
  ['expert_only', ['x', 'y', 'core']],
  ['embed_moe', ['z']],
  ['activation_batch', ['x', 'y', 'z']],
  ['activation_batch_attn', ['x', 'y', 'z']],
  ['activation_batch_moe', ['x', 'y']],
  ['activation_length', ['core']],
  ['activation_norm_length', ['core']],
  ['activation_exp', ['x', 'y', 'core']],
  ['activation_embed_and_logits_batch', ['x', 'y', 'z']],
  ['activation_kv_batch', ['x', 'y', 'z']],
]


