# model config for gemma4-12b Dense (the `gemma4_unified` HF architecture)
#
# Same dense text tower as gemma4-31b, but the vision path has no ViT trunk.

base_num_decoder_layers: 48
base_emb_dim: 3840
base_num_query_heads: 16
base_num_kv_heads: 8
base_mlp_dim: 15360
mlp_activations: ["gelu","linear"]
head_dim: 256
global_head_dim: 512
global_num_kv_heads: 1
vocab_size: 262144
decoder_block: "gemma4"
normalization_layer_epsilon: 1e-6
logits_via_embedding: true
use_post_attn_norm: true
use_post_ffw_norm: true

# Attention
sliding_window_size: 1024
share_kv_projections: true
v_norm_with_scale: false

# RoPE scaling
local_rope_max_timescale: 10000
global_rope_max_timescale: 1000000
rope_max_timescale: 1000000
global_rope_proportion: 0.25
local_rope_proportion: 1.0
final_logits_soft_cap: 30.0

# Multimodal flags (need to set use_multimodal=true)
# patch_size_for_vit is the model patch size (16px patches merged 3x3), so
# 672x960 yields 14x20 = 280 soft tokens.
vision_encoder_block: "gemma4_unified"
image_size_for_vit: [672, 960]
num_channels_for_vit: 3
patch_size_for_vit: 48
conv_stride_for_vit: 48
hidden_size_for_vit: 3840
image_placeholder: "<|image|>"
vision_output_length: 280
num_position_embeddings_for_vit: 1120
