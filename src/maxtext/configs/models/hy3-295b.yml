# Model config for Hy3 (Tencent Hunyuan V3, https://huggingface.co/tencent/Hy3)
# 295B total / 21B active MoE. Standard GQA + QK-Norm attention (no MLA, no
# compressed/sparse attention) with a DeepSeek-V3-style aux-loss-free
# sigmoid+bias routed MoE (1 shared expert) and a dense first layer.

decoder_block: "hy3"

# --- Core Architectural Parameters ---
base_emb_dim: 4096
base_mlp_dim: 13312
base_num_query_heads: 64
base_num_kv_heads: 8
head_dim: 128
base_num_decoder_layers: 80
vocab_size: 120832
mlp_activations: ["silu", "linear"]
normalization_layer_epsilon: 1.0e-5
logits_via_embedding: false
enable_dropout: false

# --- Dense/MoE split: layer 0 is dense, layers 1-79 are MoE ---
first_num_dense_layers: 1

# --- MoE configuration (aux-loss-free sigmoid + bias router, 1 shared expert) ---
num_experts: 192
num_experts_per_tok: 8
base_moe_mlp_dim: 1536
shared_experts: 1
routed_score_func: "sigmoid"
routed_bias: true
routed_scaling_factor: 2.826
norm_topk_prob: true

# --- Attention: plain GQA + QK-Norm (no MLA, no compressed attention) ---
use_qk_norm: true
rope_max_timescale: 11158840
