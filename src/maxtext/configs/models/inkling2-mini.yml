# Model config for Inkling 2 Mini (thinkingmachines/Inkling-2-Mini).
# Looped MoE transformer: 24 physical layers (6 prelude, 12 looped core run 3x, 6 coda = 48 logical
# visits), 4x 6-layer Block AttnRes blocks (5 sliding + 1 full per block), NoPE + hidden-state-
# conditioned relative position bias + short causal convolutions + 128 routed experts (top-8, SiTU).

decoder_block: "inkling2"

# Core dimensions
base_emb_dim: 2304
base_num_query_heads: 24
base_num_kv_heads: 8
head_dim: 128
base_mlp_dim: 1152
base_moe_mlp_dim: 1152
base_num_decoder_layers: 24
normalization_layer_epsilon: 1.0e-6

# Vocab & LM head
vocab_size: 201024
unpadded_vocab_size: 200058
logits_via_embedding: false
cast_logits_to_fp32: true
final_logits_soft_cap: 30.0
max_position_embeddings: 1048576

# Looped core & Block AttnRes
attn_res_block_size: 6
inkling2_core_start: 6
inkling2_core_end: 18
inkling2_num_passes: 3
inkling2_message_gate_rank: 64

# Attention & Short Convolutions (No RoPE)
sliding_window_size: 1024
short_conv_kernel_size: 4
inkling2_d_rel: 16
inkling2_rel_extent: 1024
inkling2_qk_l2_clip_threshold: 22.627416997969522
inkling2_rel_l2_clip_threshold: 8.0
inkling2_log_scaling_n_floor: 8192.0
inkling2_log_scaling_alpha: 0.1

# Sparse MoE (Softcapped SwiGLU / SiTU + Auxiliary-Loss-Free Sigmoid Router)
num_experts: 128
num_experts_per_tok: 8
shared_experts: 0
mlp_activations: ["situ_gate", "situ_linear"]
mlp_gate_softcap: 4.0
mlp_up_softcap: 25.0
routed_score_func: "sigmoid"
routed_scaling_factor: 8.0
routed_bias: true
routed_bias_update_rate: 0.0
n_routing_groups: -1
topk_routing_group: -1
float32_gate_logits: true
gate_matmul_precision: "highest"
float32_weight_sum: true
load_balance_loss_weight: 0.0
norm_topk_prob: true

# General & Tokenizer
enable_dropout: false
tokenizer_type: "huggingface"
tokenizer_path: "thinkingmachines/Inkling-2-Mini"
