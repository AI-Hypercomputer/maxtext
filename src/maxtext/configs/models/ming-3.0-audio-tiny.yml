# inclusionAI/Ming-3.0-audio-tiny: BailingMoeV3 hybrid text decoder + whisper audio encoder.
# Audio + text input -> text output.
#
# Text decoder: 24 layers, 4-layer cycle of 3x Kimi Delta Attention (KDA) + 1x gated MLA
# (layers 3, 7, ..., 23). Layer 0 uses a dense SwiGLU MLP, layers 1..23 use a DeepSeek-style
# sigmoid-routed MoE (128 experts, top-8, 8 groups / top-4 groups, 1 shared expert).

decoder_block: "ming"
base_emb_dim: 1536
base_num_decoder_layers: 24
base_num_query_heads: 16
base_num_kv_heads: 16
head_dim: 128
vocab_size: 157184
normalization_layer_epsilon: 1.0e-6
logits_via_embedding: false
enable_dropout: false
mlp_activations: ["silu", "linear"]
inhomogeneous_layer_cycle_interval: 4

# Dense MLP (layer 0) and MoE (layers 1..23)
base_mlp_dim: 4608
first_num_dense_layers: 1
base_moe_mlp_dim: 512
num_experts: 128
num_experts_per_tok: 8
shared_experts: 1
routed_scaling_factor: 2.5
routed_score_func: "sigmoid"
routed_bias: true
# Inference scope: training and loss-free router bias updates are not yet supported/validated.
routed_bias_update_rate: 0.0
n_routing_groups: 8
topk_routing_group: 4
float32_gate_logits: true

# Kimi Delta Attention (linear attention) layers
gdn_conv_kernel_dim: 4
kda_lower_bound: -5.0

# Gated MLA (softmax attention) layers
attention_type: "mla"
q_lora_rank: 256
kv_lora_rank: 512
qk_nope_head_dim: 128
qk_rope_head_dim: 64
v_head_dim: 128
mscale: 1.0
# Plain (unscaled) RoPE on the interleaved rope dims: YaRN with factor 1 is the identity scaling.
rope_type: "yarn"
rope_max_timescale: 6_000_000
max_position_embeddings: 131072
original_max_position_embeddings: 131072
rope_factor: 1
rope_interleave: true
rope_truncate: true
rope_attention_scaling: false
# Cache the compressed latent + rope key (the naive cache assumes head_dim == qk_head_dim).
mla_naive_kvcache: false

# Whisper audio encoder + conv projector
use_multimodal: true
use_audio: true
d_model_for_audio: 1280
encoder_layers_for_audio: 32
encoder_attention_heads_for_audio: 20
encoder_ffn_dim_for_audio: 5120
num_mel_bins_for_audio: 128
max_source_positions_for_audio: 3000
num_conv_layers_for_audio: 3
output_dim_for_audio: 1536
attention_dropout_for_audio: 0.0
ming_audio_chunk_size: 3000
ming_norm_audio_embeds: true
