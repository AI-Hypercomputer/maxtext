# TEST/SMOKE-CHECK config for Hy3 (Tencent Hunyuan V3, https://huggingface.co/tencent/Hy3).
# Not the real model -- small dims/layer count for fast local iteration with random
# init. Architecturally significant fields (routing, norm epsilon, QK-Norm) keep
# their real hy3-295b values. For the full-scale model, use hy3-295b.yml.

decoder_block: "hy3"

# --- Small dims for fast debugging ---
base_emb_dim: 256
base_mlp_dim: 512
base_num_query_heads: 8
base_num_kv_heads: 2
head_dim: 64
base_num_decoder_layers: 4
vocab_size: 1000

# --- Standard Defaults ---
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-5
mlp_activations: ["silu", "linear"]

# --- Hy3 dense/MoE split ---
first_num_dense_layers: 1

# --- MoE configuration (aux-loss-free sigmoid + bias router, 1 shared expert) ---
num_experts: 8
num_experts_per_tok: 2
base_moe_mlp_dim: 128
shared_experts: 1
routed_score_func: "sigmoid"
routed_bias: true
routed_scaling_factor: 2.826
norm_topk_prob: true

# --- Attention: plain GQA + QK-Norm (no MLA, no compressed attention) ---
use_qk_norm: true
rope_max_timescale: 11158840
