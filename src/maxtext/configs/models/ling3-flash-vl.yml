# maxtext/configs/models/ling3-flash-vl.yml

decoder_block: "ling3"

# Core Architectural Parameters
base_emb_dim: 2560
base_num_decoder_layers: 42
base_num_query_heads: 32
base_num_kv_heads: 32
head_dim: 128
vocab_size: 157184
normalization_layer_epsilon: 1.0e-6

# Dense MLP Parameters (Layers 0, 1)
base_mlp_dim: 6144
mlp_activations: ["silu", "linear"]

# MoE Specific Parameters (Layers 2..41)
base_moe_mlp_dim: 768
num_experts: 512
shared_experts: 1
num_experts_per_tok: 8
routed_scaling_factor: 2.5
routed_score_func: "sigmoid"
norm_topk_prob: true
routed_bias: true
first_num_dense_layers: 2

# Inhomogeneous Attention Parameters (5 KDA linear layers + 1 MLA layer per cycle)
inhomogeneous_layer_cycle_interval: 6

# RoPE Settings
rope_max_timescale: 6000000
partial_rotary_factor: 0.5

# General Model Settings
enable_dropout: false
logits_via_embedding: false

# Text-only bring-up uses individually indexed layers (dense prefix and late clipping).
scan_layers: false
n_routing_groups: 8
topk_routing_group: 4
q_lora_rank: 0
kv_lora_rank: 512
qk_nope_head_dim: 128
qk_rope_head_dim: 64
v_head_dim: 128
