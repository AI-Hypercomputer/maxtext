decoder_block: "qwen3_5"

# Core Architectural Parameters (Tiny scale for fast smoke testing on v5p-8)
base_emb_dim: 1024
base_num_decoder_layers: 4
base_num_query_heads: 16
base_num_kv_heads: 2
head_dim: 128
vocab_size: 32768
normalization_layer_epsilon: 1.0e-6

# MoE Specific Parameters
base_mlp_dim: 512
base_moe_mlp_dim: 512
num_experts: 8
shared_experts: 1
num_experts_per_tok: 2
norm_topk_prob: True

# GatedDeltaNet Specific Parameters for Linear Attention (GDN)
inhomogeneous_layer_cycle_interval: 2
gdn_conv_kernel_dim: 4
gdn_key_head_dim: 128
gdn_value_head_dim: 128
gdn_num_key_heads: 16
gdn_num_value_heads: 32
gdn_chunk_size: 64
use_gdn_kernel: True
use_qk_norm_in_gdn: True

# RoPE Settings
rope_max_timescale: 10000000
partial_rotary_factor: 0.25

# General Model Settings
enable_dropout: False
