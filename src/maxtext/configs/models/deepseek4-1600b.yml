# Model config for DeepSeek-V4-Pro (https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro)

base_emb_dim: 7168
base_num_query_heads: 128
base_num_kv_heads: 1
base_num_decoder_layers: 61
base_mlp_dim: 3072
base_moe_mlp_dim: 3072
vocab_size: 129280
head_dim: 512
qk_rope_head_dim: 64

# --- Standard Defaults ---
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-6

# --- V4 Specific Architectural Keys ---
decoder_block: "deepseek4"
mhc_expansion_rate: 4
first_num_hash_layers: 3
indexer_head_dim: 128
indexer_n_heads: 64
indexer_topk: 1024

# Note: 61 layers matching deepseek-ai/DeepSeek-V4-Pro config.json
compress_ratios: [128, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 0]

# --- MoE configuration ---
mlp_activations: ["silu", "linear"]
num_experts: 384
num_experts_per_tok: 6
mlp_activations_limit: 10
shared_experts: 1
routed_score_func: "sqrtsoftplus"
norm_topk_prob: true
routed_bias: true
routed_bias_update_rate: 0.001
load_balance_loss_weight: 0.0001
log_moe_bias_norms: false
routed_scaling_factor: 2.5

# --- Attention configuration ---
attention: 'dot_product'
attention_type: 'compressed'
q_lora_rank: 1536
o_groups: 16
o_lora_rank: 1024
sliding_window_size: 128

# --- RoPE ---
rope_type: "yarn"
rope_max_timescale: 10000                  # Main RoPE theta
compressed_rope_max_timescale: 160000      # Compressed RoPE theta
max_position_embeddings: 1048576
original_max_position_embeddings: 65536
rope_factor: 16
beta_fast: 32
beta_slow: 1

# --- Dtype --- 
weight_dtype: bfloat16
dtype: bfloat16

