# Minimal Kimi K3 config for fast local checkpoint conversion & verification
# 4 layers total: 3 KDA layers + 1 MLA layer
# Full emb_dim = 7168 matching HuggingFace Kimi K3 specs

# Model Architecture
model_name: "kimi-k3"
decoder_block: "kimi_k3"
base_emb_dim: 7168
base_num_decoder_layers: 2
scan_layers: false
attention_type: "mla"



base_num_query_heads: 64
base_num_kv_heads: 64
head_dim: 128

base_mlp_dim: 33792
vocab_size: 163840

# Layer Types (1 KDA + 1 MLA)
kda_layers: [1]
full_attn_layers: [2]


# KDA Specs
kda_conv_kernel_size: 4



# MLA Specs
mla_use_output_gate: true
kv_lora_rank: 512
q_lora_rank: 1536
qk_rope_head_dim: 64
qk_nope_head_dim: 128
v_head_dim: 128

# MoE Specs (896 experts, 16 active, 2 shared)
first_num_dense_layers: 1
num_experts: 896
num_experts_per_tok: 16
shared_experts: 2
base_moe_mlp_dim: 3072
routed_expert_hidden_size: 3584
routed_scaling_factor: 1.0



routed_score_func: "sigmoid"
topk_method: "noaux_tc"
routed_bias: true
latent_moe_use_norm: true

# Activations (SituAndMul: situ + linear_beta_tanh)
mlp_activations: ["situ", "linear_beta_tanh"]
activation_situ_beta: 4.0


activation_situ_linear_beta: 25.0

# RoPE & Context
max_position_embeddings: 4096
rope_type: "yarn"
