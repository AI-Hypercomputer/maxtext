# model config for Kimi-K3
# Architecture: 93 layers (23 cycles of 3 KDA + 1 MLA, Layer 0 dense MLP, Layers 1-92 Latent MoE)

# Model Dimensions
base_emb_dim: 7168
base_num_decoder_layers: 93
base_num_query_heads: 96
base_num_kv_heads: 96
head_dim: 128
vocab_size: 163840
normalization_layer_epsilon: 1.0e-5

# Attention Architecture (MLA & KDA)
attention_type: "mla"
q_lora_rank: 1536
kv_lora_rank: 512
qk_nope_head_dim: 128
qk_rope_head_dim: 64
v_head_dim: 128

# Linear Attention (KDA) Parameters
short_conv_kernel_size: 4
use_full_rank_gate: true

# Hybrid Layer Specifications (23 cycles of 4 layers: 3 KDA + 1 MLA; Layer 92 MLA)
inhomogeneous_layer_cycle_interval: 4
full_attn_layers: [
  3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47, 51, 55, 59, 63, 67, 71, 75, 79, 83, 87, 91, 92
]
kda_layers_per_cycle: 3
mla_layers_per_cycle: 1
num_cycles: 23

# Attention Residuals (AttnRes)
attn_res_block_size: 12

# MLP and MoE Specifications
first_num_dense_layers: 1
first_k_dense_replace: 1
mlp_activations: ["situ", "linear"]
# `base_mlp_dim` is the layer-0 dense MLP width (HF `intermediate_size`); the MoE
# shared expert uses `shared_intermediate_size` = moe_intermediate_size * num_shared_experts.
base_mlp_dim: 33792
shared_intermediate_size: 6144
base_moe_mlp_dim: 3072
moe_intermediate_size: 3072
routed_expert_hidden_size: 3584
num_experts: 896
num_experts_per_tok: 16
shared_experts: 2
num_shared_experts: 2
routed_scaling_factor: 1.0
routed_score_func: "sigmoid"
routed_bias: true

# Sequence Length & RoPE
# Kimi-K3 uses NoPE for its MLA layers (HF `mla_use_nope: true`) and ships no
# `rope_scaling` block. `original_max_position_embeddings` is pinned equal to
# `max_position_embeddings` so that MLA's YaRN `mscale` softmax rescaling stays
# disabled; the reference uses a plain 1/sqrt(qk_head_dim) scale.
max_target_length: 1048576
max_position_embeddings: 1048576
original_max_position_embeddings: 1048576
rope_theta: 500000.0
rope_max_timescale: 500000.0
rope_type: "yarn"

# General Settings
decoder_block: "kimi_linear"
enable_dropout: false
logits_via_embedding: false
tokenizer_type: "tiktoken"
