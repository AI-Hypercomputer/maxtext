# Model config for Kimi-K3 (Text Backbone: KimiLinearModel)
# See https://huggingface.co/moonshotai/Kimi-K3 for more details.

decoder_block: "kimi_k3"
pure_nnx: true

# Core Architectural Parameters
base_emb_dim: 7168
base_num_decoder_layers: 93
base_num_query_heads: 96
base_num_kv_heads: 96
head_dim: 128
vocab_size: 163840
normalization_layer_epsilon: 1.0e-5

# Hybrid Layer Structure (69 KDA + 24 MLA)
kda_layers: [1,2,3,5,6,7,9,10,11,13,14,15,17,18,19,21,22,23,25,26,27,29,30,31,33,34,35,37,38,39,41,42,43,45,46,47,49,50,51,53,54,55,57,58,59,61,62,63,65,66,67,69,70,71,73,74,75,77,78,79,81,82,83,85,86,87,89,90,91]
full_attn_layers: [4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,93]

# KDA (Kimi Decoupled Attention / Linear Attention)
kda_conv_kernel_size: 4
kda_use_full_rank_gate: true
kda_gate_lower_bound: -5.0

# MLA (Multi-Head Latent Attention)
attention_type: "mla"
q_lora_rank: 1536
kv_lora_rank: 512
qk_nope_head_dim: 128
qk_rope_head_dim: 64
v_head_dim: 128
mla_use_output_gate: true

# Activation
mlp_activations: ["situ", "linear_beta_tanh"]
activation_situ_beta: 4.0
activation_situ_linear_beta: 25.0

# MoE (896 routed experts, 16 active, 2 shared)
num_experts: 896
num_experts_per_tok: 16
shared_experts: 2
base_moe_mlp_dim: 3072
routed_expert_hidden_size: 3584
routed_scaling_factor: 1.0
routed_score_func: "sigmoid"
topk_method: "noaux_tc"
routed_bias: true
latent_moe_use_norm: true


# RoPE & Context
max_position_embeddings: 1048576
rope_type: "yarn"
rope_max_timescale: 50000
rope_factor: 32
beta_fast: 1
beta_slow: 1
