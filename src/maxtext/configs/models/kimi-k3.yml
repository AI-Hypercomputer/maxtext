# model config for Kimi-K3
# See https://huggingface.co/moonshotai/Kimi-K3

decoder_block: "kimi_k3"

base_emb_dim: 7168
base_num_query_heads: 96
base_num_kv_heads: 96
base_mlp_dim: 33792
base_moe_mlp_dim: 3072
# Experimental text-only bring-up covers the first four layers.
base_num_decoder_layers: 4
first_num_dense_layers: 1
mlp_activations: ["situ", "linear"]
vocab_size: 163840
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-5
num_experts: 896
num_experts_per_tok: 16
shared_experts: 2
routed_scaling_factor: 1.0
routed_score_func: "sigmoid"
routed_bias: true
float32_gate_logits: true

# MLA Attention
attention_type: "mla"
q_lora_rank: 1536
kv_lora_rank: 512
qk_nope_head_dim: 128
qk_rope_head_dim: 64
v_head_dim: 128
mscale: 1.0

# Linear Attention (KDA / GatedDeltaNet)
inhomogeneous_layer_cycle_interval: 4
gdn_conv_kernel_dim: 4
kda_head_dim: 128
kda_num_heads: 96
kda_gate_lower_bound: -5.0

# Latent MoE & Attention Residual
routed_expert_hidden_size: 3584
attn_res_block_size: 12
activation_situ_beta: 4.0
activation_situ_linear_beta: 25.0

# RoPE
rope_type: "yarn"
rope_max_timescale: 10000.0
max_position_embeddings: 1048576
original_max_position_embeddings: 4096
rope_factor: 1

scan_layers: false
