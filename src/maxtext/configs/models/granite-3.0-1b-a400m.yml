# M3 model config for ibm-granite/granite-3.0-1b-a400m-instruct
# Compatible with both pyconfig.initialize (MaxTextConfig) and maxtext.m3.configs.config.initialize (BaseConfig).
# Granite-specific scalar multipliers (embedding_multiplier=12.0, attention_multiplier=0.015625,
# residual_multiplier=0.22, logits_scaling=6.0) are canonical defaults on GraniteMoeConfig.

model_name: "granite-3.0-1b-a400m"
use_m3_model: true
param_scan_axis: 0

base_emb_dim: 1024
base_num_query_heads: 16
base_num_kv_heads: 8
base_mlp_dim: 512
base_moe_mlp_dim: 512
base_num_decoder_layers: 24
head_dim: 64
num_experts: 32
num_experts_per_tok: 8
mlp_activations: ["silu", "linear"]
vocab_size: 49155

normalization_layer_epsilon: 1.0e-6
rope_max_timescale: 10000.0
logits_via_embedding: true
load_balance_loss_weight: 0.0  # HF: router_aux_loss_coef=0.0
enable_dropout: false
tokenizer_type: "huggingface"
