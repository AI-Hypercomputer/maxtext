base_emb_dim: 4096
base_num_query_heads: 64
base_num_kv_heads: 64
base_mlp_dim: 12288
base_moe_mlp_dim: 2048
base_num_decoder_layers: 45
vocab_size: 154880
normalization_layer_epsilon: 1.0e-5
num_experts: 288
num_experts_per_tok: 8
shared_experts: 1
routed_scaling_factor: 2.5
first_num_dense_layers: 3
q_lora_rank: 1536
kv_lora_rank: 512
qk_nope_head_dim: 256
qk_rope_head_dim: 0
v_head_dim: 256
# Required by MaxTextConfig validator when use_indexer is true:
attention_type: "mla"
attention: "dot_product"
use_indexer: true
indexer_n_heads: 32
indexer_head_dim: 128
indexer_topk: 2048
indexer_loss_scaling_factor: 0.0
routed_score_func: "sigmoid"
routed_bias_update_rate: 0.0
norm_topk_prob: true
n_routing_groups: 1
topk_routing_group: 1
mhc_expansion_rate: 4
sinkhorn_iterations: 20
mtp_num_layers: 1
mtp_loss_scaling_factor: 0.1
# Explicit training default matching HF router_aux_loss_coef=0.001 (applied
# when output_router_logits=True); sole MoE balancing mechanism while
# routed_bias_update_rate=0.0 (FU-D4).
load_balance_loss_weight: 0.001
mlp_activations_limit: 10.0
packing: false
use_m3_model: true
