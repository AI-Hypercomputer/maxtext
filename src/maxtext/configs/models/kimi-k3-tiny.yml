# Tiny Kimi-K3 model config for fast local testing

decoder_block: "kimi_k3"
pure_nnx: true

# Core Architectural Parameters (scaled down)
base_emb_dim: 256
base_num_decoder_layers: 4
base_num_query_heads: 4
base_num_kv_heads: 4
head_dim: 64
vocab_size: 1000
normalization_layer_epsilon: 1.0e-5

# Hybrid Layer Structure (3 KDA + 1 MLA)
kda_layers: [1, 2, 3]
full_attn_layers: [4]

# KDA (Kimi Decoupled Attention / Linear Attention)
kda_conv_kernel_size: 4
kda_use_full_rank_gate: true
kda_gate_lower_bound: -5.0

# MLA (Multi-Head Latent Attention)
attention_type: "mla"
q_lora_rank: 64
kv_lora_rank: 32
qk_nope_head_dim: 32
qk_rope_head_dim: 32
v_head_dim: 32
mla_use_output_gate: true

# Activation
mlp_activations: ["situ"]
activation_situ_beta: 4.0
activation_situ_linear_beta: 25.0

# MoE (4 routed experts, 2 active, 1 shared)
num_experts: 4
num_experts_per_tok: 2
shared_experts: 1
base_moe_mlp_dim: 128
routed_expert_hidden_size: 128
routed_scaling_factor: 1.0
routed_score_func: "sigmoid"
topk_method: "noaux_tc"
latent_moe_use_norm: true

# RoPE & Context
max_position_embeddings: 4096
rope_type: "yarn"
rope_max_timescale: 50000
rope_factor: 1
beta_fast: 1
beta_slow: 1
