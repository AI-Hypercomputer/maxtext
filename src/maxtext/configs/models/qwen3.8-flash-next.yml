# maxtext/configs/models/qwen3.8-flash-next.yml

# Set decoder block to our Qwen3.8-Flash-Next implementation
decoder_block: "qwen3_8_flash_next"

# Core Architectural Parameters
base_emb_dim: 2560
base_num_decoder_layers: 48
base_num_query_heads: 24
base_num_kv_heads: 2
head_dim: 256
vocab_size: 248320
normalization_layer_epsilon: 1.0e-6

# MoE Specific Parameters
base_mlp_dim: 640
base_moe_mlp_dim: 640
num_experts: 512
shared_experts: 1
num_experts_per_tok: 10
norm_topk_prob: true
float32_gate_logits: true

# Inhomogeneous Linear Attention (Gated Delta Net) & Full Attention Cycle
inhomogeneous_layer_cycle_interval: 4
gdn_conv_kernel_dim: 4
gdn_key_head_dim: 128
gdn_value_head_dim: 128
gdn_num_key_heads: 16
gdn_num_value_heads: 48
gdn_chunk_size: 64

# HyperConnection Parameters
hc_count: 4
hc_lowrank: 320

# PLE (Per-Layer Embedding) Parameters
ple_layer_ids: "(2,)"
ple_embed_dim: 2560
ple_conv_kernel_size: 4
ngram_size: 3
ngram_vocab_size_base: 20000000
heads_per_ngram: 8

# RoPE Settings
rope_max_timescale: 10000000
partial_rotary_factor: 0.25

# General Model Settings
enable_dropout: false
scan_layers: false

# GDN settings
output_gate_type: sigmoid
use_qk_norm_in_gdn: true
