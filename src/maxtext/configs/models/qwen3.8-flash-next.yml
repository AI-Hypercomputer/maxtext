# model config for qwen3.8-flash-next (180B total / 6B active)

decoder_block: "qwen3_next"

# Core Architectural Parameters
base_emb_dim: 2560  # HF: hidden_size=2560
base_num_decoder_layers: 48  # HF: num_hidden_layers=48
base_num_query_heads: 24  # HF: num_attention_heads=24
base_num_kv_heads: 2  # HF: num_key_value_heads=2
head_dim: 256  # HF: head_dim=256
vocab_size: 248320  # HF: vocab_size=248320
normalization_layer_epsilon: 1.0e-6  # HF: rms_norm_eps=1.0e-6
logits_via_embedding: false

# Hyper-Connections (HC) Parameters
hc_count: 4  # HF: hc_count=4
hc_lowrank: 320  # HF: hc_lowrank=320

# MoE Specific Parameters
base_mlp_dim: 640  # HF config.json: shared_expert_intermediate_size=640
base_moe_mlp_dim: 640  # HF config.json: moe_intermediate_size=640 (class default is 512)
num_experts: 512  # HF: num_experts=512
num_experts_per_tok: 10  # HF: num_experts_per_tok=10
shared_experts: 1
routed_scaling_factor: 1.0
norm_topk_prob: true  # HF: norm_topk_prob=true
load_balance_loss_weight: 0.001  # HF: router_aux_loss_coef=0.001

# Gated DeltaNet (GDN) Linear Attention Parameters
inhomogeneous_layer_cycle_interval: 4  # HF: full_attention_interval=4
gdn_conv_kernel_dim: 4  # HF: linear_conv_kernel_dim=4
gdn_key_head_dim: 128  # HF: linear_key_head_dim=128
gdn_value_head_dim: 128  # HF: linear_value_head_dim=128
gdn_num_key_heads: 16  # HF: linear_num_key_heads=16
gdn_num_value_heads: 48  # HF: linear_num_value_heads=48
gdn_chunk_size: 64
gdn_output_gate_activation: "sigmoid"  # HF: output_gate_type="sigmoid"
use_qk_norm_in_gdn: true

# RoPE and Interleaved mRoPE
rope_max_timescale: 10000000.0  # HF: rope_theta=10000000.0
partial_rotary_factor: 0.25  # HF: partial_rotary_factor=0.25
mrope_section: [11, 11, 10]  # HF: mrope_section=[11, 11, 10]

# QSA and Indexer Parameters
index_n_heads: 4  # HF: indexer_n_heads=4
index_kv_heads: 1  # HF: indexer_kv_heads=1
index_head_dim: 128  # HF: indexer_head_dim=128
index_select_block_size: 4  # HF: indexer_compress_ratio=4
index_select_budget: 2048  # HF: indexer_budget=2048

# Per-Layer Embedding (PLE) Parameters
use_ple_layer: true
ple_layer_id: 1  # HF: ple_layer_ids=[2] (0-indexed layer 1 = 1-indexed layer 2)
ple_embed_dim: 2560  # HF: ple_embed_dim=2560 (defaults to hidden_size)
ple_conv_kernel_size: 4  # HF: ple_conv_kernel_size=4
ngram_size: 3  # HF: ngram_size=3
heads_per_ngram: 8  # HF: heads_per_ngram=8
ngram_vocab_size_base: 20000000  # HF: ngram_vocab_size_base=20000000
make_ngram_vocab_size_divisible_by: 128  # HF: make_ngram_vocab_size_divisible_by=128
split_ngram_parts: 128  # HF config.json: split_ngram_parts=128 (class default in configuration_qwen4_exp.py is 512)
ple_seed: 1234  # HF: seed=1234
ple_eos_token_id: 248044  # HF: eos_token_id=248044

# Multi-Token Prediction (MTP) Parameters
mtp_num_layers: 1
mtp_loss_scaling_factor: 0.1

# General Model Settings
use_m3_model: true
param_scan_axis: 0
enable_dropout: false
