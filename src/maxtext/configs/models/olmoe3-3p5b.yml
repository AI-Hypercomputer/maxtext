# model config for OLMoE3 3.5B-active / 62.9B-total (AI2 OLMo-core `3p5b` rung).
#
# Reference: allenai/OLMo-core@akshitab/standalone, src/scripts/standalone/.
# Canonical parameter counts this config must reproduce:
#   total 62,864,102,080 / active 3,475,903,168 / active non-embedding 3,296,072,384
#
# head_dim, moe_mlp_dim (expert hidden) and moe_expert_input_dim (latent) are all
# multiples of 256 for MXU alignment; see the TPU co-design guide, Principle 1.

base_emb_dim: 1792
base_num_query_heads: 8
base_num_kv_heads: 4
head_dim: 256
base_num_decoder_layers: 30

# Layer 0 is dense with a wide SwiGLU (8 * d_model); MoE layers use a narrow
# shared expert at the routed-expert hidden width.
first_num_dense_layers: 1
base_mlp_dim: 14336
base_moe_mlp_dim: 1792

# Routed experts run in a compressed latent space; the router still scores the
# full-width residual (handled by OLMoE3LatentRoutedMoE).
num_experts: 512
num_experts_per_tok: 16
moe_expert_input_dim: 768

# Mixer cycle: full attention on every 5th layer (indices 4, 9, ... 29),
# Kimi Delta Attention elsewhere.
inhomogeneous_layer_cycle_interval: 5
gdn_num_key_heads: 8
gdn_num_value_heads: 8
gdn_key_head_dim: 256
gdn_value_head_dim: 512   # head_dim * kda_expand_v (2.0)
gdn_conv_kernel_dim: 4
gdn_chunk_size: 64

vocab_size: 100352
enable_dropout: false
logits_via_embedding: false   # untied LM head
normalization_layer_epsilon: 1.0e-6
mlp_activations: ["silu", "linear"]
use_qk_norm: true
decoder_block: "olmoe3"

# Auxiliary losses, matching OLMo-core's ladder settings. The router z-loss
# (1e-5) is a module constant in olmoe3.py.
load_balance_loss_weight: 0.01
# The reference computes router logits in fp32 (`x.float() @ w.float()`).
float32_gate_logits: true

# EMo document-pool routing, canonical ladder settings: min = top_k,
# max = eval = num_experts (standalone_model.py defaults).
emo_enabled: true
emo_min_document_expert_pool: 16
emo_max_document_expert_pool: 512
emo_eval_document_expert_pool: 512
