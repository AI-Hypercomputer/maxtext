# model config for GLM-5.2 - 744B (Mixture of Experts with Cross-Layer IndexShare)

base_emb_dim: 6144
base_num_query_heads: 64
base_num_kv_heads: 64
base_mlp_dim: 12288
base_moe_mlp_dim: 2048

base_num_decoder_layers: 78

first_num_dense_layers: 3
mlp_activations: ["silu","linear"]
vocab_size: 154880
enable_dropout: false
logits_via_embedding: false
normalization_layer_epsilon: 1.0e-5
num_experts: 256
num_experts_per_tok: 8
shared_experts: 1
routed_scaling_factor: 2.5
routed_score_func: "sigmoid"
routed_bias: true
float32_gate_logits: true
norm_topk_prob: true
decoder_block: "glm5"
dtype: "bfloat16"
weight_dtype: "bfloat16"

# Multi-head Latent Attention (MLA)
attention_type: "mla"
attention: "dot_product"
q_lora_rank: 2048
kv_lora_rank: 512
qk_nope_head_dim: 192
qk_rope_head_dim: 64
v_head_dim: 256

# RoPE
mscale: 1.0
rope_type: "yarn"
rope_max_timescale: 8000000 # "rope_theta": 8000000
max_position_embeddings: 1048576
original_max_position_embeddings: 4096
rope_factor: 1.0
beta_fast: 32
beta_slow: 1
rope_interleave: true
rope_truncate: true
rope_attention_scaling: false

# Indexer for Dynamic Sparse Attention (DSA)
use_indexer: true
indexer_n_heads: 32
indexer_head_dim: 128
indexer_topk: 2048

# GLM-5.2 Cross-Layer IndexCache / IndexShare (Exact 78-layer HF topology: 3 Dense Full + 18x(3 Shared + 1 Full) + 3 Shared)
use_index_share: true
index_share_pattern: "FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"
prune_shared_indexers: true
