# Isolated Weaver Mixture-of-Transformers diffusion & pathway configuration.
# Loaded directly by WeaverConfig in src/maxtext/models/weaver.py so that
# Weaver-specific diffusion parameters stay isolated from base.yml and types.py.

# Core Architectural Parameters
decoder_block: "weaver"
base_emb_dim: 4096
base_mlp_dim: 12288
base_num_query_heads: 32
base_num_kv_heads: 8
base_num_decoder_layers: 36
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 151936
normalization_layer_epsilon: 1.0e-6
use_qk_norm: true
logits_via_embedding: false

# RoPE & 3D M-RoPE Settings
rope_max_timescale: 5000000
enable_dropout: false
use_multimodal: true
use_mrope: true
mrope_section: [24, 20, 20]

# Weaver Diffusion & Dual-Pathway Settings
latent_channels: 48
patch_size: 2
time_embed_in_channels: 256
timestep_scale: 0.001
timestep_max_period: 10000
qk_norm_for_text: true
qk_norm_for_diffusion: true
use_und_k_norm_for_gen: false
weaver_block_q: 128
weaver_block_kv: 128
