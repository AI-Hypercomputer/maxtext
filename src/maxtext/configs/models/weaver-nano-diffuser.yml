# Model config for Weaver Nano Diffuser (36-layer MoT Joint Backbone)

# Core Architectural Parameters
decoder_block: "weaver"
base_emb_dim: 4096
base_mlp_dim: 12288
base_num_query_heads: 32
base_num_kv_heads: 8
base_num_decoder_layers: 36
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 151936
normalization_layer_epsilon: 1.0e-6
use_qk_norm: true
logits_via_embedding: false

# RoPE Settings
rope_max_timescale: 5000000

# General Model Settings
enable_dropout: false

# Multimodal & 3D M-RoPE Settings
use_multimodal: true
use_mrope: true
mrope_section: [24, 20, 20]
