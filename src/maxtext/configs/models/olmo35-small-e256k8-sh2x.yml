# model config for OLMo 3.5 small, Option A of the e256k8 family
# (E=256, K=8, F=3072, 2x shared expert = 3072; 4.123B active / 72.581B total).
#
# `olmo35-small.yml` (agagik-olmoe3-v4: d_model 1536, 40 layers, 7:1 KDA:attention, 512 experts top-16 of
# width 1536) under the transformation that makes `olmo35-tiny-e256k8-sh2x.yml` from `olmo35-tiny.yml`: half the
# experts (512 -> 256) and top-k (16 -> 8) at twice the routed expert width (1536 -> 3072), iso-total routed
# parameters and iso-active routed FLOPs, plus a 2x wider shared expert (1536 -> 3072). With head_dim 256
# instead of 128 (128 runs poorly on v7x), at the same widths: full attention 8 heads (4 KV) x 256, KDA 8 heads
# with key / value head dims 256 / 512 -- the head layout of `olmoe3-3p5b-e256k8-sh2x`.
# Parameter counts:
#   total 72,580,704,064 / active 4,123,371,328 / active non-embedding 3,969,230,656
#   (4:1, inhomogeneous_layer_cycle_interval=5: total 72,547,528,000 / active 4,090,195,264)

base_emb_dim: 1536
base_num_query_heads: 8
base_num_kv_heads: 4
head_dim: 256
base_num_decoder_layers: 40

# Layer 0 is dense with a wide SwiGLU (8 * d_model); MoE layers use a shared
# expert of width base_shared_expert_mlp_dim (3072 = 2 * base_emb_dim).
first_num_dense_layers: 1
base_mlp_dim: 12288
base_moe_mlp_dim: 3072
base_shared_expert_mlp_dim: 3072

# Routed experts run in a compressed latent space; the router still scores the
# full-width residual (handled by OLMoE3LatentRoutedMoE).
num_experts: 256
num_experts_per_tok: 8
moe_expert_input_dim: 768

# Mixer cycle: full attention on every 8th layer (indices 7, 15, ...),
# Kimi Delta Attention elsewhere.
inhomogeneous_layer_cycle_interval: 8
gdn_num_key_heads: 8
gdn_num_value_heads: 8
gdn_key_head_dim: 256
gdn_value_head_dim: 512   # head_dim * kda_expand_v (2.0)
gdn_conv_kernel_dim: 4
gdn_chunk_size: 128  # every small run so far passed 128 on the command line; a model config beats a config file

vocab_size: 100352
enable_dropout: false
logits_via_embedding: false   # untied LM head
normalization_layer_epsilon: 1.0e-6
mlp_activations: ["silu", "linear"]
decoder_block: "olmoe3"

# Embedding is scaled by sqrt(d_model) and then RMSNormed, before the stack.
scale_embeddings_by_sqrt_emb_dim: true
use_embedding_norm: true

# Full attention: NoPE, per-head QK RMSNorm gains, sigmoid output gate,
# and scalable softmax (log-span times a learned per-head gain).
use_qk_norm: true
qk_norm_per_head: true
use_scalable_softmax: true

# Auxiliary losses, matching OLMo-core's ladder settings. The router z-loss
# (1e-5) is a module constant in olmoe3.py.
load_balance_loss_weight: 0.01
# The reference computes router logits in fp32 (`x.float() @ w.float()`).
float32_gate_logits: true

# EMo document-pool routing, canonical settings for E=256, K=8:
# min = top_k (8), max = eval = num_experts (256).
emo_enabled: true
emo_min_document_expert_pool: 8
emo_max_document_expert_pool: 256
emo_eval_document_expert_pool: 256

# As OLMo-core: the load-balancing loss over the whole batch (expert counts averaged across the devices that shard
# the tokens), and vocab tiles cut along the sequence (no all-gather of the hidden states at one sequence per device).
moe_global_load_balancing: true
vocab_tiling_seq_major: true
