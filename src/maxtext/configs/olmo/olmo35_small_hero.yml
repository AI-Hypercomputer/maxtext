# OLMo 3.5 small hero: olmo35-small-e256k8-sh2x (7:1 KDA:attention, head_dim 256; 72.58B total / 4.12B active) on
# one Cloud TPU v4 8x8x48 slice (3,072 chips), Dolma 3.5 in OLMo-core's batch order.
#
#   python3 -m maxtext.trainers.pre_train.train src/maxtext/configs/olmo/olmo35_small_hero.yml \
#     run_name=<RUN_NAME> base_output_directory=<OUTPUT_DIR> enable_single_controller=<true: Pathways>
#
# Performance settings: Gagik's fastest measured 7:1 recipe, arm c1_71_hero_kfused_wy_ctx_c2 of gagik-pw-v4-8848-71c
# (Pathways, 2,339 ms a step, 31.8% MFU, 10.77M tokens/s). That run also set OLMOE3_ENABLE_2STAGE_RS=0,
# OLMOE3_FAST_HOST_LOOP=1 and OLMOE3_FAST_SC_DEVICE_PUT=1 in the driver's environment and released the pre-Zero-1
# parameter arrays after setup; both are the JobSet's job. Training settings: the OLMo-core hero recipe, as our
# tiny-sh2x hero replays ran it, plus EMo pool r3. CompletedP is on with this model as its own base, so every
# multiplier is 1 (a no-op that records the base for later transfer).
base_config: "base.yml"

# --- Model ---------------------------------------------------------------------------------------------------------
model_name: "olmo35-small-e256k8-sh2x"
override_model_config: true
# EMo pool r3: pool sizes 32 / 64 / 256 with probabilities 1/8, 1/8, 3/4 (mean 204 of 256 experts).
emo_document_expert_pool_choices: [32, 64, 256]
emo_document_expert_pool_probs: [0.125, 0.125, 0.75]
# EMo pools per EOS-delimited document, as OLMo-core (our ablations' setting; not in the c1 benchmark).
olmo_segment_eos_token_id: 100257
completedp_base_model_name: "olmo35-small-e256k8-sh2x"
weight_dtype: "float32"
dtype: "bfloat16"
float32_gate_logits: true
logits_dot_in_fp32: false

# --- Batch and mesh (one 8x8x48 slice) -------------------------------------------------------------------------------
# 3,072 chips x 1 sequence x 8,192 tokens = 3,072 sequences = 25,165,824 tokens a step, no gradient accumulation.
max_target_length: 8192
per_device_batch_size: 1.0
gradient_accumulation_steps: 1
num_slices: 1
dcn_data_parallelism: 1
ici_data_parallelism: 48
ici_expert_parallelism: 64
ici_fsdp_parallelism: 1
shard_exp_on_fsdp: false
allow_split_physical_axes: true
shard_optimizer_over_data: true  # Zero-1 over the 48 data-parallel ranks

# --- Training recipe (OLMo-core hero, LR as a function of duration) ------------------------------------------------
# One epoch of Dolma 3.5: 1,708,983,195 sequences = 556,309 full steps (14.0T tokens, 176.4 x Chinchilla).
# LR: the trunk of WSD with stepped peaks (the stages of OLMo-core's WSDSChinchillaRunConfigurator), the decays run
# as separate branches. Stages end at 1, 2, 4, ..., 128 x C and at the epoch's end; stage k holds learning_rate *
# c_k ** -0.28 to its end with no decay (wsds_in_run_decays: false). A decay branch for doubling k resumes from this run's
# checkpoint at stage k's fork (saved: wsds_save_forks) with steps = stage k's end, learning_rate_schedule_steps =
# 556309 and wsds_decay_stage = k: linear decay to 0 over the stage's last 10%. learning_rate is the 1xC optimum and
# the only LR to tune: the 1xC base_lr runs are this config's stage-0 branch. 1xC = 20 x 3,969,230,656 active
# non-embedding parameters = 79,384,613,120 tokens = 3,154.5 steps.
# The schedule is baked into the LR curve: set once, never change it on a resume.
steps: 556309
learning_rate: 1.1e-3  # base LR at 1xC: to be tuned on small at 1xC
lr_schedule_type: "wsds"
wsds_chinchilla_tokens: 79384613120
wsds_first_multiple: 1.0
wsds_decay_steps_fraction: 0.1
wsds_stepped: true
# Peaks at learning_rate * c_k ** -0.28, not OLMo-core's 1/sqrt(c): the best LR falls more slowly with duration in OLMo's
# ladder sweeps (oe-planning#29's Cx1/Cx2/Cx4 shift checks; Tanush's fit, 0.28) and Bjorck et al. (~0.32).
wsds_lr_exponent: 0.28
wsds_in_run_decays: false
wsds_save_forks: true  # labels 2838, 5992, 11986, ...: where each doubling's decay branch resumes
learning_rate_final_fraction: 0.0
# Warmup 1 token per parameter (OLMo-core's WSDSChinchillaRunConfigurator): 3.97B tokens = 158 steps, 5% of 1xC.
warmup_steps_fraction: 0.000284016  # 158 / 556,309, rounded up so int(steps * fraction) is 158
warmup_step_offset: 1
opt_type: "adamw"
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.e-8
adam_weight_decay: 0.1
adamw_mask: ["token_embedder/embedding"]
gradient_clipping_threshold: 1.0
z_loss_multiplier: 1.e-5
moe_aux_loss_reduction: "sum"  # OLMo-core: the load-balancing loss summed over MoE layers
olmo_loss_denominator_counts_masked_instances: true
skip_step_on_spikes: true

# --- Data ----------------------------------------------------------------------------------------------------------
dataset_type: "olmo_grain"
olmo_index_path: "/mnt/olmo-3p5-maxtext/indices/dolma3p5-14t_seq8192.json"
olmo_global_indices_path: "/mnt/olmo-3p5-maxtext/indices/global_indices_dataset_size1708983195_epoch1_seed928543231_v1.npy"
olmo_path_remap_from: "gs://pretraining-data/dolma3p5-14t-e6c5a51bd6b9/"
olmo_path_remap_to: "/mnt/dolma3p5-14t/"
data_shuffle_seed: 928543231
olmo_apply_ngram_filter: true
grain_worker_count: 8
grain_per_worker_buffer_size: 1
colocated_python_data_input: false
reuse_example_batch: 0
synthetic_data_reuse_batch: false

# --- Checkpoints, logging and evals ---------------------------------------------------------------------------------
enable_checkpointing: true
async_checkpointing: true
enable_orbax_v1: false
checkpoint_period: 1000
save_checkpoint_on_completion: true
log_period: 100
norm_metrics: "grad"
olmoe3_router_metrics: true  # OLMo-core's per-layer router metrics, CE and masked-instance fraction
olmoe3_router_metrics_interval: 100  # the load imbalances on the logged steps only (every step costs ~0.27 s)
olmoe3_router_metrics_scatter_counts: true
router_metrics_group_seqs: 16  # OLMo-core's per-GPU batch for the local load imbalance
olmo_ppl_eval_interval: 1000
olmo_ppl_eval_dir: "/mnt/olmo-3p5-maxtext/eval-data/perplexity/v3_small_dolma2-tokenizer"
eval_ragged_buffer_factor: 2.0  # the ppl program's MoE buffer (no drops at 2.0 on a v4-8; dropless needs more HBM)
abort_on_nan_loss: false
abort_on_inf_loss: false
enable_tensorboard: false
enable_goodput_recording: false
monitor_goodput: false
enable_checkpoint_cloud_logger: false

# --- Performance (Gagik's c1 arm) ------------------------------------------------------------------------------------
scan_layers: false
olmoe3_per_layer_remat: true
remat_policy: "custom"
decoder_layer_input: "device"
context: "device"
query_proj: "device"
key_proj: "device"
value_proj: "device"
out_proj: "device"
attention_out: "device"
mlpwi: "device"
mlpwi_0: "device"
mlpwi_1: "device"
mlpwo: "device"
gathered_weights: "device"
moe_router_logits: "device"
moe_routing: "device"
moe_x_sorted: "device"
moe_combine: "device"
kda_wy: "device"
kda_proj: "remat"
kda_fused: "device"
kda_fused_residuals: "wy"
kda_fused_state_stride: 0
kda_flat_head_layout: true
kda_fused_proj_reduce_scatter: true
kda_fused_input_proj: true
kda_pallas_fused: true
kda_fused_token_major: true
kda_outer_block: 32
kda_inverse_precision: "high"
kda_chunked_impl: "subblock"
kda_sub_block: 16
kda_conv_in_compute_dtype: false
use_tokamax_kda: false
gdn_chunk_size: 128  # also the model config's: a model config overrides this file (only command-line args beat it)
gdn_state_dtype: "float32"
attention: "flash"
olmoe3_replicate_router: true
olmoe3_segments_for_emo_only: true
emo_threshold_by_bisection: true
moe_global_load_balancing: true
capacity_factor: -1
ragged_buffer_factor: 1.0625
moe_lean_routing: true
moe_topk_pallas: true
moe_a2a_expert_major: true
moe_a2a_pipeline_chunks: false
moe_a2a_token_chunks: 2
megablox: true
sparse_matmul: true
use_tokamax_gmm: false
use_gmm_v2: false
moe_fused_swiglu_gmm: true
# Megablox tiles for the 3,072-wide experts.
wi_tile_fwd_batch_seq: 512
wi_tile_fwd_embed_dim: 768
wi_tile_fwd_mlp_dim: 768
wi_tile_dlhs_batch_seq: 512
wi_tile_dlhs_embed_dim: 384
wi_tile_dlhs_mlp_dim: 1536
wi_tile_drhs_batch_seq: 512
wi_tile_drhs_embed_dim: 768
wi_tile_drhs_mlp_dim: 768
wo_tile_fwd_batch_seq: 512
wo_tile_fwd_embed_dim: 384
wo_tile_fwd_mlp_dim: 1536
wo_tile_dlhs_batch_seq: 512
wo_tile_dlhs_embed_dim: 768
wo_tile_dlhs_mlp_dim: 768
wo_tile_drhs_batch_seq: 512
wo_tile_drhs_embed_dim: 384
wo_tile_drhs_mlp_dim: 768
moe_fused_swiglu_bwd_tile_batch_seq: 256
moe_fused_swiglu_bwd_tile_embed_dim: 768
moe_fused_swiglu_bwd_tile_mlp_dim: 768
moe_fused_swiglu_dwo_tile_embed_dim: 768
moe_fused_swiglu_dwo_tile_mlp_dim: 768
fused_lm_head_ce: true
fused_lm_head_ce_block_t: 512
fused_lm_head_ce_block_v: 1024
fused_lm_head_ce_block_t_bwd: 512
fused_lm_head_ce_block_v_bwd: 128
num_vocab_tiling: 4
vocab_tiling_ag_once: true
vocab_tiling_seq_major: true
