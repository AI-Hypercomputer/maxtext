# Variant of cp-as-ep.yml whose only difference is that the dense weights are sharded on fsdp only.
#
# As cp-as-ep-dense-no-cp.yml, but the dense weights ('embed', 'embed_attn', 'q_lora', 'kv_lora') are also replicated
# over the expert axis: their all-gathers run in context x expert independent fsdp groups, and their gradients are
# reduce-scattered over all devices ('embed_grad') and then all-gathered over context x expert. Twice the HBM of
# cp-as-ep-dense-no-cp.yml for those weights. The GatedDeltaNet projections ('embed_gdn'), activations, the
# vocabulary weights and the routed experts are as in cp-as-ep, and RoutedMoE uses ("context", "expert") as its
# expert-parallel axes.
#
# This rule uses data, stage, FSDP, context, and expert. Context axis acts as expert
# parallelism in core MoE part (between EP all2all).
mesh_axes: ['data', 'stage', 'fsdp', 'context', 'expert']
data_sharding: [['data', 'stage', 'fsdp', 'context', 'expert']]
logical_axis_rules: [
                      # ==========================================
                      # Vocabulary Embedding
                      # ==========================================
                      # Vocab Activations
                      ['activation_embed_and_logits_batch', ['data', 'stage', 'fsdp', 'expert']],
                      # Vocabulary tiling flattens [batch, length] into one dimension. It must also be sharded
                      # over the length axis (context), or every context rank computes the logits of all the
                      # context shards. context is last because it is the minor part of the flattened index.
                      ['activation_embed_and_logits_batch_sequence', ['data', 'stage', 'fsdp', 'expert', 'context']],
                      # Vocab Weights
                      ['vocab', []],
                      ['embed_vocab', ['fsdp', 'context', 'expert']],
                      # ==========================================
                      # Attention
                      # ==========================================
                      # Attention Activations
                      ['activation_batch_attn', ['data', 'fsdp', 'expert']],
                      ['activation_heads', []],
                      ['activation_kv_heads', []],
                      ['activation_length_attn', ['context']],
                      ['activation_q_length', ['context']],
                      ['activation_kv_length', []],
                      ['activation_embed_attn', []],
                      ['activation_kv', []],
                      ['activation_kv_batch', ['data', 'fsdp', 'expert']],
                      ['activation_kv_head_dim', []],
                      # Attention Weights
                      ['heads', []],
                      ['q_heads', []],
                      ['kv_heads', []],
                      ['qkv', []],
                      ['kv', []],
                      ['kv_head_dim', []],
                      ['q_lora', ['fsdp']],
                      ["q_lora_up_proj", []],
                      ['kv_lora', ['fsdp']],
                      ["kv_lora_up_proj", []],
                      # ==========================================
                      # Mixture of Experts (MoE)
                      # ==========================================
                      # MoE Activations
                      ['activation_batch_moe', ['data', 'fsdp']],
                      ['activation_exp', ['context', 'expert']],
                      # MoE Weights
                      ['exp', ['context', 'expert']],
                      ['embed_moe', ['fsdp']],
                      ['embed_router', ['fsdp']],
                      # ==========================================
                      # Standard MLP / Dense Layers / Model Structure
                      # ==========================================
                      # Dense Activations
                      ['activation_mlp', []],
                      ['activation_batch', ['data', 'fsdp', 'expert']],
                      ['activation_length', ['context']],
                      ['activation_norm_length', ['context']],
                      ['activation_embed', []],
                      ['activation_stage', 'stage'],
                      # General Weights
                      ['mlp', []],
                      ['layers', 'stage'],
                      # Dense weights: not sharded on context, see the header.
                      ['embed', ['fsdp']],
                      ['embed_attn', ['fsdp']],
                      # GatedDeltaNet projections (models/qwen3.py) stay sharded as in cp-as-ep.
                      ['embed_gdn', ['fsdp', 'context', 'expert']],
                      # The dense weights' gradients are reduce-scattered over every token axis, as in cp-as-ep, then
                      # gathered over the axes the weights are replicated on (linears.route_dense_weight_grad).
                      ['embed_grad', ['fsdp', 'context', 'expert']],
                  ]
