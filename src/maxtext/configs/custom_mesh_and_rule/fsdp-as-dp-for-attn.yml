# This rule uses data, FSDP, FSDP_transpose and expert, and assigns them as:
#
#   FSDP acts like DP for attn, but FSDP for moe
#   EP acts like FSDP for attn, and EP for moe
#
# That is, attention weights ('q_lora', 'kv_lora' and 'embed_attn') are sharded
# on the expert axis and replicated over fsdp / fsdp_transpose, while MoE and
# dense MLP weights keep using FSDP as in ep-as-dp.yml. Outside the core MoE
# part (between EP all2all) the expert axis carries the batch, so sharding the
# attention weights on it behaves like FSDP over a much smaller and faster axis:
# it trades HBM for a cheaper all-gather.
#
# This is mainly useful for large scale training. The attention weights are
# small, so once the FSDP rank is large (larger than 512) each shard is tiny and
# their all-gather is dominated by latency rather than bandwidth, which makes
# the attention layer latency bound. Sharding the attention weights on the
# (much smaller) expert axis keeps the per-shard slice large enough that the
# collective stays bandwidth bound, at the cost of replicating those weights
# over fsdp / fsdp_transpose. MoE weights are large enough to keep scaling with
# FSDP, so they are left alone. DeepSeek V3 MLPerf training at 4k sequence
# length is one such case.

mesh_axes: ['data', 'fsdp', 'fsdp_transpose', 'expert']
data_sharding: [['data', 'fsdp', 'fsdp_transpose', 'expert']]
logical_axis_rules: [
                      # ==========================================
                      # Vocabulary Embedding
                      # ==========================================
                      # Vocab Activations
                      ['activation_embed_and_logits_batch', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_embed_and_logits_batch_sequence', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_vocab', []],
                      # Vocab Weights
                      ['vocab', []],
                      ['embed_vocab', ['fsdp', 'fsdp_transpose']],
                      # ==========================================
                      # Attention
                      # ==========================================
                      # Attention Activations
                      ['activation_batch_attn', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_heads', []],
                      ['activation_kv_heads', []],
                      ['activation_length_attn', ['context']],
                      ['activation_q_length', ['context']],
                      ['activation_kv_length', []],
                      ['activation_embed_attn', ['tensor', 'tensor_transpose']],
                      ['activation_kv', []],
                      ['activation_kv_batch', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_kv_head_dim', []],
                      # Attention Weights, sharded on expert instead of fsdp:
                      # fsdp acts like DP here, expert acts like FSDP
                      ['q_lora', ['expert']],
                      ["q_lora_up_proj", []],
                      ['kv_lora', ['expert']],
                      ["kv_lora_up_proj", []],
                      ['embed_attn', ['expert']],
                      # ==========================================
                      # Mixture of Experts (MoE)
                      # ==========================================
                      # MoE Activations
                      ['activation_batch_moe', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_length_moe', []],
                      ['activation_norm_length_moe', []],
                      ['activation_embed_moe', []],
                      ['activation_mlp_moe', []],
                      ['activation_exp', ['expert']],
                      # MoE Weights
                      ['exp', 'expert'],
                      ['mlp_moe', ['fsdp_transpose']],
                      ['embed_moe', ['fsdp']],
                      # ==========================================
                      # Standard MLP / Dense Layers / Model Structure
                      # ==========================================
                      # Dense Activations
                      ['activation_mlp', []],
                      # Note activation batch and length also get used in vocab
                      ['activation_batch', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_length', []],
                      ['activation_norm_length', []],
                      ['activation_embed', []],
                      ['activation_stage', []],
                      # General Weights
                      ['mlp', ['fsdp_transpose']],
                      ['embed', ['fsdp', 'fsdp_transpose']],
                      ['embed', ['fsdp']],
                      # ==========================================
                      # Deprecated / Scheduled for Removal
                      # ==========================================
                      ['exp_with_fsdp', 'fsdp'],
                  ]
