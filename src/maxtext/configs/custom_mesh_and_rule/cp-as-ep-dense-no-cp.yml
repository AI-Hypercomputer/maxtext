# Variant of cp-as-ep.yml that takes the dense weights off the context axis (and maps 'embed_grad' for their backward reduction).
#
# cp-as-ep shards the dense weights ('embed', 'embed_attn', 'q_lora', 'kv_lora': attention, MLA latent up-projections,
# shared-expert projections, the shared-expert gate, and routers that use 'embed' such as Qwen3/Qwen3.5; DeepSeek-style
# routers use 'embed_router', which is already on 'fsdp') over fsdp x context x expert, so every all-gather of them
# spans all devices and also synchronizes the context ranks, which do unequal attention work. Here they are sharded
# over fsdp x expert and replicated over context: those all-gathers run in context-many independent fsdp x expert
# groups, at the cost of a context-way replication of the weights and their gradients. With dense_grad_reduce='reduce_scatter'
# (the default), their gradients are reduce-scattered over every token axis ('embed_grad' -> ['fsdp', 'expert', 'context'])
# and the shard is all-gathered over context (context is minor so the gather lands directly on ('fsdp', 'expert') with no
# collective-permute); with dense_grad_reduce='all_reduce', 'embed_grad' is dropped so GSPMD leaves an unbarred fsdp x expert
# reduction + context all-reduce on the shard (which XLA:TPU folds into a combined full-weight all-reduce across all token
# axes). The GatedDeltaNet projections ('embed_gdn'), activations, the vocabulary weights and the routed experts ('exp' over
# context x expert) are sharded as in cp-as-ep, and RoutedMoE uses ("context", "expert") as its expert-parallel axes.
#
# This rule uses data, stage, FSDP, context, and expert. Context axis acts as expert
# parallelism in core MoE part (between EP all2all).
mesh_axes: ['data', 'stage', 'fsdp', 'context', 'expert']
data_sharding: [['data', 'stage', 'fsdp', 'context', 'expert']]
logical_axis_rules: [
                      # ==========================================
                      # Vocabulary Embedding
                      # ==========================================
                      # Vocab Activations
                      ['activation_embed_and_logits_batch', ['data', 'stage', 'fsdp', 'expert']],
                      # Vocabulary tiling flattens [batch, length] into one dimension. It must also be sharded
                      # over the length axis (context), or every context rank computes the logits of all the
                      # context shards. context is last because it is the minor part of the flattened index.
                      ['activation_embed_and_logits_batch_sequence', ['data', 'stage', 'fsdp', 'expert', 'context']],
                      # Vocab Weights
                      ['vocab', []],
                      ['embed_vocab', ['fsdp', 'context', 'expert']],
                      # ==========================================
                      # Attention
                      # ==========================================
                      # Attention Activations
                      ['activation_batch_attn', ['data', 'fsdp', 'expert']],
                      ['activation_heads', []],
                      ['activation_kv_heads', []],
                      ['activation_length_attn', ['context']],
                      ['activation_q_length', ['context']],
                      ['activation_kv_length', []],
                      ['activation_embed_attn', []],
                      ['activation_kv', []],
                      ['activation_kv_batch', ['data', 'fsdp', 'expert']],
                      ['activation_kv_head_dim', []],
                      # Attention Weights
                      ['heads', []],
                      ['q_heads', []],
                      ['kv_heads', []],
                      ['qkv', []],
                      ['kv', []],
                      ['kv_head_dim', []],
                      ['q_lora', ['fsdp', 'expert']],
                      ["q_lora_up_proj", []],
                      ['kv_lora', ['fsdp', 'expert']],
                      ["kv_lora_up_proj", []],
                      # ==========================================
                      # Mixture of Experts (MoE)
                      # ==========================================
                      # MoE Activations
                      ['activation_batch_moe', ['data', 'fsdp']],
                      ['activation_exp', ['context', 'expert']],
                      # MoE Weights
                      ['exp', ['context', 'expert']],
                      ['embed_moe', ['fsdp']],
                      ['embed_router', ['fsdp']],
                      # wo's dims when moe_wo_fsdp_on_mlp=True: FSDP on its mlp dim (see RoutedMoE.wo_kernel_axes)
                      ['mlp_moe_out', ['fsdp']],
                      ['embed_moe_out', []],
                      # ==========================================
                      # Standard MLP / Dense Layers / Model Structure
                      # ==========================================
                      # Dense Activations
                      ['activation_mlp', []],
                      ['activation_batch', ['data', 'fsdp', 'expert']],
                      ['activation_length', ['context']],
                      ['activation_norm_length', ['context']],
                      ['activation_norm_length_routed', ['context']],
                      ['activation_embed', []],
                      ['activation_embed_routed', []],
                      ['activation_stage', 'stage'],
                      # General Weights
                      ['mlp', []],
                      ['layers', 'stage'],
                      # Dense weights: not sharded on context, see the header.
                      ['embed', ['fsdp', 'expert']],
                      ['embed_attn', ['fsdp', 'expert']],
                      # GatedDeltaNet projections (models/qwen3.py) stay sharded as in cp-as-ep.
                      ['embed_gdn', ['fsdp', 'context', 'expert']],
                      # The dense weights' gradients are reduce-scattered over every token axis, then gathered over
                      # context (linears.route_dense_weight_grad). context is minor so the gather lands directly on
                      # ('fsdp', 'expert') without a collective-permute.
                      ['embed_grad', ['fsdp', 'expert', 'context']],
                  ]
