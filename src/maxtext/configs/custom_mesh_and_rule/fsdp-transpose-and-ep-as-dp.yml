# This rule uses data, FSDP, FSDP_transpose and expert, and assigns them as:
#
#   FSDP_transpose acts like DP for attn, shared experts / dense MLP and the
#     vocab embedding, but FSDP for moe (together with FSDP it shards the moe
#     mlp dimension)
#   FSDP acts like FSDP everywhere
#   EP acts like DP for attn and shared experts / dense MLP, and EP for moe
#
# That is, attention weights ('q_lora', 'kv_lora' and 'embed_attn'), shared
# expert / dense MLP weights ('embed' and 'mlp') and the vocab embedding
# ('embed_vocab') are sharded on fsdp only and replicated over fsdp_transpose
# (and expert). Routed MoE weights shard their mlp dimension ('mlp_moe') over
# both fsdp and fsdp_transpose, and leave the embed dimension ('embed_moe')
# unsharded.
#
# This is useful at large scale where the total FSDP rank (fsdp *
# fsdp_transpose) is so large that the small attention / shared expert weights
# would be split into tiny, latency bound all-gathers. Restricting those weights
# to the fsdp axis keeps each shard large enough to stay bandwidth bound, at the
# cost of replicating them over fsdp_transpose. The large routed MoE weights
# keep scaling over the full fsdp * fsdp_transpose rank. See
# fsdp-transpose-as-dp.yml for the variant where expert acts like FSDP for the
# attention / shared expert weights.

mesh_axes: ['data', 'fsdp', 'fsdp_transpose', 'expert']
data_sharding: [['data', 'fsdp', 'fsdp_transpose', 'expert']]
logical_axis_rules: [
                      # ==========================================
                      # Vocabulary Embedding
                      # ==========================================
                      # Vocab Activations
                      ['activation_embed_and_logits_batch', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_embed_and_logits_batch_sequence', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_vocab', []],
                      # Vocab Weights, sharded on fsdp only: fsdp_transpose acts
                      # like DP here (embed dim is too small to shard over the
                      # full fsdp * fsdp_transpose rank at large scale)
                      ['vocab', []],
                      ['embed_vocab', ['fsdp']],
                      # ==========================================
                      # Attention
                      # ==========================================
                      # Attention Activations
                      ['activation_batch_attn', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_heads', []],
                      ['activation_kv_heads', []],
                      ['activation_length_attn', ['context']],
                      ['activation_q_length', ['context']],
                      ['activation_kv_length', []],
                      ['activation_embed_attn', ['tensor', 'tensor_transpose']],
                      ['activation_kv', []],
                      ['activation_kv_batch', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_kv_head_dim', []],
                      # Attention Weights, sharded on fsdp only:
                      # fsdp_transpose acts like DP here
                      ['q_lora', ['fsdp']],
                      ["q_lora_up_proj", []],
                      ['kv_lora', ['fsdp']],
                      ["kv_lora_up_proj", []],
                      ['embed_attn', ['fsdp']],
                      # ==========================================
                      # Mixture of Experts (MoE)
                      # ==========================================
                      # MoE Activations
                      ['activation_batch_moe', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_length_moe', []],
                      ['activation_norm_length_moe', []],
                      ['activation_embed_moe', []],
                      ['activation_mlp_moe', []],
                      ['activation_exp', ['expert']],
                      # MoE Weights: mlp dimension sharded on both fsdp and fsdp_transpose
                      ['exp', 'expert'],
                      ['mlp_moe', ['fsdp', 'fsdp_transpose']],
                      ['embed_moe', []],
                      # ==========================================
                      # Standard MLP / Dense Layers / Model Structure
                      # ==========================================
                      # Dense Activations
                      ['activation_mlp', []],
                      # Note activation batch and length also get used in vocab
                      ['activation_batch', ['data', 'fsdp', 'fsdp_transpose', 'expert']],
                      ['activation_length', []],
                      ['activation_norm_length', []],
                      ['activation_embed', []],
                      ['activation_stage', []],
                      # General Weights (shared experts and dense MLP), sharded on
                      # fsdp only: fsdp_transpose acts like DP here
                      ['mlp', []],
                      ['embed', ['fsdp']],
                      # ==========================================
                      # Deprecated / Scheduled for Removal
                      # ==========================================
                      ['exp_with_fsdp', 'fsdp'],
                  ]
