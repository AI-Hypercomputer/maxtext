# Evaluation companion of fsdp-as-dp-for-attn-cp-as-ep-for-moe.yml, meant for
#
#   custom_mesh_and_rule=fsdp-as-dp-for-attn-cp-as-ep-for-moe
#   custom_mesh_and_rule_for_eval=fsdp-as-dp-for-attn-cp-as-ep-for-moe-eval
#
# Only the logical rules are swapped for eval (the mesh is built once from the
# training rule), so mesh_axes must stay identical to the training rule. The
# weight rules are identical too, so the train state is consumed as-is.
#
# The only change is that the expert axis stops carrying the batch and joins
# context in sharding the sequence, as in ep-as-cp.yml. Outside the core MoE
# part the sequence is split over context x expert, and the batch over data,
# fsdp and fsdp_transpose only. This supports
#
#   eval_per_device_batch_size = 1 / (context x expert)
#
# e.g. 1/64 with context=2 (the two TensorCores of a v7x chip) and expert=32.
# The MoE is unchanged: tokens are still sharded over context x expert, which
# is the EP group. Keep context_parallel_load_balance=false: the input pipeline
# reorders for the training CP extent (context) only.

mesh_axes: ['data', 'fsdp', 'fsdp_transpose', 'expert', 'context']
data_sharding: [['data', 'fsdp', 'fsdp_transpose', 'expert', 'context']]
logical_axis_rules: [
                      # ==========================================
                      # Vocabulary Embedding
                      # ==========================================
                      # Vocab Activations
                      ['activation_embed_and_logits_batch', ['data', 'fsdp', 'fsdp_transpose']],
                      ['activation_embed_and_logits_batch_sequence', ['data', 'fsdp', 'fsdp_transpose', 'context', 'expert']],
                      ['activation_vocab', []],
                      # Vocab Weights
                      ['vocab', []],
                      ['embed_vocab', ['fsdp', 'fsdp_transpose']],
                      # ==========================================
                      # Attention
                      # ==========================================
                      # Attention Activations
                      ['activation_batch_attn', ['data', 'fsdp', 'fsdp_transpose']],
                      ['activation_heads', []],
                      ['activation_kv_heads', []],
                      ['activation_length_attn', ['context', 'expert']],
                      ['activation_q_length', ['context', 'expert']],
                      ['activation_kv_length', []],
                      ['activation_embed_attn', []],
                      ['activation_kv', []],
                      ['activation_kv_batch', ['data', 'fsdp', 'fsdp_transpose']],
                      ['activation_kv_head_dim', []],
                      # Attention Weights, same as training
                      ['q_lora', ['context', 'expert']],
                      ["q_lora_up_proj", []],
                      ['kv_lora', ['context', 'expert']],
                      ["kv_lora_up_proj", []],
                      ['embed_attn', ['context', 'expert']],
                      # ==========================================
                      # Mixture of Experts (MoE)
                      # ==========================================
                      # MoE Activations
                      ['activation_batch_moe', ['data', 'fsdp', 'fsdp_transpose']],
                      ['activation_length_moe', []],
                      ['activation_norm_length_moe', []],
                      ['activation_embed_moe', []],
                      ['activation_mlp_moe', []],
                      ['activation_exp', ['context', 'expert']],
                      # MoE Weights, same as training
                      ['exp', ['context', 'expert']],
                      ['mlp_moe', ['fsdp_transpose']],
                      ['embed_moe', ['fsdp']],
                      # ==========================================
                      # Standard MLP / Dense Layers / Model Structure
                      # ==========================================
                      # Dense Activations
                      ['activation_mlp', []],
                      # Note activation batch and length also get used in vocab
                      ['activation_batch', ['data', 'fsdp', 'fsdp_transpose']],
                      ['activation_length', ['context', 'expert']],
                      ['activation_norm_length', ['context', 'expert']],
                      ['activation_embed', []],
                      ['activation_stage', []],
                      # General Weights, same as training
                      ['mlp', ['fsdp_transpose']],
                      ['embed', ['fsdp', 'fsdp_transpose']],
                      ['embed', ['fsdp']],
                      # ==========================================
                      # Deprecated / Scheduled for Removal
                      # ==========================================
                      ['exp_with_fsdp', 'fsdp'],
                  ]
