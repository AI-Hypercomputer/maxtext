# Optimal Sub-Turn Composite (turn_span) GSPO-MiMo with length-adaptive clipping.

base_config: "rl_code_gspo_mimo.yml"

rl:
  gspo_pool_mode: "turn_span"
  gspo_length_adaptive_clipping: true
  gspo_ref_length: 1024
  gspo_clip_min: 0.001
  gspo_clip_max: 0.05
