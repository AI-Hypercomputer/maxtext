# Optimal On-Policy & Length-Normalized GRPO-MiMo.

base_config: "rl_code_gspo_mimo.yml"

rl:
  loss_algo: "grpo"
  clip_mode: "ppo"
  grpo_epsilon: 0.20
  epsilon_high: 0.28
  epsilon_neg: 0.20
  epsilon_neg_high: 0.28
  loss_agg_mode: "sequence-mean-token-mean"
  min_seq_len_norm: 128
  max_flagged_token_ratio_per_turn: 0.35
