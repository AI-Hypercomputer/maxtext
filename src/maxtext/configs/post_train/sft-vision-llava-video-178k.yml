base_config: "base.yml"

use_sft: true
use_tunix_gradient_accumulation: true
use_multimodal: true
# For vision SFT, we only train on completion tokens
sft_train_on_completion_only: true
packing: false  # packing is not tested yet
freeze_vision_encoder_params: true
learning_rate: 2.e-5

# -------------- HF pipeline --------------
dataset_type: hf
hf_path: "parquet"
# Run tools/data_generation/prepare_llava_video_178k.py to generate local parquet files and video assets
# Example:
# hf_train_files: "/your_data_path/LLaVA-Video-178K/0_30_s_academic_v0_1/*.parquet"
train_data_columns: ["query", "response"]
train_image_column: "video"
eval_data_columns: ["query", "response"]
eval_image_column: "video"
