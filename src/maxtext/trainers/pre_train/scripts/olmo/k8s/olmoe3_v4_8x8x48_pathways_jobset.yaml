# Pathways JobSet: OLMo 3.5 Small (Option A, olmoe3-3p5b-e256k8-sh2x) on one Cloud TPU v4 8x8x48 slice (3,072 chips).
#
# Measured best config (real Dolma 3.5, strict FP32, EP=64 on closed 8x8 planes + DP=48 + Zero-1):
# 2,117 ms/step = 34.26% MFU, 11.89M tok/s. See README_v4_8x8x48.md for prerequisites and usage.
#
# Fill in the ${...} placeholders, e.g.:
#   envsubst '${NAMESPACE} ${JOBSET_NAME} ${KUEUE_QUEUE} ${SERVICE_ACCOUNT} ${MAXTEXT_IMAGE} ${SLICE_NODEPOOL}
#     ${PATHWAYS_GCS_SCRATCH} ${OUTPUT_DIR} ${INDEX_BUCKET} ${INDEX_DIR} ${DATA_BUCKET} ${DATA_DIR} ${MODE} ${DATA}
#     ${EP} ${DECOUPLE_GCLOUD}' < olmoe3_v4_8x8x48_pathways_jobset.yaml | kubectl apply -f -
# Pass the explicit variable list to envsubst: the container commands use $(...) Kubernetes expansions.
#
# The pathways-head pod (resource manager + proxy + jax-driver) is CPU-only but needs a lot of host RAM at 3,072 chips
# (a ~29 GB CPU node OOM-killed the driver for Zero-1 and real-data runs). It is scheduled on one TPU VM host of the
# slice nodepool (nodeSelector + google.com/tpu toleration, no TPU request). Because it shares the nodepool with the
# workers, the worker job has no exclusive-topology annotation. Alternatively schedule it on a CPU node with
# >= 128 GB RAM and restore `alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool` on the workers.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOBSET_NAME}
  namespace: ${NAMESPACE}
  labels:
    kueue.x-k8s.io/queue-name: ${KUEUE_QUEUE}
spec:
  coordinator:
    replicatedJob: pathways-head
  failurePolicy:
    maxRestarts: 0
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - pathways-head
  replicatedJobs:
    - name: pathways-head
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          completionMode: Indexed
          completions: 1
          parallelism: 1
          template:
            metadata:
              annotations:
                gke-gcsfuse/volumes: "true"
                gke-gcsfuse/cpu-limit: "0"
                gke-gcsfuse/memory-limit: "0"
                gke-gcsfuse/ephemeral-storage-limit: "0"
            spec:
              dnsPolicy: ClusterFirst
              hostNetwork: false
              restartPolicy: Never
              serviceAccountName: ${SERVICE_ACCOUNT}
              # One TPU VM host of the slice nodepool (~240 vCPU, ~400 GB RAM); no google.com/tpu request.
              nodeSelector:
                cloud.google.com/gke-nodepool: ${SLICE_NODEPOOL}
              tolerations:
                - key: google.com/tpu
                  operator: Exists
                  effect: NoSchedule
              initContainers:
                - name: pathways-rm
                  image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:latest
                  imagePullPolicy: Always
                  restartPolicy: Always
                  args:
                    - --server_port=29001
                    - --gcs_scratch_location=${PATHWAYS_GCS_SCRATCH}
                    - --node_type=resource_manager
                    - --instance_count=1
                    - --instance_type=tpuv4:8x8x48
                    # Late binding off: needed when the slice has degraded / repaired hosts (see README).
                    - --temporary_flags_for_debugging=temporary_flag_for_debugging_worker_expected_tpu_chip_config=megacore_dense;;;temporary_flag_for_debugging_enable_late_binding=false
                    - --xla_tpu_spmd_rng_bit_generator_unsafe=true
                    - --xla_tpu_bf16_emission_mode=NATIVE_EMISSION
                    - --xla_tpu_scoped_vmem_limit_kib=16384
                    - --xla_tpu_enable_async_ragged_all_to_all=true
                    - --xla_tpu_enable_all_reduce_scatter_fusion=true
                    - --xla_tpu_use_minor_sharding_for_major_trivial_input=true
                    - --xla_tpu_relayout_group_size_threshold_for_reduce_scatter=1
                    - --xla_tpu_assign_all_reduce_scatter_layout=true
                  env:
                    - name: REPLICATED_JOB_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['jobset.sigs.k8s.io/replicatedjob-name']
                    - name: JOBSET_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['jobset.sigs.k8s.io/jobset-name']
                    - name: HOST_ADDRESS
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
                    - name: TPU_SKIP_MDS_QUERY
                      value: "true"
                    - name: TPU_MEGACORE
                      value: megacore_dense
                - name: pathways-proxy
                  image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:latest
                  imagePullPolicy: Always
                  restartPolicy: Always
                  args:
                    - --server_port=29000
                    - --resource_manager_address=localhost:29001
                    - --gcs_scratch_location=${PATHWAYS_GCS_SCRATCH}
                    - --temporary_flags_for_debugging=temporary_flag_for_debugging_worker_expected_tpu_chip_config=megacore_dense
                    - --xla_tpu_spmd_rng_bit_generator_unsafe=true
                    - --xla_tpu_bf16_emission_mode=NATIVE_EMISSION
                    - --xla_tpu_scoped_vmem_limit_kib=16384
                    - --xla_tpu_enable_async_ragged_all_to_all=true
                    - --xla_tpu_enable_all_reduce_scatter_fusion=true
                    - --xla_tpu_use_minor_sharding_for_major_trivial_input=true
                    - --xla_tpu_relayout_group_size_threshold_for_reduce_scatter=1
                    - --xla_tpu_assign_all_reduce_scatter_layout=true
                  env:
                    - name: IFRT_PROXY_USE_INSECURE_GRPC_CREDENTIALS
                      value: "true"
                    - name: TPU_MEGACORE
                      value: megacore_dense
              containers:
                - name: jax-driver
                  # MaxText TPU image built from this branch (MaxText lives in /deps); see README.
                  image: ${MAXTEXT_IMAGE}
                  command:
                    - bash
                    - /deps/src/maxtext/trainers/pre_train/scripts/olmo/run_olmoe3_3p5b_v4.sh
                  env:
                    - name: TOPOLOGY
                      value: 8x8x48
                    - name: RUNTIME
                      value: pathways
                    - name: DATA
                      value: "${DATA}"  # real | synthetic
                    - name: MODE
                      value: "${MODE}"  # bench | hero
                    - name: EP
                      value: "${EP}"  # 64 (best, Zero-1) | 128
                    - name: RUN_NAME
                      value: ${JOBSET_NAME}
                    - name: OUTPUT_DIR
                      value: ${OUTPUT_DIR}
                    - name: PYTHONPATH
                      value: /deps/src
                    # TRUE stubs out optional google-cloud clients; use FALSE for checkpointing to GCS (MODE=hero).
                    - name: DECOUPLE_GCLOUD
                      value: "${DECOUPLE_GCLOUD}"
                    - name: JAX_PLATFORMS
                      value: proxy
                    - name: JAX_BACKEND_TARGET
                      value: grpc://127.0.0.1:29000
                    - name: IFRT_PROXY_USE_INSECURE_GRPC_CREDENTIALS
                      value: "true"
                    - name: PATHWAYS_PROXY_CONNECTION_TIMEOUT_SECS
                      value: "600"
                    - name: XCLOUD_ENVIRONMENT
                      value: GCP
                  volumeMounts:
                    - name: dshm
                      mountPath: /dev/shm
                    - name: olmo-indices
                      mountPath: /mnt/olmo-3p5-maxtext
                      readOnly: true
                    - name: dolma3p5
                      mountPath: /mnt/dolma3p5-14t
                      readOnly: true
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                # Directory holding indices/dolma3p5-14t_seq8192.json and the global-indices .npy file.
                - name: olmo-indices
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: ${INDEX_BUCKET}
                      gcsfuseMetadataPrefetchOnMount: "true"
                      mountOptions: only-dir=${INDEX_DIR},implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,file-system:kernel-list-cache-ttl-secs:-1
                # Dolma 3.5 token .npy files (the index paths are remapped from gs://<DATA_BUCKET>/<DATA_DIR>/).
                - name: dolma3p5
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: ${DATA_BUCKET}
                      gcsfuseMetadataPrefetchOnMount: "true"
                      mountOptions: only-dir=${DATA_DIR},implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,file-system:kernel-list-cache-ttl-secs:-1
    - name: pathways-worker
      replicas: 1
      template:
        spec:
          # Workers restart in place after host failures; the JobSet itself does not restart.
          backoffLimit: 7680000
          completionMode: Indexed
          completions: 768
          parallelism: 768
          template:
            spec:
              dnsPolicy: ClusterFirstWithHostNet
              hostNetwork: true
              restartPolicy: OnFailure
              serviceAccountName: ${SERVICE_ACCOUNT}
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu-v4-podslice
                cloud.google.com/gke-tpu-topology: 8x8x48
              tolerations:
                - key: google.com/tpu
                  operator: Equal
                  value: present
                  effect: NoSchedule
              containers:
                - name: pathways-worker
                  image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:latest
                  imagePullPolicy: Always
                  securityContext:
                    privileged: true
                  args:
                    - --resource_manager_address=$(PATHWAYS_HEAD):29001
                    - --server_port=29005
                    - --gcs_scratch_location=${PATHWAYS_GCS_SCRATCH}
                    - --xla_tpu_spmd_rng_bit_generator_unsafe=true
                    - --xla_tpu_bf16_emission_mode=NATIVE_EMISSION
                    - --xla_tpu_scoped_vmem_limit_kib=16384
                    - --xla_tpu_enable_async_ragged_all_to_all=true
                    - --xla_tpu_enable_all_reduce_scatter_fusion=true
                    - --xla_tpu_use_minor_sharding_for_major_trivial_input=true
                    - --xla_tpu_relayout_group_size_threshold_for_reduce_scatter=1
                    - --xla_tpu_assign_all_reduce_scatter_layout=true
                  resources:
                    limits:
                      google.com/tpu: "4"
                    requests:
                      google.com/tpu: "4"
                  env:
                    - name: TPU_MEGACORE
                      value: megacore_dense
                    - name: XCLOUD_ENVIRONMENT
                      value: GCP
                    - name: MEGASCALE_GRPC_ENABLE_XOR_TRACER
                      value: "false"
                    - name: MEGASCALE_NUM_SLICES
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
                    - name: JOBSET_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['jobset.sigs.k8s.io/jobset-name']
                    - name: REPLICATED_JOB_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['jobset.sigs.k8s.io/replicatedjob-name']
                    - name: MEGASCALE_SLICE_ID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
                    - name: PATHWAYS_HEAD
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
                    - name: MEGASCALE_COORDINATOR_ADDRESS
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
                  volumeMounts:
                    - name: shared-tmp
                      mountPath: /tmp
              volumes:
                - name: shared-tmp
                  hostPath:
                    path: /tmp
                    type: DirectoryOrCreate
