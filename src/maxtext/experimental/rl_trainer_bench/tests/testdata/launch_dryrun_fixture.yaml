kubectl delete jobset example-orch -n example-ns
---
# Hand-written fixture in the shape of a Tunix e2e DRY_RUN render (orchestrator, trainer, one rollout JobSet).
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: example-orch
  namespace: example-ns
  labels:
    kueue.x-k8s.io/queue-name: example-queue
    scheduling.x-k8s.io/gang-id: "example"
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: proc
    replicas: 1
    template:
      spec:
        completions: 1
        parallelism: 1
        template:
          spec:
            containers:
            - name: main
              image: example.invalid/tunix:tag
              command:
              - bash
              - -c
              - |
                echo "Program Start: $(date)"
                (
                  PYTHONUNBUFFERED=1 python -m tunix.experimental.distributed.runtime.main \
                    --process_executor=tunix.experimental.distributed.runtime.executor.K8sExecutor \
                    --process_main=tunix.experimental.examples.deepswe_dist.run_deepswe_dist.main \
                    --num_generations=16 \
                    --mini_batch_size=72 \
                    --train_micro_batch_size=64 \
                    --trainer_fsdp=32 \
                    --trainer_dp=1 \
                    --trainer_expert=2 \
                    --max_prompt_length=8192 \
                    --max_response_length=57344 \
                    --seq_logprob_error_threshold=2.0 \
                    --truncated_importance_sampling_type=seq-mask-tis
                ) & PID=$!
                wait $PID
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: example-train
  namespace: example-ns
  labels:
    kueue.x-k8s.io/queue-name: example-queue
    scheduling.x-k8s.io/gang-id: "example"
spec:
  failurePolicy:
    restartStrategy: Recreate
    maxRestarts: 3
  replicatedJobs:
  - name: proc
    replicas: 1
    template:
      spec:
        completions: 1
        parallelism: 1
        template:
          spec:
            initContainers:
            - name: pathways-rm
              image: example.invalid/pathways-server:tag
              restartPolicy: Always
              args:
              - --server_port=29001
              - --node_type=resource_manager
              - --instance_count=1
              - --instance_type=tpu7x:4x4x8
            - name: pathways-proxy
              image: example.invalid/pathways-proxy:tag
              restartPolicy: Always
              args:
              - --server_port=29000
              - --resource_manager_address=localhost:29001
              - --xla_tpu_flag_a=true
              - --xla_tpu_flag_b=4
              - --sidecar_name=external
            containers:
            - name: main
              image: example.invalid/tunix:tag
              ports:
              - containerPort: 20002
                name: grpc
              command:
              - bash
              - -c
              - |
                echo "Program Start: $(date)"
                export FT_REGISTERED_MARKER=/dev/shm/registered
                (
                  PYTHONUNBUFFERED=1 MAXTEXT_EXTRA_FLAGS="context=offload num_moe_token_chunks=4 packing=True" LIBTPU_INIT_ARGS='--RUNTIME_only_flag=true --xla_tpu_flag_a=true --xla_tpu_flag_b=4' python -m tunix.experimental.distributed.runtime.main \
                    --discovery_addrs=example-orch:20000 \
                    --process_executor=tunix.experimental.distributed.runtime.executor.K8sExecutor \
                    --process_main=tunix.experimental.examples.common.run_trainer_node.main \
                    --worker_id=example-train \
                    --port=20002 \
                    --mesh_fsdp=32 \
                    --mesh_tp=1 \
                    --mesh_expert=2 \
                    --mesh_context=4 \
                    --maxtext_ckpt_path=/ckpt/example \
                    --maxtext_output_directory=/out/example \
                    --compute_logps_chunk_size=512 \
                    --train_micro_batch_size=64 \
                    --profiler_steps=1 \
                    --skip_first_n_profiler_steps=3
                ) & PID=$!
                wait $PID
                if [ ! -f "$FT_REGISTERED_MARKER" ]; then exit 75; fi
  - name: pw-node
    replicas: 1
    template:
      spec:
        completions: 32
        parallelism: 32
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: 4x4x8
          spec:
            containers:
            - name: pathways-worker
              image: example.invalid/pathways-server:tag
              args:
              - --server_port=29005
              resources:
                limits:
                  google.com/tpu: "4"
              env:
              - name: LIBTPU_INIT_ARGS
                value: --RUNTIME_only_flag=true --xla_tpu_flag_a=true --xla_tpu_flag_b=4 --worker_only_flag=1
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: example-roll-0
  namespace: example-ns
spec:
  replicatedJobs:
  - name: proc
    replicas: 1
    template:
      spec:
        template:
          spec:
            containers:
            - name: main
              image: example.invalid/rollout:tag
              command:
              - bash
              - -c
              - |
                (
                  python -m tunix.experimental.distributed.runtime.main \
                    --process_main=tunix.experimental.examples.common.run_rollout_node.main
                )
