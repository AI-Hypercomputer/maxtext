# Step 2: SFT / Fine-tune LLM Decoder + Custom MLP Projector on ChartQA after COCO pretraining.
#
# Example command to run SFT on TPU VM:
# python3 -m maxtext.experimental.omni_poc.train_sft_omni \
#   src/maxtext/experimental/omni_poc/sft-omni-gemma3-qwen3-full-decoder.yml

# Inherit model architecture (Gemma 3 4B Vision Tower + Qwen 3 4B Decoder + 3-Layer MLP Connector)
base_config: "maxtext-omni-gemma3-qwen3.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

trainable_parameters_mask: ["custom_linear", "decoder"]

learning_rate: 3.e-5
lr_schedule_type: 'cosine'
warmup_steps_fraction: 0.03
learning_rate_final_fraction: 0.2

adam_weight_decay: 0.01
adamw_mask: ['.*norm.*', '.*bias.*']

# -------------- HF pipeline --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-4B"
hf_path: 'HuggingFaceM4/ChartQA'
train_split: 'train'
hf_eval_split: 'val'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# Checkpoint paths (load from COCO pretrain checkpoint step 14000)
load_parameters_path: ""
base_output_directory: ""
run_name: "omni_sft_chartqa_full_decoder_v2"

# Training schedule (9,000 steps with checkpointing every 1,000 steps)
per_device_batch_size: 1
num_epoch: 5
steps: 1105
checkpoint_period: 100
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (evaluates 1 batch = 128 validation samples periodically without exhausting shards)
eval_interval: 100
eval_steps: 1

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
