# Step 1: Pretrain / Align the custom MLP vision projector on COCO-Narratives image-caption data on TPU v4-128.
#
# Example command to run COCO pretraining on TPU VM / XPK:
# python3 -m maxtext.experimental.omni_poc.train_sft_omni src/maxtext/experimental/omni_poc/pretrain-omni-gemma3-qwen3-coco-xpk-128.yml

# Inherit model architecture (Gemma 3 4B Vision Tower + Qwen 3 4B Decoder + Custom MLP Connector)
base_config: "maxtext-omni-gemma3-qwen3.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true
learning_rate: 3.e-4
lr_schedule_type: 'cosine'
warmup_steps_fraction: 0.05
learning_rate_final_fraction: 0.1
adamw_mask: ['.*norm.*', '.*bias.*']
gradient_clipping_threshold: 1.0

# Train ONLY the custom MLP projector by freezing all other parameters
trainable_parameters_mask: ["custom_linear"]

# -------------- HF pipeline (COCO-Narratives) --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-4B"
hf_path: 'Fhrozen/coco-narratives'
train_split: 'train'
hf_eval_split: 'val'

# Image column
train_image_column: 'image'
eval_image_column: 'image'

# Text columns: ['prompt', 'narratives']
train_data_columns: ['prompt', 'narratives']
eval_data_columns: ['prompt', 'narratives']
default_prompt: "Describe the image concisely"

# Checkpoint paths
load_parameters_path: ""
base_output_directory: ""
run_name: "omni_pretrain_coco_xpk_128"

# Training schedule for 2 full epochs on v4-128:
# ~120k samples * 2 epochs / (128 chips * 1 per_device_batch_size = 128 global batch size) ≈ 2,000 steps
per_device_batch_size: 1
num_epoch: 2
steps: 1844
checkpoint_period: 200
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (evaluates 2 batches = 256 validation samples periodically without exhausting the eval set)
eval_interval: 200
eval_steps: 2

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 2048
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
