# Step 1: Pretrain / Align the custom MLP vision projector on ChartVerse-SFT-600K using CoT reasoning traces.
#
# Example command to run pretraining on TPU VM:
# python3 -m maxtext.experimental.omni_poc.train_sft_omni \
#   src/maxtext/experimental/omni_poc/pretrain-omni-gemma3-qwen3-chartverse.yml

# Inherit model architecture (Gemma 3 4B Vision Tower + Qwen 3 4B Decoder + Custom MLP Connector)
base_config: "maxtext-omni-gemma3-qwen3.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

# Pretrain ONLY the custom MLP projector to align Gemma 3 vision features with Qwen 3 text space
trainable_parameters_mask: ["custom_linear"]

# Learning rate and schedule for projector alignment
learning_rate: 2.e-4
lr_schedule_type: 'cosine'
warmup_steps_fraction: 0.05
learning_rate_final_fraction: 0.1
adamw_mask: ['.*norm.*', '.*bias.*']
gradient_clipping_threshold: 1.0

# -------------- HF pipeline --------------
# Columns selected: ['images', 'question', 'cot_solution']
# Note: Prompt is 'question', Completion is 'cot_solution' (Chain-of-Thought reasoning).
# All other columns ('code', 'code_solution', 'answer', 'id') are automatically filtered out.
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-4B"
hf_path: 'opendatalab/ChartVerse-SFT-600K'
train_split: 'train'
train_data_columns: ['question', 'cot_solution']
train_image_column: 'images'

# Initial stitched checkpoint path
load_parameters_path: "gs://yuchenhou-maxtext-logs/omni_checkpoints/omni_stitched_gemma3-4b_qwen3-4b/0/items"
base_output_directory: "gs://yuchenhou-maxtext-logs/omni-gemma3-qwen3/multimodal/pretrain_chartverse"
run_name: "omni_pretrain_chartverse_embedder_only"

# Training schedule (2 full epochs across ~603k samples at global batch size 32)
per_device_batch_size: 4
steps: 37690             # 603,000 * 2 / 16 = 75,375 steps
num_epoch: 2
checkpoint_period: 1000
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings
# ChartVerse-SFT-600K only contains a 'train' split on HuggingFace Hub.
eval_interval: -1
eval_steps: 0

# Sequence length & attention settings
# CoT reasoning traces can be long, so max_target_length is set to 4096.
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
