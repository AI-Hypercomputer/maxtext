# Config for Full-Model SFT of Gemma 3 4B on TPU v4-128 (128 devices) for 5 Epochs
# Unfreezes the SigLIP Vision Encoder (Gemma3VisionEncoderLayer_0), Vision Projector (VisionEmbedder_0),
# and Language Decoder (decoder) following the PaliGemma 2 / Gemma 3 Table 12 specialist transfer protocol.

base_config: "base.yml"
model_name: "gemma3-4b"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false

# CRITICAL: Disable stop_gradient on vision encoder output so gradients flow into SigLIP ViT
freeze_vision_encoder_params: false

# Train ALL multimodal & language components: Vision Encoder + Vision Projector + LLM Decoder
trainable_parameters_mask: ["Gemma3VisionEncoderLayer_0", "VisionEmbedder_0", "decoder"]

# Learning rate tuned for joint Vision Tower + LLM Decoder fine-tuning (5.e-6 protects unfrozen SigLIP ViT)
learning_rate: 5.e-6

# Optimizer & LR Schedule settings
lr_schedule_type: "cosine"
warmup_steps_fraction: 0.05
learning_rate_final_fraction: 0.1
adam_weight_decay: 0.01
adamw_mask: [".*norm.*", ".*bias.*"]
gradient_clipping_threshold: 1.0

# -------------- HF pipeline --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "google/gemma-3-4b-it"
hf_path: 'parquet'
hf_train_files: '/dev/shm/chartqa_shuffled/train-*'
hf_eval_files: '/dev/shm/chartqa_shuffled/val-*'
train_split: 'train'
hf_eval_split: 'train'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# In-process data loading
grain_worker_count: 0

# Checkpoint paths
load_parameters_path: ""
base_output_directory: ""
run_name: "gemma3_4b_sft_chartqa_10epoch_full_model_v4_128"

# Training schedule for 10 epochs on v4-128 (128 chips * 1 = global batch size 128):
# 28,288 examples * 10 / 128 = 2210 steps (checkpoint every 221 steps = 1 checkpoint per epoch)
per_device_batch_size: 1
num_epoch: 10
steps: 2210
checkpoint_period: 221
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (evaluates 1 batch = 128 validation samples periodically)
eval_interval: 100
eval_steps: 1

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
