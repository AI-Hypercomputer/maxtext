# Step 1: Pretrain / Align the custom MLP vision projector on COCO-Narratives image-caption data.
#
# Example command to run COCO pretraining on TPU VM:
# python3 -m maxtext.experimental.omni_poc.train_sft_omni src/maxtext/experimental/omni_poc/pretrain-omni-gemma3-qwen3-coco.yml

# Inherit model architecture (Gemma 3 4B Vision Tower + Qwen 3 4B Decoder + Custom MLP Connector)
base_config: "maxtext-omni-gemma3-qwen3.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true
learning_rate: 2.e-4

# Train ONLY the custom MLP projector by freezing all other parameters
trainable_parameters_mask: ["custom_linear"]

# -------------- HF pipeline (COCO-Narratives) --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-4B"
hf_path: 'Fhrozen/coco-narratives'
train_split: 'train'
hf_eval_split: 'val'

# Image column
train_image_column: 'image'
eval_image_column: 'image'

# Text columns: ['prompt', 'narratives']
train_data_columns: ['prompt', 'narratives']
eval_data_columns: ['prompt', 'narratives']
default_prompt: "Describe the image concisely"

# Checkpoint paths
load_parameters_path: "gs://yuchenhou-maxtext-logs/omni_checkpoints/omni_stitched_gemma3-4b_qwen3-4b/0/items"
base_output_directory: "gs://yuchenhou-maxtext-logs/omni-gemma3-qwen3/multimodal/pretrain_coco"
run_name: "omni_pretrain_coco_embedder_only"

# Training schedule (~2 full epochs of COCO narratives ~120k samples)
per_device_batch_size: 4
num_epoch: 3
steps: 16001
checkpoint_period: 1000
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings
eval_interval: 1000
eval_steps: 100

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 2048
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
