# Config for SFT Omni-Gemma3-Qwen3-14B on TPU v4-128 (128 devices) for 5 Epochs

base_config: "maxtext-omni-gemma3-qwen3-14b.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true
learning_rate: 3.e-4

# Train ONLY the custom MLP projector by freezing all other parameters
trainable_parameters_mask: ["custom_linear"]

# -------------- HF pipeline --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-14B"
hf_path: 'HuggingFaceM4/ChartQA'
train_split: 'train'
hf_eval_split: 'val'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# Checkpoint paths (override via CLI if needed)
load_parameters_path: "gs://yuchenhou-maxtext-logs/omni-gemma3-qwen3-14b/multimodal/pretrain_chartnet_xpk/omni_14b_pretrain_chartnet_xpk_128_csv/checkpoints/2100/items"
base_output_directory: "gs://yuchenhou-maxtext-logs/omni-gemma3-qwen3-14b/multimodal/sft_after_chartnet"
run_name: "omni_14b_sft_chartqa_xpk_128"

# Training schedule for 5 epochs on v4-128 (128 devices * 1 per_device_batch_size = 128 global batch size):
# 28,288 examples * 5 / 128 = 1105 steps
per_device_batch_size: 1
num_epoch: 5
steps: 1105
checkpoint_period: 100
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (disabled)
eval_interval: -1
eval_steps: 0

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
