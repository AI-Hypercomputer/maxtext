# model config for maxtext-omni-gemma3-qwen3-14b
# Combines LLM backbone from Qwen 3 14B with Vision features from Gemma 3 4B

base_config: "base.yml"
model_name: "maxtext-omni-gemma3-qwen3"
use_multimodal: true

# Vision encoder config (from gemma3-4b.yml)
vision_encoder_block: "gemma3"
image_size_for_vit: 896
num_channels_for_vit: 3
patch_size_for_vit: 14
conv_stride_for_vit: 14
hidden_size_for_vit: 1152
intermediate_size_for_vit: 4304
num_hidden_layers_for_vit: 27
num_attention_heads_for_vit: 16
image_placeholder: "<image>"

# Vision projector config
vision_projector_type: "customized_vision_projector"
vision_connector_hidden_size: 4096
vision_connector_num_layers: 3
vision_connector_activation: "gelu"
vision_connector_use_bias: true

# LLM backbone config (from qwen3-14b.yml)
base_emb_dim: 5120
base_num_query_heads: 40
base_num_kv_heads: 8
base_mlp_dim: 17408
base_num_decoder_layers: 40
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 151936
decoder_block: "qwen3"
normalization_layer_epsilon: 1.0e-6
rope_max_timescale: 1000000
use_qk_norm: true
logits_via_embedding: false # Qwen 14B does not tie word embeddings
normalize_embedding_logits: false
enable_dropout: false
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-14B"

# Parallelism settings for 14B on TPU
ici_fsdp_parallelism: -1
ici_tensor_parallelism: 4

# Ensure no pretrained weights or checkpoints are loaded initially
load_parameters_path: ""
