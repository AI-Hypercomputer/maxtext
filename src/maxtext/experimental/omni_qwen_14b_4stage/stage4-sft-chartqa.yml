# Stage 4: ChartQA Visual Question Answering SFT on TPU v4-128 (128 devices) for 5 Epochs

base_config: "maxtext-omni-qwen3-vl-14b.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

# Fine-tune the 2-layer MLP projector on ChartQA
trainable_parameters_mask: ["custom_linear", "ln_q"]
learning_rate: 1.5e-4

lr_schedule_type: 'cosine'
warmup_steps_fraction: 0.03
learning_rate_final_fraction: 0.05
adamw_mask: ['.*norm.*', '.*bias.*']
gradient_clipping_threshold: 1.0

# -------------- HF pipeline (ChartQA) --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-14B"
hf_path: 'HuggingFaceM4/ChartQA'
train_split: 'train'
hf_eval_split: 'val'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# Data loader settings (in-process data loading to prevent TPU worker subprocess conflict)
grain_worker_count: 0
grain_worker_count_eval: 0

# Training schedule for 5 epochs
per_device_batch_size: 1
num_epoch: 5
steps: 1105
checkpoint_period: 100
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (disabled during training)
eval_interval: -1
eval_steps: 0

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: false
attention: "dot_product"

# Parallelism settings for 14B on TPU (Tensor Parallelism = 4)
ici_fsdp_parallelism: 1
ici_tensor_parallelism: 4
