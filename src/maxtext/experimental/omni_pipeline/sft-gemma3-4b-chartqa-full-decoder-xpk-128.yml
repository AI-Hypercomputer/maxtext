# Config for SFT original Gemma 3 4B on TPU v4-128 (128 devices) for 5 Epochs (Projector + Decoder)

base_config: "base.yml"
model_name: "gemma3-4b"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

# Fine-tune BOTH the Gemma 3 Vision Projector / Embedder and the full LLM Decoder
trainable_parameters_mask: ["VisionEmbedder_0", "decoder"]

# Reduced learning rate appropriate for full LLM decoder fine-tuning
learning_rate: 3.e-5

# Optimizer & LR Schedule settings
lr_schedule_type: "cosine"
warmup_steps_fraction: 0.03
learning_rate_final_fraction: 0.1
adam_weight_decay: 0.01
adamw_mask: [".*norm.*", ".*bias.*"]
gradient_clipping_threshold: 1.0

# -------------- HF pipeline --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "google/gemma-3-4b-it"
hf_path: 'parquet'
hf_train_files: '/dev/shm/chartqa_shuffled/train-*'
hf_eval_files: '/dev/shm/chartqa_shuffled/val-*'
train_split: 'train'
hf_eval_split: 'train'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# In-process data loading
grain_worker_count: 0

# Checkpoint paths
load_parameters_path: ""
base_output_directory: ""
run_name: "gemma3_4b_sft_chartqa_5epoch_full_decoder_v4_128"

# Training schedule for 5 epochs on v4-128 (128 chips * 1 = global batch size 128):
# 28,288 examples * 5 / 128 = 1105 steps
per_device_batch_size: 1
num_epoch: 5
steps: 1105
checkpoint_period: 100
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (evaluates 1 batch = 128 validation samples periodically)
eval_interval: 100
eval_steps: 1

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
