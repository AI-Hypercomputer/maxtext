# Stage 2 Config: SFT Omni-Gemma3-Qwen3 on TPU v4-128 (128 devices) for 5 Epochs
# Full Fine-tuning: Trains BOTH custom MLP projector ("custom_linear") and Qwen3 LLM decoder ("decoder").

base_config: "maxtext-omni-gemma3-qwen3.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

# Fine-tune BOTH custom MLP projector and full LLM decoder
trainable_parameters_mask: ["custom_linear", "decoder"]

# Reduced learning rate for full LLM decoder fine-tuning
learning_rate: 1.5e-5
lr_schedule_type: "cosine"
warmup_steps_fraction: 0.05
learning_rate_final_fraction: 0.1
adam_weight_decay: 1e-3
adamw_mask: [".*norm.*", ".*bias.*"]
gradient_clipping_threshold: 1.0

# -------------- HF pipeline (ChartQA pre-sharded parquet) --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-4B"
hf_path: 'parquet'
hf_train_files: '/dev/shm/chartqa_shuffled/train-*'
hf_eval_files: '/dev/shm/chartqa_shuffled/val-*'
train_split: 'train'
hf_eval_split: 'train'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# In-process data loading
grain_worker_count: 0

# Checkpoint paths (takes Stage 1 Core CSV 2ep final checkpoint)
# run_name: "omni_gemma3_qwen3_2stage_core_csv_2ep_stage2_chartqa_full_decoder"
load_parameters_path: ""
base_output_directory: ""
run_name: "omni_gemma3_qwen3_2stage_csv2ep_sft_full_decoder_lr1.5e-5_wd1e-3"
# run_name: "omni_gemma3_qwen3_2stage_csv2ep_sft_8ep_full_decoder_lr1.5e-5_wd1e-3"

# Training schedule for 5 epochs on v4-128 (128 chips * 1 = global batch size 128):
# 28,288 examples * 5 / 128 = 1105 steps
per_device_batch_size: 1
num_epoch: 5
steps: 1105
checkpoint_period: 100
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (evaluates 1 batch = 128 validation samples periodically without exhausting shards)
eval_interval: 100
eval_steps: 1

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
