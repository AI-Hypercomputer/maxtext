# Stage 2 Config: Pretraining / Aligning Omni-Gemma3-Qwen3 custom MLP projector
# on ChartNet (core subset - CSV Table Grounding) on TPU v4-128 (128 devices) for 0.5 Epoch (No Eval).

base_config: "maxtext-omni-gemma3-qwen3.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

# Pretrain ONLY the custom MLP projector to align Gemma 3 vision features with Qwen 3 text space
trainable_parameters_mask: ["custom_linear"]

# Learning rate and schedule for projector alignment on 128 devices
learning_rate: 3.e-4
lr_schedule_type: 'cosine'
warmup_steps_fraction: 0.05
learning_rate_final_fraction: 0.1
adamw_mask: ['.*norm.*', '.*bias.*']
gradient_clipping_threshold: 1.0

# -------------- HF pipeline (ibm-granite/ChartNet - core subset) --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-4B"
hf_path: 'parquet'
hf_train_files: '/dev/shm/chartnet_core_sharded/train-*'
train_split: 'train'

# In-process data loading to prevent worker subprocess conflicts
grain_worker_count: 0

# Image & Text columns: ['prompt', 'csv']
train_image_column: 'image'
train_data_columns: ['prompt', 'csv']
default_prompt: "Extract the data table from this chart in CSV format."

# Checkpoint paths (can be overridden via CLI in orchestration script)
load_parameters_path: ""
base_output_directory: ""
run_name: "omni_gemma3_qwen3_3stage_core_half_epoch_stage2_csv"

# Training schedule for 0.5 epoch on v4-128:
# 1,698,111 examples * 0.5 epoch / (128 chips * 1 per_device_batch_size = 128 global batch size) = 6,634 steps
per_device_batch_size: 1
num_epoch: 1
steps: 6634
checkpoint_period: 1000
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (disabled during pretraining)
eval_interval: -1
eval_steps: 0

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 2048
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
