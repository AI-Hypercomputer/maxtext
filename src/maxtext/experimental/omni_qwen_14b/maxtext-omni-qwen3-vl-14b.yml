# model config for maxtext-omni-qwen3-vl-14b
# Combines fine-grained ViT from Qwen 3 VL 4B with LLM backbone from Qwen 3 14B

base_config: "base.yml"
model_name: "maxtext-omni-qwen3-vl-14b"
use_multimodal: true
scan_layers: false

# Vision encoder config (from qwen3-vl-4b.yml)
vision_encoder_block: "qwen3_vl"
image_size_for_vit: 768
hidden_size_for_vit: 1024
intermediate_size_for_vit: 4096
num_attention_heads_for_vit: 16
num_hidden_layers_for_vit: 24
num_channels_for_vit: 3
patch_size_for_vit: 16
temporal_patch_size_for_vit: 2
spatial_merge_size_for_vit: 2
out_hidden_size_for_vit: 5120
num_position_embeddings_for_vit: 2304
deepstack_visual_indexes_for_vit: []  # Disabled for stitched 14B model to support scan_layers and prevent dimension mismatch
image_placeholder: "<|image_pad|>"

# MRoPE (3D Rotary Position Embeddings)
use_mrope: false
mrope_section: [24, 20, 20]

# Vision projector config (2x2 spatial patch merge 4096 -> 5120 text embedding space)
vision_projector_type: "customized_vision_projector"
vision_connector_hidden_size: 4096
vision_connector_num_layers: 3
vision_connector_activation: "gelu"
vision_connector_use_bias: true

# LLM backbone config (from qwen3-14b.yml)
base_emb_dim: 5120
base_num_query_heads: 40
base_num_kv_heads: 8
base_mlp_dim: 17408
base_num_decoder_layers: 40
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 151936
decoder_block: "qwen3"
normalization_layer_epsilon: 1.0e-6
rope_max_timescale: 1000000
use_qk_norm: true
logits_via_embedding: false # Qwen 14B untied word embeddings
normalize_embedding_logits: false
enable_dropout: false
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-14B"

# Ensure no pretrained weights or checkpoints are loaded initially
load_parameters_path: ""
