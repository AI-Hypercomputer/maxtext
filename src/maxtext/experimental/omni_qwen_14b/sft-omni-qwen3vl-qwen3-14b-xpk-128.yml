# Config for SFT Omni-Qwen3VL-Qwen3-14B on TPU v4-128 (128 devices) for 5 Epochs

base_config: "maxtext-omni-qwen3vl-qwen3-14b.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

# Option A (Recommended): Unfreeze custom MLP projector AND LLM decoder for end-to-end multimodal reasoning
trainable_parameters_mask: ["custom_linear", "decoder"]
learning_rate: 4.e-5
lr_schedule_type: 'cosine'
warmup_steps_fraction: 0.03
learning_rate_final_fraction: 0.1
adam_weight_decay: 0.01
adamw_mask: ['.*norm.*', '.*bias.*']
gradient_clipping_threshold: 1.0

# -------------- HF pipeline (ChartQA) --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-14B"
hf_path: 'HuggingFaceM4/ChartQA'
train_split: 'train'
hf_eval_split: 'val'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# Checkpoint paths (override via CLI if needed)
load_parameters_path: ""
base_output_directory: ""
run_name: "omni_qwen3vl_14b_sft_chartqa_xpk_128"

# Training schedule for 5 epochs on v4-128 (128 devices * 1 per_device_batch_size = 128 global batch size):
# 28,288 examples * 5 / 128 = 1105 steps
per_device_batch_size: 1
num_epoch: 5
steps: 1105
checkpoint_period: 100
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings (disabled)
eval_interval: -1
eval_steps: 0

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
