# Stage 2 Config: Full-Model SFT on ChartQA (Gemma 3 ViT + Normalized Projector + Qwen 3 Decoder)
# Unfreezes the SigLIP Vision Encoder (Gemma3VisionEncoderLayer_0), custom normalized MLP projector
# (RMSNorm + custom_linear), and Qwen 3 LLM decoder (decoder) for end-to-end joint fine-tuning.

base_config: "maxtext-omni-gemma3-qwen3.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false

# CRITICAL: Unfreeze vision encoder so gradients flow through custom_linear into Gemma3VisionEncoderLayer_0
freeze_vision_encoder_params: false

# Train ALL 3 components: Gemma 3 Vision Tower + Normalized MLP Projector + Qwen 3 LLM Decoder
trainable_parameters_mask: ["Gemma3VisionEncoderLayer_0", "custom_linear", "decoder"]

# Learning rate and schedule for joint Vision Tower + Projector + LLM Decoder fine-tuning on TPU v4-128
# Uses 5.e-6 (3x lower than frozen-ViT 1.5e-5) to prevent representation drift in unfrozen SigLIP ViT
learning_rate: 5.e-6
lr_schedule_type: "cosine"
warmup_steps_fraction: 0.05
learning_rate_final_fraction: 0.1
adam_weight_decay: 0.001
adamw_mask: [".*norm.*", ".*bias.*"]
gradient_clipping_threshold: 1.0

# -------------- HF pipeline (ChartQA pre-sharded parquet) --------------
dataset_type: hf
tokenizer_type: "huggingface"
tokenizer_path: "Qwen/Qwen3-4B"
hf_path: 'parquet'
hf_train_files: '/dev/shm/chartqa_shuffled/train-*'
hf_eval_files: '/dev/shm/chartqa_shuffled/val-*'
train_split: 'train'
hf_eval_split: 'train'
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']

# In-process data loading
grain_worker_count: 0

# Checkpoint paths (defaults; overridden dynamically by orchestration script)
load_parameters_path: ""
base_output_directory: ""
run_name: "omni_qwen3-4b_stage2_full_model"

# Training schedule for 10 epochs on v4-128 (128 chips * 1 = global batch size 128):
# 28,288 examples * 10 / 128 = 2210 steps (checkpoint every 221 steps = 1 checkpoint per epoch)
per_device_batch_size: 1
num_epoch: 10
steps: 2210
checkpoint_period: 221
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true

# Evaluation settings
eval_interval: 221
eval_steps: 1

# Sequence length & attention settings
max_prefill_predict_length: 1024
max_target_length: 1600
max_num_images_per_example: 1
scan_layers: true
attention: "dot_product"
