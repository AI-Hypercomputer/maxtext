# Video SFT Configuration on TPU v4-128 (128 devices) for Stitched Omni Qwen3-VL 14B

base_config: "maxtext-omni-qwen3-vl-14b.yml"

use_sft: true
use_tunix_gradient_accumulation: false
use_multimodal: true
sft_train_on_completion_only: true
packing: false
freeze_vision_encoder_params: true

# Fine-tune the 3-layer MLP projector on video data
trainable_parameters_mask: ["custom_linear", "ln_q"]
learning_rate: 2.e-5

lr_schedule_type: "cosine"
warmup_steps_fraction: 0.03
learning_rate_final_fraction: 0.1
adamw_mask: [".*norm.*", ".*bias.*"]
gradient_clipping_threshold: 1.0

# -------------- HF Video Dataset Pipeline (Stored in /dev/shm) --------------
dataset_type: hf
hf_path: "parquet"
hf_train_files: "/dev/shm/LLaVA-Video-178K/0_30_s_academic_v0_1/*.parquet"
train_data_columns: ["query", "response"]
train_image_column: "video"

# Static Video Grid Limits for TPU JIT Compilation
video_max_grid_t: 32
video_max_grid_h: 32
video_max_grid_w: 32
use_audio_in_video: false



# Data loader settings (in-process data loading to prevent TPU worker subprocess conflicts)
grain_worker_count: 0
grain_worker_count_eval: 0

# Training schedule & batch size
per_device_batch_size: 1
num_epoch: 4
steps: 1000
checkpoint_period: 100
log_period: 1
save_checkpoint_on_completion: true
async_checkpointing: true
enable_checkpointing: true

# Evaluation settings (disabled during training)
eval_interval: -1
eval_steps: 0

# Sequence length & attention settings
max_prefill_predict_length: 7168
max_target_length: 8192
max_num_images_per_example: 1
scan_layers: false
remat_policy: "full"
attention: "dot_product"
attention_for_vit: "autoselected"

# Parallelism settings for 14B on TPU v4-128 (Tensor Parallelism = 4, FSDP = -1)
ici_fsdp_parallelism: -1
ici_tensor_parallelism: 4
