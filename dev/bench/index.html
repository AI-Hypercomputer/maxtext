                '<div class="suite-card-sub">' + esc(suite.stage) + '</div>' +
              '</div>' +
              '<div class="suite-stats-row">' +
                '<span class="stat-kv"><span class="k">Latest:</span><b class="v">' +
                  esc(formatDurationHuman(suite.latestDuration)) +
                '</b> <span class="k">(' + esc(formatSecCompact(suite.latestDuration)) + ')</span></span>' +
                (minDur != null
                  ? '<span class="stat-kv"><span class="k">Window:</span><b class="v">' +
                    esc(formatDurationHuman(minDur)) +
                    ' &ndash; ' +
                    esc(formatDurationHuman(maxDur)) +
                    '</b></span>'
                  : '') +
                '<span class="stat-kv"><span class="k">Tests:</span><b class="v">' +
                  (suite.latestCount != null ? esc(suite.latestCount) : '—') +
                '</b></span>' +
                (lastSha
                  ? '<span class="stat-kv"><span class="k">Commit:</span>' +
                    (lastUrl
                      ? '<a class="runner-tag" href="' + esc(lastUrl) + '" target="_blank" rel="noopener">' + esc(lastSha) + '</a>'
                      : '<span class="runner-tag">' + esc(lastSha) + '</span>') +
                    '</span>'
                  : '') +
              '</div>' +
            '</div>' +
            '<div class="suite-charts-grid">' +
              '<div class="chart-panel">' +
                '<div class="chart-panel-head">' +
                  '<span class="chart-panel-title">Total ' + esc(suite.key) + ' Tests Duration (sec)</span>' +
                  '<span class="chart-panel-legend">' +
                    (suite.median7d != null
                      ? '<span><i class="legend-line"></i>7d med ' + esc(formatDurationHuman(suite.median7d)) + '</span>'
                      : '') +
                    (!suite.archived && suite.median7d != null
                      ? '<span><i class="legend-line alert"></i>115% of 7d med</span>'
                      : '') +
                  '</span>' +
                '</div>' +
                '<div class="svg-chart-wrap" data-chart="duration">' + durChart.svgHtml + '</div>' +
              '</div>' +
              '<div class="chart-panel">' +
                '<div class="chart-panel-head">' +
                  '<span class="chart-panel-title">Total ' + esc(suite.key) + ' Tests Count</span>' +
                  '<span class="chart-panel-legend">' + esc(pts.length) + ' runs</span>' +
                '</div>' +
                '<div class="svg-chart-wrap" data-chart="count">' + cntChart.svgHtml + '</div>' +
              '</div>' +
            '</div>';

          bindSyncedSuiteCharts(card, suite, durChart, cntChart);
          return card;
        }

        function init() {
          const data = window.BENCHMARK_DATA || { lastUpdate: 0, repoUrl: '', entries: {} };

          // Render header
          const luEl = document.getElementById('last-update');
          if (luEl) {
            luEl.textContent = data.lastUpdate ? formatUtcShort(data.lastUpdate) : '—';
            if (data.lastUpdate) luEl.title = new Date(data.lastUpdate).toUTCString();
          }

          const repoLink = document.getElementById('repository-link');
          if (repoLink && data.repoUrl) {
            repoLink.href = data.repoUrl;
            repoLink.textContent = data.repoUrl.replace(/^https?:\/\/github\.com\//, '');
            repoLink.title = data.repoUrl;
          }

          // Render footer JSON download
          const dlBtn = document.getElementById('dl-button');
          if (dlBtn) {
            dlBtn.onclick = () => {
              const jsonText = JSON.stringify(data, null, 2);
              if (typeof Blob === 'function' && window.URL && typeof URL.createObjectURL === 'function') {
                const blob = new Blob([jsonText], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'benchmark_data.json';
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
              } else {
                const a = document.createElement('a');
                a.href = 'data:,' + jsonText;
                a.download = 'benchmark_data.json';
                a.click();
              }
            };
          }

          const model = parseDataset(data);
          const dot = document.querySelector('.brand-dot');
          if (dot && Date.now() - model.newestMs > FRESH_MS) dot.style.background = 'var(--warn)';
          return model;
        }

        function matchesFilters(suite) {
          if (state.hwFilter === 'active' && suite.archived) return false;
          if (state.hwFilter === 'archived' && !suite.archived) return false;
          if (state.hwFilter === 'tpu' && (suite.archived || suite.hw !== 'tpu')) return false;
          if (state.hwFilter === 'tpu7x' && (suite.archived || suite.hw !== 'tpu7x')) return false;
          if (state.hwFilter === 'gpu' && (suite.archived || suite.hw !== 'gpu')) return false;

          if (state.search) {
            const q = state.search.toLowerCase();
            const hay = (suite.key + ' ' + suite.device + ' ' + suite.runner + ' ' + suite.stage).toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        }

        function renderDashboard(model) {
          const main = document.getElementById('main');
          if (!main) return;
          if (tooltipEl) tooltipEl.style.display = 'none';

          const { suites, newestMs } = model;
          const activeSuites = suites.filter(s => !s.archived);
          const archivedSuites = suites.filter(s => s.archived);

          const countsByHw = {
            active: activeSuites.length,
            tpu: activeSuites.filter(s => s.hw === 'tpu').length,
            tpu7x: activeSuites.filter(s => s.hw === 'tpu7x').length,
            gpu: activeSuites.filter(s => s.hw === 'gpu').length,
            archived: archivedSuites.length,
          };

          const filteredSuites = suites.filter(matchesFilters);

          // KPI metrics computed over active suites (or filtered active suites)
          const kpiPool = state.hwFilter === 'archived' ? archivedSuites : activeSuites;
          const totalLatestSec = kpiPool.reduce((acc, s) => acc + (s.latestDuration || 0), 0);
          const totalMed7dSec = kpiPool.reduce((acc, s) => acc + (s.median7d || s.latestDuration || 0), 0);
          const totalDeltaPct =
            totalMed7dSec > 0 ? ((totalLatestSec - totalMed7dSec) / totalMed7dSec) * 100 : null;

          const totalTests = kpiPool.reduce((acc, s) => acc + (s.latestCount || 0), 0);
          let windowTestDelta = 0;
          for (const s of kpiPool) {
            const wPts = windowPoints(s, newestMs, state.rangeDays).filter(p => p.count != null);
            if (wPts.length >= 2) {
              windowTestDelta += wPts[wPts.length - 1].count - wPts[0].count;
            }
          }

          const overAlert = activeSuites.filter(s => s.deltaPct != null && s.deltaPct >= 15);
          const nearAlert = activeSuites.filter(s => s.deltaPct != null && s.deltaPct >= 8 && s.deltaPct < 15);

          main.innerHTML = '';

          // 1. Hero & Filter Toolbar Card
          const heroCard = document.createElement('section');
          heroCard.className = 'b-card benchmark-set';
          heroCard.innerHTML =
            '<div class="hero-top">' +
              '<div class="hero-title-group">' +
                '<h1>MaxText Test Execution Times ' +
                  '<button type="button" class="guide-btn" id="guide-toggle-btn">' +
                    (state.guideOpen ? 'Hide guide' : 'How to read') +
                  '</button>' +
                '</h1>' +
                '<p class="hero-subtitle">' +
                  'Suite-level execution durations (summed across pytest shards) and test counts (skipped and failed tests included) from 4-hourly scheduled runs on <code>main</code>.' +
                '</p>' +
              '</div>' +
            '</div>' +
            '<div class="guide-box" id="bench-guide"' + (state.guideOpen ? '' : ' hidden') + '>' +
              '<strong>CI/CD Pipeline &amp; Benchmark Rules</strong>' +
              '<ul>' +
                '<li><strong>Source:</strong> Scheduled runs of <code>ci_pipeline.yml</code> (every 4 hours on <code>main</code>) execute sharded suites via <code>run_tests_coordinator.yml</code> and aggregate JUnit XML artifacts in <code>tools/dev/process_test_results.py</code>.</li>' +
                '<li><strong>Duration &amp; Thresholds:</strong> Summed test execution seconds across all worker shards of each flavor (<code>customSmallerIsBetter</code>). CI comments on the commit when a suite takes more than <strong>115%</strong> of the previous recorded result. The red dashed line on the charts is a different reference: 115% of the 7-day median. PR runs also enforce per-test (+20% &amp; +15s/+30s) and like-for-like suite growth (&gt;1.20x &amp; +300s) checks.</li>' +
                '<li><strong>Why CPU &amp; Decoupled are Archived:</strong> CPU runner noise caused false alerts, so <code>CPU-*</code> flavors (since Aug 4) and <code>DECOUPLED</code> (since Oct 15) are left out of <code>data.js</code>. The <code>CPU-TORCH-REFERENCE</code> flavor was removed on Jul 30. CPU flavors that still run are still timed in <code>per_test_baseline.json</code>.</li>' +
                '<li><strong>Commit on a point:</strong> the head of <code>main</code> when the result was recorded. It can be newer than the commit that run tested.</li>' +
              '</ul>' +
            '</div>' +
            '<div class="toolbar-row">' +
              '<div class="seg-group" role="group" aria-label="Time window">' +
                [
                  { d: 7, label: '7d' },
                  { d: 14, label: '14d' },
                  { d: 30, label: '30d' },
                  { d: 90, label: '90d' },
                  { d: 0, label: 'All' },
                ]
                  .map(
                    opt =>
                      '<button type="button" class="seg-btn' +
                      (state.rangeDays === opt.d ? ' active' : '') +
                      '" data-range="' +
                      opt.d +
                      '">' +
                      opt.label +
                      '</button>'
                  )
                  .join('') +
              '</div>' +
              '<div class="seg-group" role="group" aria-label="Y-axis scale">' +
                '<button type="button" class="seg-btn' +
                  (state.yScale === 'zero' ? ' active' : '') +
                  '" data-yscale="zero" title="Anchor Y-axis at 0">Y: 0-Base</button>' +
                '<button type="button" class="seg-btn' +
                  (state.yScale === 'fit' ? ' active' : '') +
                  '" data-yscale="fit" title="Zoom Y-axis to data range">Y: Fit</button>' +
              '</div>' +
              '<span class="toolbar-divider" aria-hidden="true"></span>' +
              '<div class="hw-chips" role="group" aria-label="Hardware filter">' +
                '<button type="button" class="fchip' + (state.hwFilter === 'active' ? ' on' : '') + '" data-hw="active">All Active <span class="count-pill">' + countsByHw.active + '</span></button>' +
                '<button type="button" class="fchip' + (state.hwFilter === 'tpu' ? ' on' : '') + '" data-hw="tpu"><span class="hw-dot" style="background:#2563EB"></span>TPU v6e <span class="count-pill">' + countsByHw.tpu + '</span></button>' +
                '<button type="button" class="fchip' + (state.hwFilter === 'tpu7x' ? ' on' : '') + '" data-hw="tpu7x"><span class="hw-dot" style="background:#0D9488"></span>TPU 7x <span class="count-pill">' + countsByHw.tpu7x + '</span></button>' +
                '<button type="button" class="fchip' + (state.hwFilter === 'gpu' ? ' on' : '') + '" data-hw="gpu"><span class="hw-dot" style="background:#EA580C"></span>GPU A100 <span class="count-pill">' + countsByHw.gpu + '</span></button>' +
                (countsByHw.archived > 0
                  ? '<button type="button" class="fchip' + (state.hwFilter === 'archived' ? ' on' : '') + '" data-hw="archived"><span class="hw-dot" style="background:#64748B"></span>Archived <span class="count-pill">' + countsByHw.archived + '</span></button>'
                  : '') +
              '</div>' +
              '<div class="search-wrap">' +
                '<input type="search" id="bench-search" class="search-input" placeholder="Filter suite or runner…" value="' + esc(state.search) + '" aria-label="Filter suites" />' +
              '</div>' +
            '</div>';
          main.appendChild(heroCard);

          // 2. KPI Summary Row
          const kpiRow = document.createElement('section');
          kpiRow.className = 'kpi-grid';
          kpiRow.innerHTML =
            '<div class="kpi-tile">' +
              '<div class="kpi-label">Active Accelerator Suites</div>' +
              '<div class="kpi-value-row">' +
                '<span class="kpi-value">' + countsByHw.active + '</span>' +
                '<span class="delta-chip ' + (Date.now() - newestMs <= FRESH_MS ? 'delta-good' : 'delta-warn') + '">' + esc(freshnessText(newestMs)) + '</span>' +
              '</div>' +
              '<div class="kpi-sub">' +
                countsByHw.tpu + ' TPU v6e &middot; ' + countsByHw.tpu7x + ' TPU 7x &middot; ' + countsByHw.gpu + ' GPU A100' +
              '</div>' +
            '</div>' +
            '<div class="kpi-tile">' +
              '<div class="kpi-label">' + (state.hwFilter === 'archived' ? 'Archived Last Total Time' : 'Total Latest Test Time') + '</div>' +
              '<div class="kpi-value-row">' +
                '<span class="kpi-value">' + esc(formatDurationHuman(totalLatestSec)) + '</span>' +
                deltaChipHtml(totalDeltaPct) +
              '</div>' +
              '<div class="kpi-sub">' + esc(formatSecCompact(totalLatestSec)) + ' summed across ' + kpiPool.length + ' suites (vs 7d med)</div>' +
            '</div>' +
            '<div class="kpi-tile">' +
              '<div class="kpi-label">Tracked Tests</div>' +
              '<div class="kpi-value-row">' +
                '<span class="kpi-value">' + totalTests.toLocaleString('en-US') + '</span>' +
                '<span class="delta-chip delta-flat">' +
                  (windowTestDelta > 0 ? '+' + windowTestDelta : windowTestDelta < 0 ? String(windowTestDelta) : '0') +
                  ' vs ' + (state.rangeDays > 0 ? state.rangeDays + 'd' : 'start') +
                '</span>' +
              '</div>' +
              '<div class="kpi-sub">Across ' + kpiPool.length + ' ' + (state.hwFilter === 'archived' ? 'archived' : 'active') + ' suites</div>' +
            '</div>' +
            '<div class="kpi-tile">' +
              '<div class="kpi-label">Over 115% of 7-Day Median</div>' +
              '<div class="kpi-value-row">' +
                '<span class="kpi-value">' +
                  (overAlert.length === 0 ? 'None' : overAlert.length + ' Over') +
                '</span>' +
                '<span class="delta-chip ' +
                  (overAlert.length > 0 ? 'delta-crit' : nearAlert.length > 0 ? 'delta-warn' : 'delta-good') +
                '">' +
                  (overAlert.length > 0
                    ? overAlert[0].key
                    : nearAlert.length > 0
                      ? nearAlert.length + ' near (+8%)'
                      : '0 over') +
                '</span>' +
              '</div>' +
              '<div class="kpi-sub">Compared against 7-day rolling suite median</div>' +
            '</div>';
          main.appendChild(kpiRow);

          // 3. Suite Overview Table
          const sortedTableSuites = filteredSuites.slice().sort((a, b) => {
            const dir = state.sortDir;
            switch (state.sortCol) {
              case 'suite':
                return dir * a.key.localeCompare(b.key);
              case 'duration':
                return dir * ((a.latestDuration || 0) - (b.latestDuration || 0));
              case 'delta':
                return dir * ((a.deltaPct == null ? -999 : a.deltaPct) - (b.deltaPct == null ? -999 : b.deltaPct));
              case 'tests':
                return dir * ((a.latestCount || 0) - (b.latestCount || 0));
              case 'updated':
                return dir * (a.lastMs - b.lastMs);
              default:
                return dir * (a.order - b.order || a.key.localeCompare(b.key));
            }
          });

          function sortArrow(col) {
            if (state.sortCol !== col) return '';
            return state.sortDir > 0 ? ' &#9652;' : ' &#9662;';
          }

          const tableCard = document.createElement('section');
          tableCard.className = 'b-card';
          tableCard.innerHTML =
            '<div class="section-head">' +
              '<h2>Suite Summary (' + sortedTableSuites.length + ')</h2>' +
              '<span class="section-note">Click any row to jump to its charts &middot; Click column headers to sort</span>' +
            '</div>' +
            (sortedTableSuites.length === 0
              ? '<div class="empty-state">No benchmark suites match your current filter.</div>'
              : '<div class="table-scroll">' +
                  '<table class="suite-table">' +
                    '<thead>' +
                      '<tr>' +
                        '<th data-sort="suite">Suite' + sortArrow('suite') + '</th>' +
                        '<th data-sort="order">Device &amp; Runner' + sortArrow('order') + '</th>' +
                        '<th class="num" data-sort="duration">Latest Duration' + sortArrow('duration') + '</th>' +
                        '<th class="num" data-sort="delta">vs. 7d Median' + sortArrow('delta') + '</th>' +
                        '<th class="num">Window Min &ndash; Max</th>' +
                        '<th class="num" data-sort="tests">Tests' + sortArrow('tests') + '</th>' +
                        '<th class="num" data-sort="updated">Latest Run' + sortArrow('updated') + '</th>' +
                      '</tr>' +
                    '</thead>' +
                    '<tbody>' +
                      sortedTableSuites
                        .map(s => {
                          const wPts = windowPoints(s, newestMs, state.rangeDays);
                          const durs = wPts.filter(p => p.duration != null).map(p => p.duration);
                          const minD = durs.length ? Math.min(...durs) : null;
                          const maxD = durs.length ? Math.max(...durs) : null;
                          const cardId = 'suite-card-' + s.key.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                          const sha = s.latest && s.latest.commit && s.latest.commit.id ? s.latest.commit.id.slice(0, 7) : '';
                          const shaUrl = s.latest && s.latest.commit && s.latest.commit.url ? s.latest.commit.url : '';
                          const shortRunner = s.runner.replace(/^linux-x86-/, '');
                          const shortRunTime = s.lastMs ? new Date(s.lastMs).toISOString().slice(5, 16).replace('T', ' ') : '—';
                          return (
                            '<tr data-jump="' + esc(cardId) + '">' +
                              '<td><div class="suite-name-cell"><span class="hw-dot" style="background:' + s.color + '"></span><span>' + esc(s.key) + '</span>' +
                              (s.archived ? '<span class="archived-pill">Archived</span>' : '') +
                              '</div></td>' +
                              '<td><span class="runner-tag" title="' + esc(s.device + ' · ' + s.runner) + '">' + esc(s.device) + ' &middot; ' + esc(shortRunner) + '</span></td>' +
                              '<td class="num"><strong>' + esc(formatDurationHuman(s.latestDuration)) + '</strong> <span style="color:var(--muted)">(' + esc(formatSecCompact(s.latestDuration)) + ')</span></td>' +
                              '<td class="num">' + (s.archived ? '<span class="archived-pill">Stopped ' + esc(formatDateShort(s.lastMs)) + '</span>' : deltaChipHtml(s.deltaPct)) + '</td>' +
                              '<td class="num" style="color:var(--ink2)">' + (minD != null ? esc(formatDurationHuman(minD)) + ' &ndash; ' + esc(formatDurationHuman(maxD)) : '—') + '</td>' +
                              '<td class="num">' + (s.latestCount != null ? s.latestCount : '—') + '</td>' +
                              '<td class="num" style="color:var(--muted)">' +
                                esc(shortRunTime) +
                                (sha
                                  ? ' &middot; ' +
                                    (shaUrl
                                      ? '<a class="commit-inline-link" href="' + esc(shaUrl) + '" target="_blank" rel="noopener">' + esc(sha) + '</a>'
                                      : esc(sha))
                                  : '') +
                              '</td>' +
                            '</tr>'
                          );
                        })
                        .join('') +
                    '</tbody>' +
                  '</table>' +
                '</div>');
          main.appendChild(tableCard);

          // 4. Grouped Suite Chart Cards
          const activeFiltered = filteredSuites.filter(s => !s.archived);
          for (const grp of HW_GROUPS) {
            const groupSuites = activeFiltered.filter(s => s.hw === grp.key);
            if (!groupSuites.length) continue;

            const sec = document.createElement('section');
            sec.className = 'hw-section benchmark-graphs';
            sec.innerHTML =
              '<div class="hw-section-header">' +
                '<span class="hw-dot" style="background:' + grp.color + ';width:10px;height:10px"></span>' +
                '<h2>' + esc(grp.sectionTitle) + '</h2>' +
                '<span class="hw-section-meta">' + esc(grp.meta) + '</span>' +
              '</div>';
            for (const s of groupSuites) {
              sec.appendChild(renderSuiteCardElement(s, newestMs));
            }
            main.appendChild(sec);
          }

          // 5. Archived / Legacy Suites (either directly shown when filter==='archived', or collapsed at bottom of 'active' when unsearched)
          const archivedToShow =
            state.hwFilter === 'archived'
              ? filteredSuites.filter(s => s.archived)
              : state.hwFilter === 'active'
                ? archivedSuites.filter(s =>
                    !state.search ||
                    (s.key + ' ' + s.device + ' ' + s.runner + ' ' + s.stage)
                      .toLowerCase()
                      .includes(state.search.toLowerCase())
                  )
                : [];

          if (archivedToShow.length > 0) {
            const details = document.createElement('details');
            details.className = 'archived-details';
            if (state.hwFilter === 'archived' || state.search) details.open = true;

            details.innerHTML =
              '<summary>' +
                '<span>Archived / Legacy CPU &amp; Decoupled Series (' + archivedToShow.length + ')</span>' +
                '<span class="archived-pill">Historical data preserved &middot; Click to expand</span>' +
              '</summary>' +
              '<div class="archived-banner">' +
                'These suites were excluded from macro benchmark charts in <code>tools/dev/process_test_results.py</code> ' +
                '(<code>CPU-*</code> after Jul 31, 2026; <code>DECOUPLED</code> after Oct 15, 2026) because of CPU runner noise; the <code>CPU-TORCH-REFERENCE</code> flavor was removed on Jul 30. ' +
                'CPU flavors that still run are still timed in <code>per_test_baseline.json</code>. A time window (7d, 30d, ...) on these charts counts back from the last point of each series.' +
              '</div>' +
              '<div class="archived-stack"></div>';

            const stack = details.querySelector('.archived-stack');
            for (const s of archivedToShow) {
              stack.appendChild(renderSuiteCardElement(s, newestMs));
            }
            main.appendChild(details);
          }

          // Wire interactive toolbar & table events
          const guideBtn = document.getElementById('guide-toggle-btn');
          if (guideBtn) {
            guideBtn.addEventListener('click', () => {
              state.guideOpen = !state.guideOpen;
              const box = document.getElementById('bench-guide');
              if (box) box.hidden = !state.guideOpen;
              guideBtn.textContent = state.guideOpen ? 'Hide guide' : 'How to read';
            });
          }

          main.querySelectorAll('[data-range]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.rangeDays = Number(btn.dataset.range);
              renderDashboard(model);
            });
          });

          main.querySelectorAll('[data-yscale]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.yScale = btn.dataset.yscale;
              renderDashboard(model);
            });
          });

          main.querySelectorAll('[data-hw]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.hwFilter = btn.dataset.hw;
              renderDashboard(model);
            });
          });

          const searchEl = document.getElementById('bench-search');
          if (searchEl) {
            searchEl.addEventListener('input', () => {
              const pos = searchEl.selectionStart;
              state.search = searchEl.value;
              renderDashboard(model);
              const nextEl = document.getElementById('bench-search');
              if (nextEl) {
                nextEl.focus();
                try {
                  nextEl.setSelectionRange(pos, pos);
                } catch (_e) {}
              }
            });
          }

          main.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
              const col = th.dataset.sort;
              if (state.sortCol === col) {
                state.sortDir = -state.sortDir;
              } else {
                state.sortCol = col;
                state.sortDir = col === 'duration' || col === 'delta' || col === 'tests' || col === 'updated' ? -1 : 1;
              }
              renderDashboard(model);
            });
          });

          main.querySelectorAll('tr[data-jump]').forEach(row => {
            row.addEventListener('click', ev => {
              if (ev.target && ev.target.closest('a')) return;
              const target = document.getElementById(row.dataset.jump);
              if (target) {
                const parentDetails = target.closest('details');
                if (parentDetails) parentDetails.open = true;
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.classList.add('flash-target');
                setTimeout(() => target.classList.remove('flash-target'), 1400);
              }
            });
          });
        }

        // The CI Pulse pane is an iframe. A display:none iframe still downloads its
        // src, so the tag ships without one and it is filled in the first time the
        // tab is opened. Readers who only ever look at the benchmark charts never
        // pay for the dashboard.
        function loadCiFrame() {
          const frame = document.getElementById('ci-metrics-frame');
          if (frame && !frame.getAttribute('src')) {
            frame.setAttribute('src', frame.dataset.src);
          }
        }

        // The iframe is sized against the space the header does not use. The header
        // wraps on a narrow window, so the height is measured rather than assumed.
        function measureChrome() {
          const header = document.getElementById('header');
          if (!header) return;
          const chrome = header.getBoundingClientRect().height + 2;
          document.documentElement.style.setProperty('--ci-chrome', chrome + 'px');
        }

        function setActiveView(viewName) {
          const views = document.querySelectorAll('.page-view');
          const buttons = document.querySelectorAll('.toggle-button');

          views.forEach(view => {
            view.classList.toggle('active', view.id === `${viewName}-page`);
          });

          buttons.forEach(button => {
            button.classList.toggle('active', button.dataset.view === viewName);
          });

          // CI Pulse has a header of its own (title, repository, when its data was collected), so on that tab the
          // outer header keeps only the tab buttons.
          document.body.classList.toggle('view-ci', viewName === 'ci');

          if (viewName === 'ci') {
            measureChrome();
            loadCiFrame();
          }
        }

        document.querySelectorAll('.toggle-button').forEach(button => {
          button.addEventListener('click', () => {
            setActiveView(button.dataset.view);
            // So the tab survives a reload and can be sent to someone else.
            // replaceState, not pushState: Back should leave the page, not walk
            // through every tab the reader clicked.
            history.replaceState(null, '', button.dataset.view === 'ci' ? '#ci' : '#benchmarks');
          });
        });

        if (typeof ResizeObserver === 'function') {
          const header = document.getElementById('header');
          if (header) new ResizeObserver(measureChrome).observe(header);
        } else {
          window.addEventListener('resize', measureChrome);
        }
        measureChrome();

        // Open on whichever tab the URL asks for, so the CI Pulse tab survives a
        // reload and can be linked to.
        setActiveView(location.hash === '#ci' ? 'ci' : 'benchmarks');
        const model = init();
        renderDashboard(model);
      })();
    </script>
  </body>
</html>
