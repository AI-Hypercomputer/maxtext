<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fff;
        font-size: 16px;
        height: 100%;
      }
      body {
        color: #4a4a4a;
        margin: 8px;
        font-size: 1em;
        font-weight: 400;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        margin-bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .header-item {
        display: flex;
        align-items: center;
      }
      .view-toggle {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px;
        border: 1px solid #dfe3e8;
        border-radius: 999px;
        background: #f5f7fa;
      }
      .toggle-button {
        color: #4a4a4a;
        background: transparent;
        border: none;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
      .toggle-button.active {
        color: #fff;
        background-color: #3298dc;
      }
      .page-view {
        display: none;
      }
      .page-view.active {
        display: block;
      }
      #ci-page.page-view.active {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      main {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      #ci-metrics-frame {
        width: 100%;
        /* --ci-chrome is measured from the real header at runtime; 88px is only
           the value used before the first measurement lands. */
        height: calc(100vh - var(--ci-chrome, 88px));
        min-height: 0;
        border: 0;
        background: #ffffff;
        display: block;
      }
      a {
        color: #3273dc;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover {
        color: #000;
      }
      button {
        color: #fff;
        background-color: #3298dc;
        border-color: transparent;
        cursor: pointer;
        text-align: center;
      }
      button:hover {
        background-color: #2793da;
        flex: none;
      }
      .spacer {
        flex: auto;
      }
      .small {
        font-size: 0.75rem;
      }
      footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
      }
      .header-label {
        margin-right: 4px;
      }
      .benchmark-set {
        margin: 8px 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .benchmark-title {
        font-size: 3rem;
        font-weight: 600;
        word-break: break-word;
        text-align: center;
      }
      .benchmark-graphs {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        width: 100%;
      }
      .benchmark-chart {
        max-width: 1000px;
      }
    </style>
    <title>Benchmarks</title>
  </head>

  <body>
    <header id="header">
      <div class="header-item">
        <strong class="header-label">Last Update:</strong>
        <span id="last-update"></span>
      </div>
      <div class="header-item">
        <strong class="header-label">Repository:</strong>
        <a id="repository-link" rel="noopener"></a>
      </div>
      <div class="view-toggle" aria-label="View toggle">
        <button class="toggle-button active" data-view="benchmarks" type="button">Benchmarks</button>
        <button class="toggle-button" data-view="ci" type="button">CI Pulse</button>
      </div>
    </header>

    <div id="benchmarks-page" class="page-view active">
      <main id="main"></main>
      <footer>
        <button id="dl-button">Download data as JSON</button>
        <div class="spacer"></div>
        <div class="small">Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
      </footer>
    </div>

    <div id="ci-page" class="page-view">
      <iframe id="ci-metrics-frame" title="CI Metrics dashboard" data-src="ci-pulse/index.html"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js"></script>
    <script src="data.js"></script>
    <script id="main-script">
      'use strict';
      (function() {
        // Colors from https://github.com/github/linguist/blob/master/lib/linguist/languages.yml
        const toolColors = {
          cargo: '#dea584',
          go: '#00add8',
          benchmarkjs: '#f1e05a',
          benchmarkluau: '#000080',
          pytest: '#3572a5',
          googlecpp: '#f34b7d',
          catch2: '#f34b7d',
          julia: '#a270ba',
          jmh: '#b07219',
          benchmarkdotnet: '#178600',
          customBiggerIsBetter: '#38ff38',
          customSmallerIsBetter: '#ff3838',
          _: '#333333'
        };

        function init() {
          function collectBenchesPerTestCase(entries) {
            const map = new Map();
            for (const entry of entries) {
              const {commit, date, tool, benches} = entry;
              for (const bench of benches) {
                const result = { commit, date, tool, bench };
                const arr = map.get(bench.name);
                if (arr === undefined) {
                  map.set(bench.name, [result]);
                } else {
                  arr.push(result);
                }
              }
            }
            return map;
          }

          const data = window.BENCHMARK_DATA;

          // Render header
          document.getElementById('last-update').textContent = new Date(data.lastUpdate).toString();
          const repoLink = document.getElementById('repository-link');
          repoLink.href = data.repoUrl;
          repoLink.textContent = data.repoUrl;

          // Render footer
          document.getElementById('dl-button').onclick = () => {
            const dataUrl = 'data:,' + JSON.stringify(data, null, 2);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'benchmark_data.json';
            a.click();
          };

          // Prepare data points for charts
          return Object.keys(data.entries).map(name => ({
            name,
            dataSet: collectBenchesPerTestCase(data.entries[name]),
          }));
        }

        // The CI Pulse pane is an iframe. A display:none iframe still downloads its
        // src, so the tag ships without one and it is filled in the first time the
        // tab is opened. Readers who only ever look at the benchmark charts never
        // pay for the dashboard.
        function loadCiFrame() {
          const frame = document.getElementById('ci-metrics-frame');
          if (frame && !frame.getAttribute('src')) {
            frame.setAttribute('src', frame.dataset.src);
          }
        }

        // The iframe is sized against the space the header does not use. The header
        // wraps on a narrow window, so the height is measured rather than assumed.
        function measureChrome() {
          const header = document.getElementById('header');
          if (!header) return;
          // 8px body margin above, 8px header margin below, 8px body margin under.
          const chrome = header.getBoundingClientRect().height + 24;
          document.documentElement.style.setProperty('--ci-chrome', chrome + 'px');
        }

        function setActiveView(viewName) {
          const views = document.querySelectorAll('.page-view');
          const buttons = document.querySelectorAll('.toggle-button');

          views.forEach(view => {
            view.classList.toggle('active', view.id === `${viewName}-page`);
          });

          buttons.forEach(button => {
            button.classList.toggle('active', button.dataset.view === viewName);
          });

          if (viewName === 'ci') {
            measureChrome();
            loadCiFrame();
          }
        }

        document.querySelectorAll('.toggle-button').forEach(button => {
          button.addEventListener('click', () => {
            setActiveView(button.dataset.view);
            // So the tab survives a reload and can be sent to someone else.
            // replaceState, not pushState: Back should leave the page, not walk
            // through every tab the reader clicked.
            history.replaceState(null, '', button.dataset.view === 'ci' ? '#ci' : '#benchmarks');
          });
        });

        if (typeof ResizeObserver === 'function') {
          const header = document.getElementById('header');
          if (header) new ResizeObserver(measureChrome).observe(header);
        } else {
          window.addEventListener('resize', measureChrome);
        }
        measureChrome();

        function renderAllChars(dataSets) {

          function renderGraph(parent, name, dataset) {
            const canvas = document.createElement('canvas');
            canvas.className = 'benchmark-chart';
            parent.appendChild(canvas);

            const color = toolColors[dataset.length > 0 ? dataset[0].tool : '_'];
            const data = {
              labels: dataset.map(d => new Date(d.commit.timestamp).toISOString().slice(0, 10) + ' (' + d.commit.id.slice(0, 7) + ')'),
              datasets: [
                {
                  label: name,
                  data: dataset.map(d => d.bench.value),
                  borderColor: color,
                  backgroundColor: color + '60', // Add alpha for #rrggbbaa
                }
              ],
            };
            const options = {
              scales: {
                xAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: 'date (commit)',
                    },
                  }
                ],
                yAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: dataset.length > 0 ? dataset[0].bench.unit : '',
                    },
                    ticks: {
                      beginAtZero: true,
                    }
                  }
                ],
              },
              tooltips: {
                callbacks: {
                  afterTitle: items => {
                    const {index} = items[0];
                    const data = dataset[index];
                    return '\n' + data.commit.message + '\n\n' + data.commit.timestamp + ' committed by @' + data.commit.committer.username + '\n';
                  },
                  label: item => {
                    let label = item.value;
                    const { range, unit } = dataset[item.index].bench;
                    label += ' ' + unit;
                    if (range) {
                      label += ' (' + range + ')';
                    }
                    return label;
                  },
                  afterLabel: item => {
                    const { extra } = dataset[item.index].bench;
                    return extra ? '\n' + extra : '';
                  }
                }
              },
              onClick: (_mouseEvent, activeElems) => {
                if (activeElems.length === 0) {
                  return;
                }
                // XXX: Undocumented. How can we know the index?
                const index = activeElems[0]._index;
                const url = dataset[index].commit.url;
                window.open(url, '_blank');
              },
            };

            new Chart(canvas, {
              type: 'line',
              data,
              options,
            });
          }

          function renderBenchSet(name, benchSet, main) {
            const setElem = document.createElement('div');
            setElem.className = 'benchmark-set';
            main.appendChild(setElem);

            const nameElem = document.createElement('h1');
            nameElem.className = 'benchmark-title';
            nameElem.textContent = name;
            setElem.appendChild(nameElem);

            const graphsElem = document.createElement('div');
            graphsElem.className = 'benchmark-graphs';
            setElem.appendChild(graphsElem);

            for (const [benchName, benches] of benchSet.entries()) {
              renderGraph(graphsElem, benchName, benches)
            }
          }

          const main = document.getElementById('main');
          for (const {name, dataSet} of dataSets) {
            renderBenchSet(name, dataSet, main);
          }
        }

        // Open on whichever tab the URL asks for, so the CI Pulse tab survives a
        // reload and can be linked to.
        setActiveView(location.hash === '#ci' ? 'ci' : 'benchmarks');
        renderAllChars(init()); // Start
      })();
    </script>
  </body>
</html>
