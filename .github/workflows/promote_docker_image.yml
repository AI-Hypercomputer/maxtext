# This workflow acts as the final gate in the CI/CD pipeline for MaxText Docker images.
# Triggered by:
# 1. Airflow DAG completion (repository_dispatch):
#    - Validates the result of the Airflow DAG (E2E tests).
#    - Validates the result of the nightly build pipeline that produced the Docker images.
#    - If both succeed, it promotes the Docker images by tagging the artifact with the latest tag.
# 2. Manual workflow dispatch (workflow_dispatch):
#    - Forcefully promotes the Docker images when Airflow E2E tests could not run (e.g. due to capacity).

name: Promote MaxText Docker Image
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('Forceful promote: {0} ({1})', inputs.caller_run_id, inputs.test_type) ||
      format('Triggered by Airflow {0} Tests DAG', github.event.client_payload.test_type) }}

on:
  repository_dispatch:
    types: [airflow-dag-complete]
  workflow_dispatch:
    inputs:
      caller_run_id:
        description: 'GitHub workflow run ID of the build pipeline that produced the Docker images'
        required: true
        type: string
      test_type:
        description: 'Workflow to promote (pre_training, post_training, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - pre_training
          - post_training

permissions:
  contents: read
  actions: read

jobs:
  handle_result:
    name: Handle Airflow DAG Result
    runs-on: ubuntu-latest
    steps:
      - name: Report DAG result
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ github.event.client_payload.state }}
          DAG_ID: ${{ github.event.client_payload.dag_id }}
          DAG_RUN_ID: ${{ github.event.client_payload.dag_run_id }}
          SHA: ${{ github.event.client_payload.sha }}
          CALLER_RUN_ID: ${{ github.event.client_payload.github_run_id }}
          TEST_TYPE: ${{ github.event.client_payload.test_type }}
        run: |
          echo "================================"
          echo "Github Run ID: ${CALLER_RUN_ID}"
          echo "DAG ID:        ${DAG_ID}"
          echo "DAG Run ID:    ${DAG_RUN_ID}"
          echo "Commit SHA:    ${SHA}"
          echo "Test Type:     ${TEST_TYPE}"
          echo "State:         ${STATE}"
          echo "================================"

          case "$STATE" in
            success) echo "E2E tests PASSED." ;;
            failed|upstream_failed) echo "E2E tests FAILED."; exit 1 ;;
            *) echo "DAG ended with unexpected state: ${STATE}"; exit 1 ;;
          esac

          if [ -n "$CALLER_RUN_ID" ]; then
            echo "Checking nightly build status for run: $CALLER_RUN_ID"
            gh run watch "$CALLER_RUN_ID" --exit-status --interval 60 --repo "$GITHUB_REPOSITORY"
          else
            echo "Error: No Github Run ID provided. Cannot verify nightly build status."
            exit 1
          fi

      - name: Report manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          TEST_TYPE: ${{ inputs.test_type }}
        run: |
          echo "================================"
          echo "Manual Promotion"
          echo "Github Run ID: ${CALLER_RUN_ID}"
          echo "Test Type:     ${TEST_TYPE}"
          echo "================================"

          if [ -z "$CALLER_RUN_ID" ]; then
            echo "Error: No Github Run ID provided. Cannot promote Docker images without run ID."
            exit 1
          fi

  tag_docker_image:
    name: Promote ${{ matrix.test_type }} Docker Image
    needs: handle_result
    if: needs.handle_result.result == 'success'
    runs-on: linux-x86-n2-16-buildkit
    container: google/cloud-sdk:524.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_type: pre_training
            stable_image_name: maxtext_jax_stable
            nightly_image_name: maxtext_jax_nightly
          - test_type: post_training
            stable_image_name: maxtext_post_training_stable
            nightly_image_name: maxtext_post_training_nightly
    steps:
      - name: Configure Docker
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' &&
              (inputs.test_type == 'all' || inputs.test_type == '' || inputs.test_type == matrix.test_type)) ||
            (github.event_name == 'repository_dispatch' &&
              (github.event.client_payload.test_type == '' || github.event.client_payload.test_type == matrix.test_type))
          }}
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Add tags to Docker image
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' &&
              (inputs.test_type == 'all' || inputs.test_type == '' || inputs.test_type == matrix.test_type)) ||
            (github.event_name == 'repository_dispatch' &&
              (github.event.client_payload.test_type == '' || github.event.client_payload.test_type == matrix.test_type))
          }}
        shell: bash
        env:
          CALLER_RUN_ID: ${{ github.event.client_payload.github_run_id || inputs.caller_run_id }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          STABLE_IMAGE_NAME: ${{ matrix.stable_image_name }}
          NIGHTLY_IMAGE_NAME: ${{ matrix.nightly_image_name }}
        run: |
          promote_from_staging() {
            local img_name="$1"
            local staging_img="us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images-staging/${img_name}"
            local prod_img="us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images/${img_name}"
            local digest
            digest=$(gcloud container images describe "${staging_img}:${CALLER_RUN_ID}" \
              --format="value(image_summary.digest)" 2>/dev/null || true)
            if [ -n "$digest" ]; then
              echo "Promoting ${staging_img}@${digest} to ${prod_img} via Exit Gate..."
              local token
              token="$(gcloud auth print-access-token)"
              local promote_url="https://artifactregistry.googleapis.com/v1/projects/${PROJECT_NAME}/locations/us/repositories/maxtext-images:promoteArtifact"
              local src_repo="projects/${PROJECT_NAME}/locations/us/repositories/maxtext-images-staging"
              local src_ver="${src_repo}/packages/${img_name}/versions/${digest}"
              local payload
              payload=$(SRC_REPO="$src_repo" SRC_VER="$src_ver" python3 -c 'import json, os
          print(json.dumps({
              "source_repository": os.environ["SRC_REPO"],
              "source_version": os.environ["SRC_VER"],
              "attachment_behavior": "PUBLIC_BCID_VSA_ONLY",
          }))')
              local resp
              resp=$(curl -s -w "\n%{http_code}" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -X POST "${promote_url}" \
                -d "${payload}")
              local status
              status=$(echo "$resp" | tail -n 1)
              local body
              body=$(echo "$resp" | sed '$d')
              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
                local op_name
                op_name=$(echo "$body" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("name", ""))')
                for _ in $(seq 1 60); do
                  local op_status
                  op_status=$(curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                    "https://artifactregistry.googleapis.com/v1/${op_name}")
                  local done_flag
                  done_flag=$(echo "$op_status" | python3 -c 'import json, sys; print(str(json.load(sys.stdin).get("done", False)).lower())')
                  if [ "$done_flag" = "true" ]; then
                    break
                  fi
                  sleep 5
                done
              elif ! echo "$body" | grep -qi "already exists"; then
                echo "Warning: promoteArtifact returned HTTP ${status}: ${body}"
              fi
              gcloud container images add-tag "${prod_img}@${digest}" "${prod_img}:${CALLER_RUN_ID}" --quiet || true
            fi
          }

          tag_image() {
            local img="$1"
            local tag="$2"
            echo "Tagging ${img}:${CALLER_RUN_ID} as ${tag}..."
            gcloud container images add-tag "${img}:${CALLER_RUN_ID}" "${img}:${tag}" --quiet
          }

          if [ -z "$CALLER_RUN_ID" ]; then
            echo "Error: CALLER_RUN_ID is empty. Cannot promote Docker image without image tag."
            exit 1
          fi

          tagged_any=false

          # 1. Check if stable image exists (or can be promoted from staging) and tag it
          promote_from_staging "${STABLE_IMAGE_NAME}"
          STABLE_IMAGE="us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images/${STABLE_IMAGE_NAME}"
          if gcloud container images describe "${STABLE_IMAGE}:${CALLER_RUN_ID}" >/dev/null 2>&1; then
            echo "Stable image ${STABLE_IMAGE}:${CALLER_RUN_ID} exists. Tagging stable image..."
            tag_image "${STABLE_IMAGE}" "verified-e2e-${CALLER_RUN_ID}"
            tag_image "${STABLE_IMAGE}" "latest"
            tagged_any=true
          else
            echo "Stable image ${STABLE_IMAGE}:${CALLER_RUN_ID} does not exist. Skipping stable image tagging."
          fi

          # 2. Check if nightly image exists (or can be promoted from staging) and tag it
          promote_from_staging "${NIGHTLY_IMAGE_NAME}"
          NIGHTLY_IMAGE="us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images/${NIGHTLY_IMAGE_NAME}"
          if gcloud container images describe "${NIGHTLY_IMAGE}:${CALLER_RUN_ID}" >/dev/null 2>&1; then
            echo "Nightly image ${NIGHTLY_IMAGE}:${CALLER_RUN_ID} exists. Tagging nightly image..."
            tag_image "${NIGHTLY_IMAGE}" "latest"
            tagged_any=true
          else
            echo "Nightly image ${NIGHTLY_IMAGE}:${CALLER_RUN_ID} does not exist. Skipping nightly image tagging."
          fi

          if [ "$tagged_any" = false ]; then
            echo "Error: Neither stable image (${STABLE_IMAGE}:${CALLER_RUN_ID}) nor nightly image (${NIGHTLY_IMAGE}:${CALLER_RUN_ID}) was found."
            exit 1
          fi
