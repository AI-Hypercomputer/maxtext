# This workflow acts as the final gate in the CI/CD pipeline for MaxText Docker images.
# Triggered by:
# 1. Airflow DAG completion (repository_dispatch):
#    - Tags the tested Docker image with the result of the Airflow DAG (E2E tests):
#      verified-e2e-<tag>, failed-e2e-<tag>, or unknown-e2e-<tag>.
#    - If E2E passed on an image from the daily build that also passed CI (verified-ci-<tag>),
#      it promotes the image (and its nightly counterpart) by tagging it with the latest tag.
# 2. Manual workflow dispatch (workflow_dispatch):
#    - Forcefully promotes a Docker image when Airflow E2E tests could not run (e.g. due to capacity).

name: Promote MaxText Docker Image
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('Forceful promote: {0}', inputs.docker_image) ||
      format('Triggered by Airflow {0} Tests DAG', github.event.client_payload.test_type) }}

on:
  repository_dispatch:
    types: [airflow-dag-complete]
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Full Docker image URI to promote, e.g. us-docker.pkg.dev/<project>/maxtext-images/tpu_pre_training:<tag> (7-char SHA for RC images, or GitHub run ID for daily images)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  handle_result:
    name: Handle Airflow DAG Result
    runs-on: ubuntu-latest
    outputs:
      e2e_state: ${{ steps.report.outputs.e2e_state }}
    steps:
      - name: Report DAG result
        id: report
        if: github.event_name == 'repository_dispatch'
        env:
          STATE: ${{ github.event.client_payload.state }}
          DAG_ID: ${{ github.event.client_payload.dag_id }}
          DAG_RUN_ID: ${{ github.event.client_payload.dag_run_id }}
          SHA: ${{ github.event.client_payload.sha }}
          CALLER_RUN_ID: ${{ github.event.client_payload.github_run_id }}
          TEST_TYPE: ${{ github.event.client_payload.test_type }}
        run: |
          echo "================================"
          echo "Github Run ID: ${CALLER_RUN_ID}"
          echo "DAG ID:        ${DAG_ID}"
          echo "DAG Run ID:    ${DAG_RUN_ID}"
          echo "Commit SHA:    ${SHA}"
          echo "Test Type:     ${TEST_TYPE}"
          echo "State:         ${STATE}"
          echo "================================"

          case "$STATE" in
            success)
              echo "E2E tests PASSED."
              echo "e2e_state=success" >> "$GITHUB_OUTPUT"
              ;;
            failed|upstream_failed)
              echo "E2E tests FAILED."
              echo "e2e_state=failed" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "DAG ended with unexpected state: ${STATE}"
              echo "e2e_state=unknown" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Report manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          echo "================================"
          echo "Manual Promotion"
          echo "Docker Image:  ${DOCKER_IMAGE}"
          echo "================================"

  tag_docker_image:
    name: Promote Docker Image
    needs: handle_result
    if: needs.handle_result.result == 'success'
    runs-on: linux-x86-n2-16-buildkit
    container: google/cloud-sdk:524.0.0
    steps:
      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Add tags to Docker image
        shell: bash
        env:
          E2E_STATE: ${{ needs.handle_result.outputs.e2e_state || 'success' }}
          PAYLOAD_IMAGE: ${{ github.event.client_payload.docker_image || inputs.docker_image }}
        run: |
          tag_image() {
            local img="$1"
            local tag="$2"
            echo "Tagging ${img}:${IMAGE_TAG} as ${tag}..."
            gcloud container images add-tag "${img}:${IMAGE_TAG}" "${img}:${tag}" --quiet
          }

          # Promotes a daily stable image to latest once it has also passed CI. Nightly images are
          # built alongside stable ones but are not E2E tested, so they are promoted together with
          # their stable counterpart.
          promote_to_latest() {
            if gcloud container images describe "${IMAGE}:verified-ci-${IMAGE_TAG}" >/dev/null 2>&1; then
              tag_image "${IMAGE}" "latest"
              local nightly_image="${IMAGE%_stable}_nightly"
              if gcloud container images describe "${nightly_image}:${IMAGE_TAG}" >/dev/null 2>&1; then
                tag_image "${nightly_image}" "latest"
              else
                echo "Nightly image ${nightly_image}:${IMAGE_TAG} does not exist. Skipping nightly image tagging."
              fi
            else
              echo "${IMAGE}:verified-ci-${IMAGE_TAG} does not exist. Skipping latest tag."
            fi
          }

          # Both Airflow and manual runs pass the full image URI (<image>:<tag>).
          IMAGE="${PAYLOAD_IMAGE%:*}"
          IMAGE_TAG="${PAYLOAD_IMAGE##*:}"

          if ! gcloud container images describe "${IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Error: Image ${IMAGE}:${IMAGE_TAG} was not found."
            exit 1
          fi

          echo "Image ${IMAGE}:${IMAGE_TAG} exists. E2E state: ${E2E_STATE}."
          case "$E2E_STATE" in
            success)
              tag_image "${IMAGE}" "verified-e2e-${IMAGE_TAG}"
              gcloud container images untag "${IMAGE}:failed-e2e-${IMAGE_TAG}" --quiet 2>/dev/null || true
              # Only daily-build images are promoted to latest. RC images already get latest-rc
              # when they are built.
              if [[ "$IMAGE" == *_stable ]]; then
                promote_to_latest
              fi
              ;;
            failed)
              tag_image "${IMAGE}" "failed-e2e-${IMAGE_TAG}"
              ;;
            *)
              tag_image "${IMAGE}" "unknown-e2e-${IMAGE_TAG}"
              ;;
          esac
