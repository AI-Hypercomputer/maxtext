# This workflow runs unit tests with Pathways backend.

name: Run Pathways Tests

on:
  workflow_call:
    inputs:
      device_type:
        required: true
        type: string
      device_name:
        required: true
        type: string
      base_image:
        required: true
        type: string
      pytest_marker:
        required: true
        type: string
      pytest_addopts:
        required: false
        type: string
        default: ""
      is_scheduled_run:
        required: true
        type: boolean
      xla_python_client_mem_fraction:
        required: true
        type: string
      tf_force_gpu_allow_growth:
        required: true
        type: boolean
      container_resource_option:
        required: true
        type: string
      cloud_runner:
        required: false
        type: string
      maxtext_sha:
        required: true
        type: string
      total_workers:
        required: false
        type: string
        default: "1"
      worker_group:
        required: false
        type: string
        default: "1"


permissions:
  contents: read

jobs:
  run:
    name: ${{ format('tpu-pathways-{0}', !contains(inputs.pytest_marker, 'not integration_test') && 'integration' || 'unit') }}
    runs-on: ${{ inputs.cloud_runner != '' && inputs.cloud_runner || fromJson(format('["self-hosted", "{0}", "{1}"]', inputs.device_type, inputs.device_name)) }}
    timeout-minutes: 90
    container:
      image: gcr.io/tpu-prod-env-multipod/${{ inputs.base_image }} # zizmor: ignore[unpinned-images]
      env:
        XLA_PYTHON_CLIENT_MEM_FRACTION: ${{ inputs.xla_python_client_mem_fraction }}
        TF_FORCE_GPU_ALLOW_GROWTH: ${{ inputs.tf_force_gpu_allow_growth }}
        IFRT_PROXY_USE_INSECURE_GRPC_CREDENTIALS: true
        PATHWAYS_UNSAFE_UNSAFE_OVERRIDE_GRPC_CREDENTIALS: "grpc_insecure_override"
        JAX_PLATFORMS: "proxy"
        JAX_BACKEND_TARGET: "grpc://127.0.0.1:29000"
        TPU_VISIBLE_DEVICES: ""
      options: ${{ inputs.container_resource_option }}
    steps:
      - name: Checkout MaxText
        env:
          MAXTEXT_SHA: ${{ inputs.maxtext_sha }}
          REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /__w/maxtext/maxtext
          git clone "https://github.com/${REPO}.git" .
          git fetch origin "$MAXTEXT_SHA"
          git checkout FETCH_HEAD
      - name: Download the maxtext wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maxtext-wheel
      - name: Install the maxtext wheel
        shell: bash
        run: |
          python3 -m uv venv --seed
          source .venv/bin/activate
          maxtext_wheel=$(ls maxtext-*-py3-none-any.whl 2>/dev/null)
          uv pip install "${maxtext_wheel}[tpu]" --resolution=lowest
          install_tpu_pre_train_extra_deps
          python3 --version
          python3 -m pip freeze
      - name: Copy test assets files
        run : gcloud storage cp gs://maxtext-test-assets/* tests/assets
      - name: Start Pathways Daemons
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKER_GROUP: ${{ inputs.worker_group }}
          PATHWAYS_UNSAFE_UNSAFE_OVERRIDE_GRPC_CREDENTIALS: "grpc_insecure_override"
          IFRT_PROXY_USE_INSECURE_GRPC_CREDENTIALS: "true"
        run: |
          # Ensure nobody group and user exist (required by cloud_proxy_server_sanitized)
          grep -q '^nobody:' /etc/group || echo "nobody:x:65534:" >> /etc/group
          grep -q '^nobody:' /etc/passwd || echo "nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin" >> /etc/passwd

          cat << 'EOF' > /tmp/extract_pathways.py
          import urllib.request, json, tarfile, io, os

          def get_token(repo):
              url = f"https://us-docker.pkg.dev/v2/token?service=us-docker.pkg.dev&scope=repository:{repo}:pull"
              with urllib.request.urlopen(url) as r:
                  return json.load(r)["token"]

          # These images used to be pulled as ":latest", which is rebuilt daily. The
          # 2026-09-12 build regressed the XLA TPU compiler. Pin to the last build
          # verified green (2026-09-11) so these tests are not red on unrelated PRs.
          #
          # Pinned by digest rather than by the 20260911-jax_* tags because tags are
          # mutable. All nine jax_* tags for a given date resolve to the same digest.
          # TODO: restore ":latest" once the compiler regression is fixed upstream.
          PATHWAYS_IMAGES = {
              "cloud-tpu-v2-images/pathways/server": "sha256:6fb1399d265fc4532805bfb04d6f44a596b3111e30c7f2e4d9fafe98adf7456b",
              "cloud-tpu-v2-images/pathways/proxy_server": "sha256:57781f09427eb2f1863672c04b239ed5fce41e05e598da4c071880ce3eef51d5",
          }

          def extract_image_layers(repo):
              token = get_token(repo)
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.docker.distribution.manifest.v2+json"}
              ref = PATHWAYS_IMAGES[repo]
              manifest_url = f"https://us-docker.pkg.dev/v2/{repo}/manifests/{ref}"
              req = urllib.request.Request(manifest_url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  manifest = json.load(r)
                  # Record what was actually pulled. While pinned these two match, which
                  # is the proof the pin took effect; once it is lifted this is the only
                  # trace of which daily build a given run used.
                  print(f"  {repo} @ {ref} -> {r.headers.get('Docker-Content-Digest')}", flush=True)

              for layer in manifest.get("layers", []):
                  digest = layer["digest"]
                  blob_url = f"https://us-docker.pkg.dev/v2/{repo}/blobs/{digest}"
                  req = urllib.request.Request(blob_url, headers=headers)
                  with urllib.request.urlopen(req) as r:
                      layer_data = r.read()
                  with tarfile.open(fileobj=io.BytesIO(layer_data), mode="r:*") as tar:
                      for member in tar:
                          if member.name.startswith("/") or ".." in member.name:
                              continue
                          norm = os.path.normpath(member.name).lstrip("./")
                          # Crucial: only extract usr/grte and usr/pathways to avoid overwriting /bin/sh or host system binaries
                          if not (norm.startswith("usr/grte") or norm.startswith("usr/pathways")):
                              continue
                          target = os.path.join("/", norm)
                          parent = os.path.dirname(target)
                          os.makedirs(parent, exist_ok=True)
                          try:
                              os.chmod(parent, 0o777)
                          except Exception:
                              pass
                          if os.path.exists(target):
                              try:
                                  os.chmod(target, 0o777)
                                  if os.path.isfile(target) or os.path.islink(target):
                                      os.remove(target)
                              except Exception:
                                  pass
                          if member.isdir():
                              os.makedirs(target, exist_ok=True)
                              try:
                                  os.chmod(target, 0o777)
                              except Exception:
                                  pass
                          else:
                              try:
                                  f = tar.extractfile(member)
                                  if f is not None:
                                      with open(target, "wb") as out:
                                          out.write(f.read())
                                      mode = member.mode or 0o755
                                      if member.isfile() and (norm.endswith(".so") or "sanitized" in norm or "/lib64/" in norm or "/run/" in norm):
                                          mode |= 0o755
                                      os.chmod(target, mode)
                                  elif member.issym() or member.islnk():
                                      try:
                                          os.symlink(member.linkname, target)
                                      except FileExistsError:
                                          pass
                              except Exception:
                                  pass

          print("Extracting Pathways server & GRTE v5 runtime...")
          extract_image_layers("cloud-tpu-v2-images/pathways/server")
          print("Extracting Pathways proxy server...")
          extract_image_layers("cloud-tpu-v2-images/pathways/proxy_server")
          print("Extraction complete.")
          EOF
          python3 /tmp/extract_pathways.py
          chmod +x /usr/pathways/run/* 2>/dev/null || true

          echo "Starting Pathways Resource Manager..."
          TPU_SKIP_MDS_QUERY=true /usr/pathways/run/cloud_pathways_server_sanitized \
            --server_port=29001 \
            --node_type=resource_manager \
            --enforce_kernel_ipv6_support=false \
            --instance_count=1 \
            --instance_type=tpuv6e:2x2 \
            --gcs_scratch_location="gs://cloud-pathways-staging/maxtext-ci/${RUN_ID}_${RUN_ATTEMPT}_${WORKER_GROUP}" > /tmp/pathways_rm.log 2>&1 &

          echo "Starting Pathways Worker..."
          /usr/pathways/run/cloud_pathways_server_sanitized \
            --server_port=29005 \
            --resource_manager_address=127.0.0.1:29001 \
            --enforce_kernel_ipv6_support=false \
            --gcs_scratch_location="gs://cloud-pathways-staging/maxtext-ci/${RUN_ID}_${RUN_ATTEMPT}_${WORKER_GROUP}" > /tmp/pathways_worker.log 2>&1 &

          echo "Starting Pathways Proxy..."
          XLA_FLAGS="--xla_dump_to=/tmp/aot_test_dump --xla_dump_hlo_as_text --xla_dump_hlo_module_re=jit_train_step" \
          /usr/pathways/run/cloud_proxy_server_sanitized \
            --server_port=29000 \
            --resource_manager_address=127.0.0.1:29001 \
            --gcs_scratch_location="gs://cloud-pathways-staging/maxtext-ci/${RUN_ID}_${RUN_ATTEMPT}_${WORKER_GROUP}" \
            --xla_tpu_scoped_vmem_limit_kib=65536 \
            --xla_tpu_spmd_rng_bit_generator_unsafe=true > /tmp/pathways_proxy.log 2>&1 &
      - name: Wait for Pathways Proxy Readiness
        shell: bash
        run: |
          echo "Waiting for Pathways Proxy at 127.0.0.1:29000..."
          for _ in {1..30}; do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 29000), timeout=1)" 2>/dev/null; then
              echo "Pathways Proxy port is open and listening!"
              sleep 2  # Allow gRPC server to complete internal handshakes
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Pathways Proxy failed to start within 60s"
          echo "=== RM LOG ===" && cat /tmp/pathways_rm.log || true
          echo "=== WORKER LOG ===" && cat /tmp/pathways_worker.log || true
          echo "=== PROXY LOG ===" && cat /tmp/pathways_proxy.log || true
          exit 1
      - name: Run Tests
        shell: bash
        env:
          TOTAL_WORKERS: ${{ inputs.total_workers }}
          WORKER_GROUP: ${{ inputs.worker_group }}
          IS_SCHEDULED_RUN: ${{ inputs.is_scheduled_run }}
          PYTEST_MARKER: ${{ inputs.pytest_marker }}
          PYTEST_ADDOPTS: ${{ inputs.pytest_addopts }}
          PYTHONPATH: "${{ github.workspace }}/src"
        run: |
          # Cleanly release TPU device locks upon SIGTERM / PR cancellation
          cleanup_tpu_locks() {
            echo "Received cancellation signal; cleaning up /dev/accel* locks and /tmp/libtpu_lockfile..."
            kill -9 "${PYTEST_PID:-}" 2>/dev/null || true
            pkill -9 -f cloud_pathways_server_sanitized 2>/dev/null || true
            pkill -9 -f cloud_proxy_server_sanitized 2>/dev/null || true
            rm -f /tmp/libtpu_lockfile
            fuser -k -9 /dev/accel* 2>/dev/null || true
            sleep 0.5
            exit 143
          }
          trap cleanup_tpu_locks TERM INT

          if [ "${TOTAL_WORKERS}" -gt 1 ]; then
            .venv/bin/python3 -m pip install --quiet pytest-split
            SPLIT_ARGS="--splits ${TOTAL_WORKERS} --group ${WORKER_GROUP}"
          else
            SPLIT_ARGS=""
          fi
          if [ "${IS_SCHEDULED_RUN}" = "true" ]; then
            FINAL_PYTEST_MARKER="${PYTEST_MARKER}"
          else
            if [ -z "${PYTEST_MARKER}" ]; then
              FINAL_PYTEST_MARKER="not scheduled_only or newly_added"
            else
              FINAL_PYTEST_MARKER="${PYTEST_MARKER} and (not scheduled_only or newly_added)"
            fi
          fi
          MAXTEXT_REPO_ROOT=$(pwd)
          MAXTEXT_ASSETS_ROOT="$(pwd)/src/maxtext/assets"
          MAXTEXT_TEST_ASSETS_ROOT="$(pwd)/tests/assets"
          MAXTEXT_PKG_DIR="$(pwd)/src/maxtext"
          export MAXTEXT_REPO_ROOT MAXTEXT_ASSETS_ROOT MAXTEXT_TEST_ASSETS_ROOT MAXTEXT_PKG_DIR
          # TODO(b/454659463): Enable test_default_hlo_match after volume mount is supported.
          # shellcheck disable=SC2086
          .venv/bin/python3 -m pytest ${PYTEST_ADDOPTS} -v -m "${FINAL_PYTEST_MARKER}" -k "not AotHloIdenticalTest and not CompileThenLoad" --durations=0 ${SPLIT_ARGS} &
          PYTEST_PID=$!
          wait "$PYTEST_PID"
      - name: Collect Pathways daemon logs
        if: failure()
        shell: bash
        run: |
          # The Pathways daemons log via glog to files under /tmp, not to stdout, so a
          # crash currently surfaces only as a terminated IFRT proxy connection with no
          # cause, and the container is torn down before anyone can look.
          shopt -s nullglob
          mkdir -p /tmp/pathways-logs

          # INFO is skipped: hundreds of MB, and adds nothing the rest does not have.
          # -L stages the real file rather than the severity symlink.
          logs=(/tmp/*sanitized*.log.{FATAL,ERROR,WARNING}.* /tmp/pathways_*.log)
          if [ "${#logs[@]}" -gt 0 ]; then
            cp -Lp "${logs[@]}" /tmp/pathways-logs/
            # This repository is public: drop the build path and host from the header.
            sed -i \
              -e 's#/google/src/cloud/[^ ]*#[redacted-build-path]#g' \
              -e 's#[A-Za-z0-9_.-]*@[A-Za-z0-9_.-]*\.prod\.google\.com#[redacted-build-host]#g' \
              /tmp/pathways-logs/*
          fi

          ls -l /tmp/pathways-logs/
      - name: Dump Pathways daemon logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob

          stderr_logs=(
            /tmp/pathways-logs/pathways_rm.log
            /tmp/pathways-logs/pathways_worker.log
            /tmp/pathways-logs/pathways_proxy.log
          )

          echo "::group::Pathways runtime build and daemon pids"
          grep -m1 -h "Build label:" "${stderr_logs[@]}" 2>/dev/null \
            || echo "(build label not found)"
          # glog file names end in the pid, so this maps each log below to a daemon.
          for f in "${stderr_logs[@]}"; do
            [ -e "$f" ] || continue
            pid=$(sed -n 's/.*Process id \([0-9]*\).*/\1/p' "$f" | head -1 || true)
            echo "$(basename "$f" .log) -> pid ${pid:-unknown}"
          done
          echo "::endgroup::"

          # Ignore the <binary>.FATAL symlink: the resource manager and the worker are
          # the same binary, so the worker's later crash overwrites it and hides the
          # original failure.
          fatal_files=(/tmp/pathways-logs/*.log.FATAL.*)
          if [ "${#fatal_files[@]}" -eq 0 ]; then
            echo "No Pathways FATAL log found. If a daemon died anyway it was killed by a"
            echo "signal (e.g. OOM) rather than failing a CHECK."
          else
            # Sort on the YYYYMMDD-HHMMSS.<pid> glog embeds in the name: the whole name
            # would group by binary, and the sed above has reset every mtime.
            mapfile -t fatals < <(
              for f in "${fatal_files[@]}"; do
                printf '%s\t%s\n' "${f##*.log.FATAL.}" "$f"
              done | sort | cut -f2-
            )
            echo "Found ${#fatals[@]} FATAL log(s), oldest first. The FIRST one is the root"
            echo "cause; the later ones are the other daemons losing their peer."
            for f in "${fatals[@]}"; do
              echo "::group::FATAL $(basename "$f")"
              cat "$f"
              echo "::endgroup::"
            done
          fi

          for f in /tmp/pathways-logs/*.log.ERROR.* "${stderr_logs[@]}"; do
            [ -e "$f" ] || continue
            echo "::group::tail $(basename "$f")"
            tail -n 200 "$f"
            echo "::endgroup::"
          done
      - name: Upload Pathways daemon logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pathways-logs-${{ inputs.device_name }}-${{ !contains(inputs.pytest_marker, 'not integration_test') && 'integration' || 'unit' }}-${{ inputs.worker_group }}
          path: /tmp/pathways-logs
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
