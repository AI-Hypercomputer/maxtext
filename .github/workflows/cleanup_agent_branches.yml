name: Cleanup Inactive Agent Branches

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write # Required to delete branches

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history to check commit timestamps
          
      - name: Delete inactive fix-val branches
        run: |
          echo "Scanning for agent branches (fix-val-*) older than 14 days..."
          
          NOW=$(date +%s)
          # 14 days = 14 * 24 * 60 * 60 = 1209600 seconds
          FOURTEEN_DAYS=1209600
          
          # Safely iterate over all branches matching the prefix
          git for-each-ref --format='%(refname:short) %(committerdate:unix)' refs/remotes/origin/fix-val-* | while read -r branch_ref last_commit_time; do
            # Skip if empty
            if [ -z "$branch_ref" ]; then continue; fi
            
            # Strip 'origin/' to get the local branch name
            branch_name=${branch_ref#origin/}
            
            # Calculate difference in seconds
            age=$((NOW - last_commit_time))
            
            if [ "$age" -gt "$FOURTEEN_DAYS" ]; then
              echo "Branch '$branch_name' has been inactive for more than 14 days. Deleting..."
              git push origin --delete "$branch_name"
            else
              days_old=$((age / 86400))
              echo "Branch '$branch_name' is active ($days_old days old). Keeping."
            fi
          done
