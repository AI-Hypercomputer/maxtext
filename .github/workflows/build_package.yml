# This workflow builds and uploads MaxText package
# based on the pyproject.toml at the current github workspace.

name: Build and Upload MaxText Package

on:
  workflow_call:
    inputs:
      device_type:
        required: true
        type: string
      device_name:
        required: true
        type: string
      cloud_runner:
        required: false
        type: string
      maxtext_sha:
        required: false
        type: string
    outputs:
      maxtext_sha:
        description: "MaxText short SHA used for the build"
        value: ${{ jobs.build_and_upload.outputs.maxtext_sha }}

permissions:
  contents: read
jobs:
  build_and_upload:
    name: Build Wheel
    runs-on: ${{ inputs.cloud_runner != '' && inputs.cloud_runner || fromJson(format('["self-hosted", "{0}", "{1}"]', inputs.device_type, inputs.device_name)) }}
    timeout-minutes: 15
    container: python:3.12-slim-trixie
    outputs:
      maxtext_sha: ${{ steps.vars.outputs.maxtext_sha }}
    steps:
      - name: Checkout MaxText
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.maxtext_sha || github.sha }}
          persist-credentials: false
      - name: Get metadata
        id: vars
        shell: bash
        env:
          MAXTEXT_SHA_INPUT: ${{ inputs.maxtext_sha || github.sha }}
        run: |
          # MaxText SHA used to build the package
          MAXTEXT_SHA="$MAXTEXT_SHA_INPUT"
          echo "maxtext_sha=${MAXTEXT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: |
          apt-get update -y && apt-get install -y --no-install-recommends curl ca-certificates
          python -m pip install --upgrade pip build uv
      - name: Set up Syft
        id: download_syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Build maxtext wheel
        run: |
          uv build --wheel
      - name: Generate SPDX SBOM for MaxText wheel
        shell: bash
        env:
          SYFT_CMD: ${{ steps.download_syft.outputs.cmd }}
        run: |
          mkdir -p sbom
          WHEEL_FILE=$(ls dist/maxtext-*.whl)
          "${SYFT_CMD}" "${WHEEL_FILE}" -o spdx-json=sbom/maxtext-wheel.spdx.json
      - name: Upload the built maxtext wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maxtext-wheel
          path: dist/*
      - name: Upload the maxtext wheel SPDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maxtext-wheel-sbom
          path: sbom/maxtext-wheel.spdx.json
