name: MaxText Release Pipeline v2

# Triggers when a new "release" is published in the GitHub UI or when manually triggered via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MaxText Release tag to build and test (e.g., maxtext-v0.2.6).'
        required: true
        type: string
      publish:
        description: 'Set to true to publish to PyPI.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  get_maxtext_sha:
    name: Resolve MaxText SHA
    runs-on: ubuntu-latest
    outputs:
      maxtext_sha: ${{ steps.vars.outputs.maxtext_sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout MaxText
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve SHA
        id: vars
        shell: bash
        run: |
          MAXTEXT_SHA=$(git rev-parse HEAD)
          echo "Using MaxText SHA: ${MAXTEXT_SHA}"
          echo "maxtext_sha=${MAXTEXT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${MAXTEXT_SHA:0:7}" >> "$GITHUB_OUTPUT"

  release_approval:
    name: Approve Release Candidate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # "release" environment is configured in MaxText repository settings.
    # This environment requires manual approval before proceeding to the next job.
    environment: release
    steps:
      - name: Acknowledge Approval
        run: echo "Release candidate approved, proceeding to build and test MaxText package."

  build_maxtext_package:
    name: Build MaxText Package
    needs: [release_approval, get_maxtext_sha]
    if: |
      always() &&
      needs.get_maxtext_sha.result == 'success' &&
      (needs.release_approval.result == 'success' || needs.release_approval.result == 'skipped')
    uses: ./.github/workflows/build_package.yml
    with:
      device_type: tpu
      device_name: v4-8
      cloud_runner: linux-x86-n2-16-buildkit
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}

  tag_verification_gate:
    name: Verify Release Candidate Docker Images
    needs: get_maxtext_sha
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'TPU Pre-Training'
            image_name: tpu_pre_training
          - name: 'TPU Post-Training'
            image_name: tpu_post_training
    steps:
      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Verify Release Candidate Images
        shell: bash
        env:
          TARGET_REF: ${{ inputs.release_tag }}
          MAXTEXT_SHA: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          REPOSITORY_NAME: 'maxtext-images-staging'
        run: |
          SOURCE_IMAGE=us-docker.pkg.dev/${PROJECT_NAME}/${REPOSITORY_NAME}/${DOCKER_IMAGE_NAME}
          # Verify that the image with the tested SHA exists
          if ! gcloud container images describe "${SOURCE_IMAGE}:${PARENT_SHA}" > /dev/null 2>&1; then
            echo "Error: Docker image ${SOURCE_IMAGE}:${PARENT_SHA} does not exist."
            exit 1
          fi

          # verify that the image with the current run ID has the correct release tag label
          IMAGE_TAG=$(gcloud container images describe "${SOURCE_IMAGE}:${PARENT_SHA}" --format='get(image_summary.digest)' --show-labels | grep "verified-e2e-${TARGET_REF}" | cut -d'=' -f2)
          if [ "$IMAGE_TAG" != "$TARGET_REF" ]; then
            echo "Error: Docker image ${SOURCE_IMAGE}:${PARENT_SHA} has label release_tag=${IMAGE_TAG}, expected ${TARGET_REF}."
            exit 1
          fi

          # verify that the image with the current run ID has the correct release tag label
          IMAGE_TAG=$(gcloud container images describe "${SOURCE_IMAGE}:${PARENT_SHA}" --format='get(image_summary.digest)' --show-labels | grep "verified-e2e-${TARGET_REF}" | cut -d'=' -f2)
          if [ "$IMAGE_TAG" != "$TARGET_REF" ]; then
            echo "Error: Docker image ${SOURCE_IMAGE}:${PARENT_SHA} has label release_tag=${IMAGE_TAG}, expected ${TARGET_REF}."
            exit 1
          fi

  publish_maxtext_to_pypi:
    name: Publish MaxText to PyPI
    needs: [release_approval, build_maxtext_package]
    runs-on: ubuntu-latest
    environment: release
    if: needs.build_maxtext_package.result == 'success' && inputs.publish
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maxtext-wheel
          path: dist/
      - name: Publish MaxText wheel to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  get_latest_maxtext_pypi_version:
    name: Get latest MaxText PyPI version
    needs: publish_maxtext_to_pypi
    runs-on: ubuntu-latest
    outputs:
      latest_pypi_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Fetch latest version of maxtext from PyPI
        id: get_version
        run: |
          pypi_json=$(curl -s https://pypi.org/pypi/maxtext/json)
          latest_version=$(echo "$pypi_json" | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          if [ -z "$latest_version" ] || [ "$latest_version" = "null" ]; then
            echo "Error: Could not parse latest version from PyPI JSON."
            exit 1
          fi
          echo "Latest MaxText version on PyPI: $latest_version"
          echo "version=$latest_version" >> "$GITHUB_OUTPUT"

  promote_docker_images:
    name: Promote ${{ matrix.name }} Docker Image
    needs: [get_latest_maxtext_pypi_version]
    runs-on: linux-x86-n2-16-buildkit
    container: google/cloud-sdk:524.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'TPU Pre-Training'
            image_name: tpu_pre_training
          - name: 'TPU Post-Training'
            image_name: tpu_post_training
    steps:
      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Add tags to Docker image
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          IMAGE_NAME: ${{ matrix.image_name }}
          REPOSITORY_NAME: 'maxtext-images'
          PYPI_VERSION: ${{ needs.get_latest_maxtext_pypi_version.outputs.latest_pypi_version }}
        run: |
          SOURCE_IMAGE="us-docker.pkg.dev/${PROJECT_NAME}/${REPOSITORY_NAME}/${IMAGE_NAME}"
          gcloud container images add-tag \
            "${SOURCE_IMAGE}:${PARENT_SHA}" \
            "${SOURCE_IMAGE}:${PYPI_VERSION}" \
            --quiet
