# This workflow checks if a PR description contains a checklist, and fails if not.

name: Require Checklist
on:
  pull_request:
    types: [opened, edited, synchronize]
jobs:
  check_pr_body:
    name: Require PR Checklist
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: mheap/require-checklist-action@9c8100a52aa9726d4648e61aa92415f6c843c990 # v2.6.1
        with:
          requireChecklist: true # If this is true and there are no checklists detected, the action will fail
