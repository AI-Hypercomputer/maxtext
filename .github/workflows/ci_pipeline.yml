# This workflow orchestrates the CI pipeline for MaxText,
# including building the package, running tests, and notifying about failures.

name: MaxText Package Tests

on:
  # Labels change which CI runs on a PR:
  # - `skip-ci-tests` (added to new PRs, except the ones Copybara exports or that are opened with
  #   `scheduled-only`) skips the heavy TPU/GPU suites. Removing it runs them. auto_label_pr.yml removes
  #   it when the PR gets the "pull ready" label (after 2 approvals), unless the full CI already passed;
  #   Copybara imports the PR only after CI passes.
  # - `scheduled-only` re-runs the pipeline as a scheduled run, with every suite, even with
  #   `skip-ci-tests`.
  # - `run-tpu7x` runs the full TPU7X suite instead of only the TPU7X tests that the PR touched. Like the
  #   other heavy suites, it waits until `skip-ci-tests` is removed.
  # Drafts never run the heavy suites; `ready_for_review` re-runs the pipeline when a draft PR is
  # marked ready for review. `labeled` and `unlabeled` fire for every label, so the entry jobs are
  # gated on the label name: a run for any other label runs no tests, and All Required Tests Passed
  # repeats the result of the newest full run on the same commit.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_call:
    inputs:
      maxtext_sha:
        description: 'The specific MaxText commit SHA.'
        required: true
        type: string
    secrets:
      HF_TOKEN:
        required: false
      GEMINI_API_KEY:
        required: false
  workflow_dispatch:
  schedule:
    # Run the job every 4 hours
    - cron:  '0 */4 * * *'

concurrency:
  # Dedup pull requests (canceling previous runs of the same workflow for same PR) and queue overlapping scheduled runs.
  # A run triggered by adding or removing an unrelated label (any label other than `scheduled-only`, `run-tpu7x`
  # and `skip-ci-tests`, the labels that the entry jobs accept) gets its own group, so it never cancels a test
  # run in progress.
  group: >
    ${{
      github.event_name == 'pull_request' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'scheduled-only' || github.event.label.name == 'run-tpu7x' ||
          github.event.label.name == 'skip-ci-tests') &&
        format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) ||
      github.event_name == 'schedule' && format('{0}-schedule', github.workflow) ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
jobs:
  analyze_code_changes:
    name: Analyze Code Changes for Test Orchestration
    # `labeled` and `unlabeled` fire for every label, so ignore label events other than the ones
    # that opt the PR into a scheduled run or the full TPU7X suite, or skip CI tests. Pushes and scheduled runs are
    # unaffected. all_tests_passed and all_notebooks_passed treat a run where this job was skipped as a run for an
    # unrelated label.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'scheduled-only' ||
      github.event.label.name == 'run-tpu7x' ||
      github.event.label.name == 'skip-ci-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed to list the PR's changed files via the GitHub REST API.
      pull-requests: read
    outputs:
      tpu_pre_train_deps_tag: ${{ steps.check.outputs.tpu_pre_train_deps_tag }}
      tpu_post_train_deps_tag: ${{ steps.check.outputs.tpu_post_train_deps_tag }}
      gpu_pre_train_deps_tag: ${{ steps.check.outputs.gpu_pre_train_deps_tag }}
      run_tests: ${{ steps.check.outputs.run_tests }}
      run_notebooks: ${{ steps.check.outputs.run_notebooks }}
      run_pretrain_tests: ${{ steps.check.outputs.run_pretrain_tests }}
      run_posttrain_tests: ${{ steps.check.outputs.run_posttrain_tests }}
      run_pathways_tests: ${{ steps.check.outputs.run_pathways_tests }}
      run_gpu_tests: ${{ steps.check.outputs.run_gpu_tests }}
      # From the heavy-test gate in analyze_code_changes.sh; non-PR events always run the heavy suites. If the
      # script fails, these stay empty, so the heavy suites stay skipped and All Required Tests Passed fails.
      run_heavy_tests: ${{ steps.check.outputs.run_heavy_tests }}
      heavy_tests_gated: ${{ steps.check.outputs.heavy_tests_gated }}
      heavy_tests_gate_message: ${{ steps.check.outputs.heavy_tests_gate_message }}
      # Select tpu7x-tests on pull requests without scheduled-only; tpu7x_flavors is unset when every flavor runs.
      run_tpu7x_tests: ${{ steps.check.outputs.run_tpu7x_tests }}
      tpu7x_flavors: ${{ steps.check.outputs.tpu7x_flavors }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.maxtext_sha || github.sha }}
          persist-credentials: false
      - name: Check for Code Changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A `scheduled-only` PR mirrors a scheduled run, so run every suite
          # regardless of which files the PR touched.
          FORCE_ALL_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
          # A `run-tpu7x` PR runs every TPU7X flavor, not only the TPU7X tests it touched.
          RUN_TPU7X: ${{ contains(github.event.pull_request.labels.*.name, 'run-tpu7x') }}
          # Inputs of the heavy-test gate in analyze_code_changes.sh.
          EVENT_ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_SKIP_CI_TESTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ci-tests') }}
          # add_skip_ci_tests_label.yml skips the PRs that Copybara exports; keep the author in sync.
          IS_COPYBARA_PR: ${{ github.event.pull_request.user.login == 'copybara-service[bot]' }}
        run: |
          bash .github/scripts/analyze_code_changes.sh

  code_quality_check:
    # The all_tests_passed job below matches this check name to tell full runs from runs triggered by
    # unrelated labels, so this job must keep skipping those runs (the `if:` below).
    name: Code Quality Check
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'scheduled-only' ||
      github.event.label.name == 'run-tpu7x' ||
      github.event.label.name == 'skip-ci-tests'
    uses: ./.github/workflows/code_quality.yml
    with:
      maxtext_sha: ${{ inputs.maxtext_sha || github.sha }}

  docs_build_check:
    name: Documentation Build Check
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'scheduled-only' ||
      github.event.label.name == 'run-tpu7x' ||
      github.event.label.name == 'skip-ci-tests'
    uses: ./.github/workflows/check_docs_build.yml
    with:
      maxtext_sha: ${{ inputs.maxtext_sha || github.sha }}

  dev_tests:
    name: Development Tests
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'scheduled-only' ||
      github.event.label.name == 'run-tpu7x' ||
      github.event.label.name == 'skip-ci-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.maxtext_sha || github.sha }}
          persist-credentials: false
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Run development tests
        run: |
          uv venv --python 3.12 .venv
          # absl-py: tests/dev/newly_added_detection_test.py checks how absl parameterized tests are matched.
          uv pip install --python .venv/bin/python pytest absl-py
          PYTHONPATH=. .venv/bin/python -m pytest -v --noconftest -o addopts="--import-mode=importlib --strict-markers" tests/dev

  resolve_deps_images:
    name: Resolve Dependency Images
    needs: [analyze_code_changes]
    if: |
      !cancelled() &&
      needs.analyze_code_changes.result == 'success' &&
      needs.analyze_code_changes.outputs.run_tests == 'true'
    runs-on: linux-x86-n4-16-buildkit
    container: us-docker.pkg.dev/artifact-foundry-prod/docker-3p-trusted/google/cloud-sdk:528.0.0
    timeout-minutes: 15
    outputs:
      tpu_pre_train_image: ${{ steps.resolve.outputs.tpu_pre_train_image }}
      tpu_pre_train_tag: ${{ steps.resolve.outputs.tpu_pre_train_tag }}
      tpu_pre_train_missing: ${{ steps.resolve.outputs.tpu_pre_train_missing }}
      tpu_pre_train_base: ${{ steps.resolve.outputs.tpu_pre_train_base }}
      tpu_post_train_image: ${{ steps.resolve.outputs.tpu_post_train_image }}
      tpu_post_train_tag: ${{ steps.resolve.outputs.tpu_post_train_tag }}
      tpu_post_train_missing: ${{ steps.resolve.outputs.tpu_post_train_missing }}
      tpu_post_train_base: ${{ steps.resolve.outputs.tpu_post_train_base }}
      gpu_pre_train_image: ${{ steps.resolve.outputs.gpu_pre_train_image }}
      gpu_pre_train_tag: ${{ steps.resolve.outputs.gpu_pre_train_tag }}
      gpu_pre_train_missing: ${{ steps.resolve.outputs.gpu_pre_train_missing }}
      gpu_pre_train_base: ${{ steps.resolve.outputs.gpu_pre_train_base }}
      # The fork and bot guard, in one place rather than on each build job.
      can_build: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Look up each dependency image
        id: resolve
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'tpu-prod-env-multipod' }}
          TPU_PRE_TRAIN_TAG: ${{ needs.analyze_code_changes.outputs.tpu_pre_train_deps_tag }}
          TPU_POST_TRAIN_TAG: ${{ needs.analyze_code_changes.outputs.tpu_post_train_deps_tag }}
          GPU_PRE_TRAIN_TAG: ${{ needs.analyze_code_changes.outputs.gpu_pre_train_deps_tag }}
        run: |
          repo="us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images"

          resolve() {
            local key="$1" image="$2" reqs_tag="$3" base="$4" digest err missing
            if [ -z "${reqs_tag}" ]; then
              echo "::warning::analyze_code_changes named no ${image}; tests will install dependencies in full."
              return 0
            fi
            if [[ ! "${reqs_tag}" =~ ^deps-[0-9a-f]{16}$ ]]; then
              echo "::error::analyze_code_changes produced a malformed tag for ${image}: ${reqs_tag}"
              exit 1
            fi
            if ! digest=$(gcloud container images describe "${repo}/${base}" --format='value(image_summary.digest)' 2>/dev/null) ||
              [ -z "${digest}" ]; then
              echo "::error::Could not read the digest of ${repo}/${base}; the base image is missing."
              exit 1
            fi
            digest="${digest#sha256:}"
            local tag="${reqs_tag}-b${digest:0:12}"
            if err=$(gcloud container images describe "${repo}/${image}:${tag}" 2>&1 >/dev/null); then
              missing=false
              echo "${image}:${tag} is present."
            elif grep -qiE 'not found|NOT_FOUND|does not exist' <<< "${err}"; then
              missing=true
              echo "${image}:${tag} is missing and will be built."
            else
              echo "::error::Could not determine whether ${image}:${tag} exists: ${err}"
              exit 1
            fi

            {
              echo "${key}_image=${image}:${tag}"
              echo "${key}_tag=${tag}"
              echo "${key}_missing=${missing}"
              echo "${key}_base=${base%%:*}@sha256:${digest}"
            } >> "$GITHUB_OUTPUT"
          }
          resolve tpu_pre_train maxtext-deps-tpu-pre-train "${TPU_PRE_TRAIN_TAG}" maxtext-unit-test-tpu:py312-bookworm
          resolve tpu_post_train maxtext-deps-tpu-post-train "${TPU_POST_TRAIN_TAG}" maxtext-unit-test-tpu:py312-bookworm
          resolve gpu_pre_train maxtext-deps-gpu-pre-train "${GPU_PRE_TRAIN_TAG}" maxtext-unit-test-cuda12:py312

  build_deps_tpu_pre_train:
    name: Build TPU Pre-Training Dependency Image
    needs: [analyze_code_changes, resolve_deps_images]
    if: |
      !cancelled() &&
      needs.resolve_deps_images.outputs.tpu_pre_train_missing == 'true' &&
      needs.resolve_deps_images.outputs.can_build == 'true' &&
      (needs.analyze_code_changes.outputs.run_pretrain_tests == 'true' ||
      (needs.analyze_code_changes.outputs.run_heavy_tests == 'true' &&
        (github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'scheduled-only') ||
          needs.analyze_code_changes.outputs.run_tpu7x_tests == 'true')))
    uses: ./.github/workflows/build_deps_image.yml
    with:
      base_image: ${{ needs.resolve_deps_images.outputs.tpu_pre_train_base }}
      deps_image: maxtext-deps-tpu-pre-train
      maxtext_extra: tpu
      deps_tag: ${{ needs.resolve_deps_images.outputs.tpu_pre_train_tag }}
      maxtext_sha: ${{ inputs.maxtext_sha || github.sha }}

  build_deps_tpu_post_train:
    name: Build TPU Post-Training Dependency Image
    needs: [analyze_code_changes, resolve_deps_images]
    if: |
      !cancelled() &&
      needs.resolve_deps_images.outputs.tpu_post_train_missing == 'true' &&
      needs.resolve_deps_images.outputs.can_build == 'true' &&
      (needs.analyze_code_changes.outputs.run_posttrain_tests == 'true' ||
      (needs.analyze_code_changes.outputs.run_heavy_tests == 'true' &&
        (github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'scheduled-only') ||
          needs.analyze_code_changes.outputs.run_tpu7x_tests == 'true')))
    uses: ./.github/workflows/build_deps_image.yml
    with:
      base_image: ${{ needs.resolve_deps_images.outputs.tpu_post_train_base }}
      deps_image: maxtext-deps-tpu-post-train
      maxtext_extra: tpu-post-train
      deps_tag: ${{ needs.resolve_deps_images.outputs.tpu_post_train_tag }}
      maxtext_sha: ${{ inputs.maxtext_sha || github.sha }}

  build_deps_gpu_pre_train:
    name: Build GPU Pre-Training Dependency Image
    needs: [analyze_code_changes, resolve_deps_images]
    if: |
      !cancelled() &&
      needs.resolve_deps_images.outputs.gpu_pre_train_missing == 'true' &&
      needs.resolve_deps_images.outputs.can_build == 'true' &&
      needs.analyze_code_changes.outputs.run_gpu_tests == 'true' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true'
    uses: ./.github/workflows/build_deps_image.yml
    with:
      base_image: ${{ needs.resolve_deps_images.outputs.gpu_pre_train_base }}
      deps_image: maxtext-deps-gpu-pre-train
      maxtext_extra: cuda12
      deps_tag: ${{ needs.resolve_deps_images.outputs.gpu_pre_train_tag }}
      maxtext_sha: ${{ inputs.maxtext_sha || github.sha }}

  build_and_upload_maxtext_package:
    name: Build MaxText Package
    needs: [analyze_code_changes, code_quality_check, docs_build_check, dev_tests]
    # Run if either tests or notebooks need to run; on PRs, gate on code quality, docs, and dev tests passing
    if: |
      !cancelled() &&
      (needs.analyze_code_changes.outputs.run_tests == 'true' || needs.analyze_code_changes.outputs.run_notebooks == 'true') &&
      (github.event_name != 'pull_request' || (
        needs.code_quality_check.result == 'success' &&
        needs.docs_build_check.result == 'success' &&
        needs.dev_tests.result == 'success'
      ))
    uses: ./.github/workflows/build_package.yml
    with:
      maxtext_sha: ${{ inputs.maxtext_sha || github.sha }}

  maxtext_jupyter_notebooks:
    name: Jupyter Notebook Tests
    needs: [analyze_code_changes, build_and_upload_maxtext_package]
    if: |
      !cancelled() &&
      needs.analyze_code_changes.outputs.run_notebooks == 'true' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true' &&
      needs.build_and_upload_maxtext_package.result == 'success' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'))
    uses: ./.github/workflows/run_jupyter_notebooks.yml
    strategy:
        fail-fast: false
    with:
      device_type: tpu
      device_name: v6e-8
      base_image: maxtext-unit-test-tpu:py312-bookworm
      cloud_runner: linux-x86-ct6e-180-8tpu
      maxtext_sha: ${{ needs.build_and_upload_maxtext_package.outputs.maxtext_sha }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  gate_test_run:
    name: Gate and Formalize Parameters
    needs: [analyze_code_changes, build_and_upload_maxtext_package]
    if: |
      !cancelled() &&
      needs.analyze_code_changes.outputs.run_tests == 'true' &&
      needs.build_and_upload_maxtext_package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      total_workers: ${{ steps.set-params.outputs.total_workers }}
      worker_groups: ${{ steps.set-params.outputs.worker_groups }}
      maxtext_sha: ${{ needs.build_and_upload_maxtext_package.outputs.maxtext_sha }}
    steps:
      - id: set-params
        name: Formalize Test Suite Parameters
        run: |
          TPU_UNIT_TOTAL_WORKERS=2
          TPU_UNIT_WORKER_GROUPS='[1, 2]'
          echo "total_workers=${TPU_UNIT_TOTAL_WORKERS}" >> "$GITHUB_OUTPUT"
          echo "worker_groups=${TPU_UNIT_WORKER_GROUPS}" >> "$GITHUB_OUTPUT"

  # The TPU/GPU jobs below (and maxtext_jupyter_notebooks above) also require `run_heavy_tests`
  # from the heavy-test gate in analyze_code_changes.sh. If you add a heavy TPU/GPU job or change the
  # flags a heavy job depends on, update the gate's "only a change that needs the heavy suites" rule too.
  tpu-pretrain-tests:
    name: TPU Pretrain Tests
    needs: [gate_test_run, analyze_code_changes, resolve_deps_images, build_deps_tpu_pre_train]
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_pretrain_tests == 'true' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true'
    uses: ./.github/workflows/run_tests_coordinator.yml
    strategy:
      fail-fast: false
      matrix:
        flavor: [tpu-unit, tpu-integration]
    with:
      flavor: ${{ matrix.flavor }}
      base_image: >-
        ${{ (needs.resolve_deps_images.outputs.tpu_pre_train_missing == 'false'
             || needs.build_deps_tpu_pre_train.result == 'success')
            && needs.resolve_deps_images.outputs.tpu_pre_train_image
            || 'maxtext-unit-test-tpu:py312-bookworm' }}
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}

  tpu-posttrain-tests:
    name: TPU Posttrain Tests
    needs: [gate_test_run, analyze_code_changes, resolve_deps_images, build_deps_tpu_post_train]
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_posttrain_tests == 'true' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true'
    uses: ./.github/workflows/run_tests_coordinator.yml
    strategy:
      fail-fast: false
      matrix:
        flavor: [tpu-post-training-unit, tpu-post-training-integration]
    with:
      flavor: ${{ matrix.flavor }}
      base_image: >-
        ${{ (needs.resolve_deps_images.outputs.tpu_post_train_missing == 'false'
             || needs.build_deps_tpu_post_train.result == 'success')
            && needs.resolve_deps_images.outputs.tpu_post_train_image
            || 'maxtext-unit-test-tpu:py312-bookworm' }}
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}


  tpu7x-tests:
    name: TPU7X Tests
    needs: [gate_test_run, analyze_code_changes, resolve_deps_images, build_deps_tpu_pre_train, build_deps_tpu_post_train]
    # TPU7X runners are scarce. A pull request without the scheduled-only or run-tpu7x label runs only the flavors
    # that run a test it touched (tpu7x_flavors), each on one worker and with only those tests (newly_added_only),
    # and skips this job when there are none. Every other run gets all three flavors.
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true' &&
      (github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'scheduled-only') ||
        needs.analyze_code_changes.outputs.run_tpu7x_tests == 'true')
    uses: ./.github/workflows/run_tests_coordinator.yml
    strategy:
      fail-fast: false
      matrix:
        # Keep the default list equal to TPU7X_FLAVORS in tests/utils/newly_added_detection.py.
        flavor: ${{ fromJSON(needs.analyze_code_changes.outputs.tpu7x_flavors || '["tpu7x-unit", "tpu7x-integration", "tpu7x-post-training-unit"]') }}
    with:
      flavor: ${{ matrix.flavor }}
      base_image: >-
        ${{ contains(matrix.flavor, 'post-training')
            && ((needs.resolve_deps_images.outputs.tpu_post_train_missing == 'false'
                 || needs.build_deps_tpu_post_train.result == 'success')
                && needs.resolve_deps_images.outputs.tpu_post_train_image
                || 'maxtext-unit-test-tpu:py312-bookworm')
            || ((needs.resolve_deps_images.outputs.tpu_pre_train_missing == 'false'
                 || needs.build_deps_tpu_pre_train.result == 'success')
                && needs.resolve_deps_images.outputs.tpu_pre_train_image
                || 'maxtext-unit-test-tpu:py312-bookworm') }}
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      newly_added_only: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-tpu7x') && !contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}

  gpu-tests:
    name: GPU Tests
    needs: [gate_test_run, analyze_code_changes, resolve_deps_images, build_deps_gpu_pre_train]
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_gpu_tests == 'true' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        flavor: [gpu-unit, gpu-integration]
    uses: ./.github/workflows/run_tests_coordinator.yml
    with:
      flavor: ${{ matrix.flavor }}
      base_image: >-
        ${{ (needs.resolve_deps_images.outputs.gpu_pre_train_missing == 'false'
             || needs.build_deps_gpu_pre_train.result == 'success')
            && needs.resolve_deps_images.outputs.gpu_pre_train_image
            || 'maxtext-unit-test-cuda12:py312' }}
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}

  cpu-pretrain-tests:
    name: CPU Pretrain Tests
    needs: [gate_test_run, analyze_code_changes, resolve_deps_images, build_deps_tpu_pre_train]
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_pretrain_tests == 'true'
    uses: ./.github/workflows/run_tests_coordinator.yml
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu-unit, cpu-integration]
    with:
      flavor: ${{ matrix.flavor }}
      base_image: >-
        ${{ (needs.resolve_deps_images.outputs.tpu_pre_train_missing == 'false'
             || needs.build_deps_tpu_pre_train.result == 'success')
            && needs.resolve_deps_images.outputs.tpu_pre_train_image
            || 'maxtext-unit-test-tpu:py312-bookworm' }}
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}

  cpu-posttrain-tests:
    name: CPU Posttrain Tests
    needs: [gate_test_run, analyze_code_changes, resolve_deps_images, build_deps_tpu_post_train]
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_posttrain_tests == 'true'
    uses: ./.github/workflows/run_tests_coordinator.yml
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu-post-training-unit, cpu-post-training-integration]
    with:
      flavor: ${{ matrix.flavor }}
      base_image: >-
        ${{ (needs.resolve_deps_images.outputs.tpu_post_train_missing == 'false'
             || needs.build_deps_tpu_post_train.result == 'success')
            && needs.resolve_deps_images.outputs.tpu_post_train_image
            || 'maxtext-unit-test-tpu:py312-bookworm' }}
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}

  maxtext_tpu_pathways_unit_tests:
    name: TPU Pathways Unit Tests
    needs: [gate_test_run, analyze_code_changes]
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_pathways_tests == 'true' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true'
    uses: ./.github/workflows/run_pathways_tests.yml
    strategy:
        fail-fast: false
        matrix:
          group: ${{ fromJSON(needs.gate_test_run.outputs.worker_groups || '[1, 2]') }}
    with:
      device_type: tpu
      device_name: v6e-4
      base_image: maxtext-unit-test-tpu:py312-bookworm
      cloud_runner: linux-x86-ct6e-180-4tpu
      pytest_marker: 'not cpu_only and not gpu_only and not integration_test and not post_training'
      pytest_addopts: '--ignore=tests/post_training'
      xla_python_client_mem_fraction: 0.75
      tf_force_gpu_allow_growth: false
      container_resource_option: "--init --privileged"
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}
      total_workers: ${{ needs.gate_test_run.outputs.total_workers || '2' }}
      worker_group: ${{ matrix.group }}

  maxtext_tpu_pathways_integration_tests:
    name: TPU Pathways Integration Tests
    needs: [gate_test_run, analyze_code_changes]
    if: |
      !cancelled() &&
      needs.gate_test_run.result == 'success' &&
      needs.analyze_code_changes.outputs.run_pathways_tests == 'true' &&
      needs.analyze_code_changes.outputs.run_heavy_tests == 'true'
    uses: ./.github/workflows/run_pathways_tests.yml
    strategy:
        fail-fast: false
        matrix:
          group: [1, 2]
    with:
      device_type: tpu
      device_name: v6e-4
      base_image: maxtext-unit-test-tpu:py312-bookworm
      cloud_runner: linux-x86-ct6e-180-4tpu
      pytest_marker: 'not cpu_only and not gpu_only and integration_test and not post_training'
      pytest_addopts: '--ignore=tests/post_training --ignore=tests/integration/hlo_diff_test.py'
      xla_python_client_mem_fraction: 0.75
      tf_force_gpu_allow_growth: false
      container_resource_option: "--init --privileged"
      is_scheduled_run: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scheduled-only') }}
      maxtext_sha: ${{ needs.gate_test_run.outputs.maxtext_sha }}
      total_workers: '2'
      worker_group: ${{ matrix.group }}

  all_tests_passed:
    # auto_label_pr.yml and Copybara match this check name; Copybara imports a "pull ready" PR once any run of it
    # passed on the PR's head commit. The check below matches the names of this job and of the Code Quality job in
    # this workflow's runs; keep them in sync.
    name: All Required Tests Passed
    needs: [analyze_code_changes, build_and_upload_maxtext_package, dev_tests, gate_test_run, tpu-pretrain-tests, tpu-posttrain-tests, tpu7x-tests, gpu-tests, cpu-pretrain-tests, cpu-posttrain-tests, maxtext_tpu_pathways_unit_tests, maxtext_tpu_pathways_integration_tests, code_quality_check, docs_build_check]
    if: always()  # must fail, not skip, on cancel: skipped required checks count as passing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # release_pipeline.yml, which calls this workflow, grants it too.
      actions: read  # reads the earlier runs of this workflow on the same commit (see below)
    steps:
      - name: Check test results
        run: |
          # Check that build and all tests passed or were skipped
          echo "Analyze Code Changes result: ${NEEDS_ANALYZE_CODE_CHANGES_RESULT}"
          echo "Build result: ${NEEDS_BUILD_AND_UPLOAD_MAXTEXT_PACKAGE_RESULT}"
          echo "Code Quality result: ${NEEDS_CODE_QUALITY_CHECK_RESULT}"
          echo "Docs Build result: ${NEEDS_DOCS_BUILD_CHECK_RESULT}"
          echo "Dev Tests result: ${NEEDS_DEV_TESTS_RESULT}"
          echo "Gate result: ${NEEDS_GATE_TEST_RUN_RESULT}"
          echo "TPU Pretrain Tests result: ${NEEDS_TPU_PRETRAIN_TESTS_RESULT}"
          echo "TPU Posttrain Tests result: ${NEEDS_TPU_POSTTRAIN_TESTS_RESULT}"
          echo "TPU7X Tests (Matrix) result: ${NEEDS_TPU7X_TESTS_RESULT}"
          echo "GPU Tests (Matrix) result: ${NEEDS_GPU_TESTS_RESULT}"
          echo "CPU Pretrain Tests result: ${NEEDS_CPU_PRETRAIN_TESTS_RESULT}"
          echo "CPU Posttrain Tests result: ${NEEDS_CPU_POSTTRAIN_TESTS_RESULT}"
          echo "Pathways Unit result: ${NEEDS_MAXTEXT_TPU_PATHWAYS_UNIT_TESTS_RESULT}"
          echo "Pathways Integration result: ${NEEDS_MAXTEXT_TPU_PATHWAYS_INTEGRATION_TESTS_RESULT}"

          # Fail only if any job failed or was cancelled (skipped is OK)
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

          # A run triggered by an unrelated label skips analyze_code_changes, Code Quality, Docs, the build and
          # every test, so its own results prove nothing. It passes only if the newest full run of this workflow
          # on the same commit (a run in which Code Quality ran) passed this check. Otherwise adding or removing a
          # label could turn this check green without any test, even right after a failed run.
          if [ "${NEEDS_ANALYZE_CODE_CHANGES_RESULT}" == "skipped" ]; then
            if [ -z "${HEAD_SHA}" ]; then
              echo "::error::analyze_code_changes was skipped in a run that is not for a pull request."
              exit 1
            fi
            # Sets `atp` to "<status> <conclusion>" of All Required Tests Passed in the newest full run, to
            # "missing" if that run has not created the job yet (its tests are still running), or to "none".
            find_newest_full_run() {
              local run_ids run_id jobs full_run_atp
              atp="none"
              run_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci_pipeline.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
                --paginate --jq '.workflow_runs[].id')
              while read -r run_id; do
                [ -n "${run_id}" ] || continue
                jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                  --paginate --jq '.jobs[] | [.name, .status, .conclusion // "none"] | @tsv')
                full_run_atp=$(awk -F'\t' '
                  $1 == "Code Quality Check / Pre-commit Linters" { full_run = 1 }
                  $1 == "All Required Tests Passed" { atp = $2 " " $3 }
                  END { if (full_run) print (atp == "" ? "missing" : atp) }' <<< "${jobs}")
                if [ -n "${full_run_atp}" ]; then
                  atp="${full_run_atp}"
                  return
                fi
              done < <(sort -rn <<< "${run_ids}")
            }
            find_newest_full_run
            # Wait a little if that run is just finishing its own All Required Tests Passed job.
            for _ in {1..10}; do
              case "${atp}" in
                "queued "* | "in_progress "* | "waiting "* | "pending "* | "requested "*) ;;
                *) break ;;
              esac
              sleep 30
              find_newest_full_run
            done
            case "${atp}" in
              "completed success")
                echo "This run was triggered by an unrelated label and ran no tests; the newest full run on this commit passed."
                exit 0
                ;;
              none) reason="there is no full run on this commit" ;;
              missing) reason="the newest full run on this commit is still running its tests" ;;
              *) reason="All Required Tests Passed of the newest full run on this commit is '${atp}'" ;;
            esac
            echo "::error::This run was triggered by an unrelated label and ran no tests, so it passes only after a passing full run, but ${reason}."
            exit 1
          fi

          # Fail if the heavy-test gate skipped TPU/GPU suites that this change needs (the PR is a draft or new,
          # or has the `skip-ci-tests` label), or if analyze_code_changes gave missing or invalid gate outputs, so
          # a broken gate cannot silently skip every heavy suite.
          if [[ "${HEAVY_TESTS_GATED}" != "false" ]] ||
            [[ "${RUN_HEAVY_TESTS}" != "true" && "${RUN_HEAVY_TESTS}" != "false" ]]; then
            : "${GATE_MESSAGE:=The heavy-test gate produced no decision; check analyze_code_changes.sh and the outputs of analyze_code_changes.}"
            echo "::error title=Heavy tests skipped::${GATE_MESSAGE}"
            echo "### ${GATE_MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All required tests passed successfully"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_HEAVY_TESTS: ${{ needs.analyze_code_changes.outputs.run_heavy_tests }}
          HEAVY_TESTS_GATED: ${{ needs.analyze_code_changes.outputs.heavy_tests_gated }}
          GATE_MESSAGE: ${{ needs.analyze_code_changes.outputs.heavy_tests_gate_message }}
          NEEDS_ANALYZE_CODE_CHANGES_RESULT: ${{ needs.analyze_code_changes.result }}
          NEEDS_BUILD_AND_UPLOAD_MAXTEXT_PACKAGE_RESULT: ${{ needs.build_and_upload_maxtext_package.result }}
          NEEDS_CODE_QUALITY_CHECK_RESULT: ${{ needs.code_quality_check.result }}
          NEEDS_DOCS_BUILD_CHECK_RESULT: ${{ needs.docs_build_check.result }}
          NEEDS_DEV_TESTS_RESULT: ${{ needs.dev_tests.result }}
          NEEDS_GATE_TEST_RUN_RESULT: ${{ needs.gate_test_run.result }}
          NEEDS_CPU_PRETRAIN_TESTS_RESULT: ${{ needs.cpu-pretrain-tests.result }}
          NEEDS_CPU_POSTTRAIN_TESTS_RESULT: ${{ needs.cpu-posttrain-tests.result }}
          NEEDS_TPU_PRETRAIN_TESTS_RESULT: ${{ needs.tpu-pretrain-tests.result }}
          NEEDS_TPU_POSTTRAIN_TESTS_RESULT: ${{ needs.tpu-posttrain-tests.result }}
          NEEDS_TPU7X_TESTS_RESULT: ${{ needs.tpu7x-tests.result }}
          NEEDS_GPU_TESTS_RESULT: ${{ needs.gpu-tests.result }}
          NEEDS_MAXTEXT_TPU_PATHWAYS_UNIT_TESTS_RESULT: ${{ needs.maxtext_tpu_pathways_unit_tests.result }}
          NEEDS_MAXTEXT_TPU_PATHWAYS_INTEGRATION_TESTS_RESULT: ${{ needs.maxtext_tpu_pathways_integration_tests.result }}

  all_notebooks_passed:
    name: All Notebooks Passed
    needs: [analyze_code_changes, build_and_upload_maxtext_package, maxtext_jupyter_notebooks]
    # Skipped in runs for unrelated labels (analyze_code_changes was skipped): they run no notebook, and Copybara
    # imports a "pull ready" PR once any run of this check passed. Otherwise it must fail, not skip, on cancel
    # (see all_tests_passed); if this check ever becomes required on GitHub, repeat the full run like that job does.
    if: always() && needs.analyze_code_changes.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check notebooks results
        run: |
          if [ "${NEEDS_ANALYZE_CODE_CHANGES_OUTPUTS_RUN_NOTEBOOKS}" == "false" ]; then
            echo "Non-notebook changes detected, runs were skipped"
            exit 0
          fi

          # Otherwise, check that build and notebooks run passed or were skipped
          echo "Build result: ${NEEDS_BUILD_AND_UPLOAD_MAXTEXT_PACKAGE_RESULT}"
          echo "Jupyter Notebooks result: ${NEEDS_MAXTEXT_JUPYTER_NOTEBOOKS_RESULT}"

          # Fail only if any job failed or was cancelled (skipped is OK)
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

          # The notebooks run on TPUs, so the heavy-test gate skips them on drafts and while the PR has the
          # `skip-ci-tests` label (see analyze_code_changes.sh). Skipped notebooks have not passed.
          if [ "${NEEDS_ANALYZE_CODE_CHANGES_OUTPUTS_RUN_HEAVY_TESTS}" != "true" ]; then
            echo "::error::Notebook tests were skipped because the heavy TPU/GPU tests are gated; see 'All Required Tests Passed'."
            exit 1
          fi

          echo "All required notebooks passed successfully"
        env:
          NEEDS_ANALYZE_CODE_CHANGES_OUTPUTS_RUN_NOTEBOOKS: ${{ needs.analyze_code_changes.outputs.run_notebooks }}
          NEEDS_ANALYZE_CODE_CHANGES_OUTPUTS_RUN_HEAVY_TESTS: ${{ needs.analyze_code_changes.outputs.run_heavy_tests }}
          NEEDS_BUILD_AND_UPLOAD_MAXTEXT_PACKAGE_RESULT: ${{ needs.build_and_upload_maxtext_package.result }}
          NEEDS_MAXTEXT_JUPYTER_NOTEBOOKS_RESULT: ${{ needs.maxtext_jupyter_notebooks.result }}

  notify_failure:
    name: Notify failed build # creates an issue or modifies last open existing issue for failed build
    needs: [all_tests_passed, all_notebooks_passed, resolve_deps_images,
            build_deps_tpu_pre_train, build_deps_tpu_post_train, build_deps_gpu_pre_train]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue-number }}
    steps:
      - name: Check whether one of the jobs failed
        id: create_issue
        uses: jayqi/failed-build-issue-action@1a893bbf43ef1c2a8705e2b115cd4f0fe3c5649b  # v1.2.0
        with:
          github-token: ${{ github.token }}

  investigate_failure:
    name: Investigate failed build # investigates failure of scheduled run and comments on tracking issue
    needs: [notify_failure]
    if: ${{ !cancelled() && (needs.notify_failure.result == 'success' || needs.notify_failure.result == 'failure') }}
    uses: ./.github/workflows/gemini_investigate.yml
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
      actions: 'read'
    with:
      failed_run_id: '${{ github.run_id }}'
      tracking_issue_number: '${{ needs.notify_failure.outputs.issue_number }}'
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  track_performance:
    name: Track Test Performance
    needs: [tpu-pretrain-tests, tpu-posttrain-tests, tpu7x-tests, gpu-tests, cpu-pretrain-tests, cpu-posttrain-tests]
    if: ${{ !cancelled() && (needs.cpu-pretrain-tests.result == 'success' || needs.cpu-posttrain-tests.result == 'success' || needs.gpu-tests.result == 'success' || needs.tpu-pretrain-tests.result == 'success' || needs.tpu-posttrain-tests.result == 'success' || needs.tpu7x-tests.result == 'success') }}
    uses: ./.github/workflows/track_performance.yml
    permissions:
      contents: write
      id-token: write
      pull-requests: write

