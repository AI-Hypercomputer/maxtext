# This workflow builds and pushes GPU MaxText images.
# It runs automatically daily at 12am UTC, or manually via Workflow Dispatch.

name: GPU Docker Images Pipeline

on:
  schedule:
    # Run the job daily at 12AM UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      repository_name:
        description: 'Name of the Docker repository to push images to.'
        required: true
        type: string
      mode:
        description: 'Build mode: build-all (default) or fast-rebuild (overlay new code on source image with identical deps)'
        required: true
        default: 'build-all'
        type: choice
        options:
          - build-all
          - fast-rebuild
      source_run_id:
        description: 'Source image run ID for fast-rebuild. Leave empty to auto-detect from branch history or main.'
        required: false
        type: string
        default: ''
      allow_dependency_drift:
        description: 'Allow fast-rebuild even if dependency files changed between source and current commit (not recommended)'
        required: false
        type: boolean
        default: false

run-name: >-
  ${{ inputs.mode == 'fast-rebuild'
      && (inputs.source_run_id != ''
          && format('Fast-rebuild from run {0}', inputs.source_run_id)
          || 'Fast-rebuild (auto-detect)')
      || 'GPU Docker Images Pipeline' }}

permissions:
  contents: read
  actions: read

jobs:
  build_maxtext_package:
    name: Build MaxText Package
    uses: ./.github/workflows/build_package.yml
    with:
      device_type: tpu
      device_name: v4-8
      cloud_runner: linux-x86-n2-16-buildkit

  resolve_source:
    name: Resolve Source Run
    if: inputs.mode == 'fast-rebuild'
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Resolve source run ID
        id: resolve
        env:
          EXPLICIT_ID: ${{ inputs.source_run_id }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: gpu_docker_images_pipeline.yml
        run: bash .github/scripts/resolve_source_run.sh

  build_and_push_docker_images:
    name: Build ${{ matrix.name }} Docker Image
    needs: [build_maxtext_package, resolve_source]
    if: ${{ !cancelled() && needs.build_maxtext_package.result == 'success' && (needs.resolve_source.result == 'success' || needs.resolve_source.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GPU Pre-Training Stable"
            build_mode: stable
            workflow: pre-training
            image_name: maxtext_gpu_jax_stable
          - name: "GPU Pre-Training Nightly"
            build_mode: nightly
            workflow: pre-training
            image_name: maxtext_gpu_jax_nightly
    uses: ./.github/workflows/build_and_push_docker_image.yml
    with:
      image_name: ${{ matrix.image_name }}
      repository_name: ${{ inputs.repository_name || 'maxtext-images' }}
      device: gpu
      build_mode: ${{ matrix.build_mode }}
      workflow: ${{ matrix.workflow }}
      dockerfile: maxtext_gpu_dependencies.Dockerfile
      maxtext_sha: ${{ needs.build_maxtext_package.outputs.maxtext_sha }}
      include_test_assets: true
      fast_rebuild: ${{ inputs.mode == 'fast-rebuild' }}
      source_run_id: ${{ needs.resolve_source.outputs.source_run_id || inputs.source_run_id }}
      allow_dependency_drift: ${{ inputs.allow_dependency_drift }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  run_ci_tests:
    name: Run ${{ matrix.name }} CI Tests
    needs: build_and_push_docker_images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Pre-Training"
            image_name: maxtext_gpu_jax_stable
            workflow: pre-training
            additional_image_to_tag: maxtext_gpu_jax_nightly
    uses: ./.github/workflows/run_ci_tests.yml
    with:
      image_name: ${{ matrix.image_name }}
      repository_name: ${{ inputs.repository_name }}
      image_tag: ${{ github.run_id }}
      device: gpu
      workflow: ${{ matrix.workflow }}

  notify_failure:
    name: Notify failed build
    needs: [build_and_push_docker_images, run_ci_tests]
    if: ${{ failure() && inputs.repository_name == 'maxtext-images' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: jayqi/failed-build-issue-action@1a893bbf43ef1c2a8705e2b115cd4f0fe3c5649b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title-template: "MaxText GPU Docker Image Build Failure"
          label-name: "docker-image-build-failure"
