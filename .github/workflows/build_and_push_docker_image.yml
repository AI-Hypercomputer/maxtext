# This workflow will build and push MaxText Docker image to Artifact Registry.

name: Build and Push MaxText Docker Images

on:
  workflow_call:
    inputs:
      repository_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      device:
        required: true
        type: string
      build_mode:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      maxtext_sha:
        required: true
        type: string
      workflow:
        required: false
        type: string
        default: 'pre-training'
      include_test_assets:
        required: false
        type: boolean
        default: false
      fast_rebuild:
        description: 'Use code-overlay rebuild instead of full build'
        required: false
        type: boolean
        default: false
      source_run_id:
        description: 'Run ID of the source image for fast-rebuild'
        required: false
        type: string
        default: ''
      allow_dependency_drift:
        description: 'Allow fast-rebuild even if dependency files changed'
        required: false
        type: boolean
        default: false
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  pre_build_check:
    name: Pre-build Check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if build should run
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DEVICE: ${{ github.event.inputs.target_device || 'all' }}
          INPUT_DEVICE: ${{ inputs.device }}
          IMAGE_NAME: ${{ inputs.image_name }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          SHOULD_RUN="false"
          if [[ "$EVENT_NAME" == "release" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "pull_request" ]]; then
            SHOULD_RUN="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$TARGET_DEVICE" == "all" || "$TARGET_DEVICE" == "$INPUT_DEVICE" ]]; then
              SHOULD_RUN="true"
            fi
          fi

          if [[ "$SHOULD_RUN" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Building $IMAGE_NAME for device: $INPUT_DEVICE in $BUILD_MODE mode."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $IMAGE_NAME build for device: $INPUT_DEVICE in $BUILD_MODE mode."
          fi

  drift_guard:
    name: Fast-rebuild Pre-flight
    needs: pre_build_check
    runs-on: ubuntu-latest
    outputs:
      overlay_variant: ${{ steps.guard.outputs.overlay_variant }}
    if: needs.pre_build_check.outputs.should_run == 'true' && inputs.fast_rebuild
    # Runs the guard script from the workflow's own checkout (not from inputs.maxtext_sha)
    # and only reads the source/current commits as git data; no code from the commit being
    # built executes here. Fails fast before a build runner is allocated.
    steps:
      - name: Validate fast-rebuild inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ -z "${SOURCE_RUN_ID}" ]; then
            echo "::error::source_run_id is required when using fast-rebuild mode."
            echo "Find the run ID in the Actions tab → previous pipeline run → run ID in the URL."
            exit 1
          fi
          echo "Fast-rebuild mode: overlaying new code on source run ${SOURCE_RUN_ID}"

      - name: Checkout workflow ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Dependency drift guard
        id: guard
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CURRENT_SHA: ${{ inputs.maxtext_sha }}
          ALLOW_DRIFT: ${{ inputs.allow_dependency_drift }}
          WORKFLOW: ${{ inputs.workflow }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/fast_rebuild_drift_guard.sh

  build_and_push:
    name: Build and Push Docker Image
    needs: [pre_build_check, drift_guard]
    runs-on: linux-x86-n2-16-buildkit
    container: us-docker.pkg.dev/artifact-foundry-prod/docker-3p-trusted/google/cloud-sdk:528.0.0
    # drift_guard is skipped in build-all mode, so !cancelled() keeps this job eligible;
    # in fast-rebuild mode the guard must have passed.
    if: ${{ !cancelled() && needs.pre_build_check.outputs.should_run == 'true' && (!inputs.fast_rebuild || needs.drift_guard.result == 'success') }}
    steps:
      - name: Matrix Debugger
        env:
          DEVICE: ${{ inputs.device }}
          WORKFLOW: ${{ inputs.workflow }}
          BUILD_MODE: ${{ inputs.build_mode }}
          IMAGE_NAME: ${{ inputs.image_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          echo "device: $DEVICE"
          echo "workflow: $WORKFLOW"
          echo "build_mode: $BUILD_MODE"
          echo "image_name: $IMAGE_NAME"
          echo "dockerfile: $DOCKERFILE"

      - name: Set up Syft
        id: download_syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Checkout MaxText
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.maxtext_sha }}
          persist-credentials: false

      - name: Mark git repositories as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Configure Docker and prepare Airlock credentials
        run: |
          gcloud auth configure-docker us-docker.pkg.dev -q
          mkdir -p /tmp/airlock
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]; then
            cp "${GOOGLE_APPLICATION_CREDENTIALS}" /tmp/airlock/credentials.json
          elif [ -f "$HOME/.config/gcloud/application_default_credentials.json" ]; then
            cp "$HOME/.config/gcloud/application_default_credentials.json" /tmp/airlock/credentials.json
          else
            touch /tmp/airlock/credentials.json
          fi

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: remote
          endpoint: tcp://localhost:1234

      - name: Download MaxText wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maxtext-wheel
          path: .

      - name: Install uv and set Python version
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install MaxText wheel
        shell: bash
        run: |
          uv venv --seed
          source .venv/bin/activate
          maxtext_wheel=$(ls maxtext-*-py3-none-any.whl 2>/dev/null)
          uv pip install "${maxtext_wheel}[runner]" --resolution=lowest

      - name: Copy tests assets to package directory
        if: inputs.include_test_assets == true
        shell: bash
        run: |
          source .venv/bin/activate
          cp -r "${PWD}/tests" .venv/lib/python3.12/site-packages/
          cp "${PWD}/pytest.ini" .venv/lib/python3.12/site-packages/

      - name: Determine build vs target repository
        shell: bash
        env:
          INPUTS_REPOSITORY_NAME: ${{ inputs.repository_name }}
        run: |
          if [ "${INPUTS_REPOSITORY_NAME}" = "maxtext-images" ]; then
            echo "BUILD_REPO=maxtext-images-staging" >> "$GITHUB_ENV"
          else
            echo "BUILD_REPO=${INPUTS_REPOSITORY_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Resolve source image digest
        if: ${{ inputs.fast_rebuild }}
        id: resolve_source
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          REPOSITORY_NAME: ${{ inputs.repository_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          OVERLAY_VARIANT: ${{ needs.drift_guard.outputs.overlay_variant }}
        run: |
          echo "Overlay variant selected by the drift guard: ${OVERLAY_VARIANT}"
          IMAGE_PATH="us-docker.pkg.dev/${PROJECT_NAME}/${REPOSITORY_NAME}/${IMAGE_NAME}"
          SOURCE_REF="${IMAGE_PATH}:${SOURCE_RUN_ID}"
          echo "Looking up source image: ${SOURCE_REF}"

          DIGEST=$(gcloud container images describe "${SOURCE_REF}" \
            --format='value(image_summary.digest)' 2>/dev/null) || {
            echo "::error::Source image not found: ${SOURCE_REF}"
            echo "The source run's image may have been garbage-collected, the run ID may be incorrect,"
            echo "or the source run pushed to a different repository_name."
            echo "Available recent tags:"
            gcloud container images list-tags "${IMAGE_PATH}" \
              --limit=5 --format='table(digest.slice(7,19),tags,timestamp.date())' || true
            exit 1
          }

          if [ -z "${DIGEST}" ]; then
            echo "::error::Could not read the digest of ${SOURCE_REF}"
            exit 1
          fi

          SOURCE_IMAGE="${IMAGE_PATH}@${DIGEST}"
          echo "Resolved source image: ${SOURCE_IMAGE}"
          echo "source_image=${SOURCE_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (full build)
        if: ${{ !inputs.fast_rebuild }}
        id: build_push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          push: true
          context: .
          file: .venv/lib/python3.12/site-packages/dependencies/dockerfiles/${{ inputs.dockerfile }}
          tags: us-docker.pkg.dev/${{ vars.PROJECT_NAME }}/${{ env.BUILD_REPO }}/${{ inputs.image_name }}:${{ github.run_id }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
          outputs: type=image,push=true,compression=zstd,force-compression=true
          secret-files: |
            credentials=/tmp/airlock/credentials.json
          build-args: |
            BASEIMAGE=${{ inputs.device == 'gpu' && 'us-docker.pkg.dev/artifact-foundry-prod/docker-3p-trusted/ubuntu:24.04' || 'us-docker.pkg.dev/artifact-foundry-prod/docker-3p-trusted/python:3.12-slim-trixie' }}
            USE_AIRLOCK=true
            DEVICE=${{ inputs.device }}
            MODE=${{ inputs.build_mode }}
            WORKFLOW=${{ inputs.workflow }}
            PACKAGE_DIR=.venv/lib/python3.12/site-packages
            INCLUDE_TEST_ASSETS=${{ inputs.include_test_assets }}

      - name: Build and push Docker image (fast-rebuild overlay)
        if: ${{ inputs.fast_rebuild }}
        id: build_push_fast
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          push: true
          context: .
          # The drift guard picks the COPY-only fast variant unless code files were removed
          # (or, for post-training, the vLLM adapter changed), see the guard script.
          file: .venv/lib/python3.12/site-packages/dependencies/dockerfiles/${{ needs.drift_guard.outputs.overlay_variant == 'clean' && 'maxtext_code_overlay.Dockerfile' || 'maxtext_code_overlay_fast.Dockerfile' }}
          tags: us-docker.pkg.dev/${{ vars.PROJECT_NAME }}/${{ env.BUILD_REPO }}/${{ inputs.image_name }}:${{ github.run_id }}
          provenance: mode=max
          sbom: true
          # No force-compression: the source image's layers pass through untouched, only
          # the new code layers are compressed and uploaded.
          outputs: type=image,push=true,compression=zstd
          build-args: |
            SOURCE_IMAGE=${{ steps.resolve_source.outputs.source_image }}
            WORKFLOW=${{ inputs.workflow }}
            PACKAGE_DIR=.venv/lib/python3.12/site-packages
            INCLUDE_TEST_ASSETS=${{ inputs.include_test_assets }}

      - name: Generate SPDX SBOM and upload to Container Analysis / SCILo
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          SBOM_BUCKET: ${{ vars.SBOM_BUCKET }}
          BUILD_REPO: ${{ env.BUILD_REPO }}
          INPUTS_IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest || steps.build_push_fast.outputs.digest }}
          SYFT_CMD: ${{ steps.download_syft.outputs.cmd }}
        run: |
          IMAGE_URI="us-docker.pkg.dev/${PROJECT_NAME}/${BUILD_REPO}/${INPUTS_IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "Generating SPDX JSON SBOM for ${IMAGE_URI}..."

          if "${SYFT_CMD}" "registry:${IMAGE_URI}" -o spdx-json=/tmp/sbom.spdx.json; then
            echo "Uploading SPDX SBOM reference to Container Analysis / SCILo..."
            gcloud artifacts sbom load \
              --project="${PROJECT_NAME}" \
              --source=/tmp/sbom.spdx.json \
              --uri="${IMAGE_URI}" \
              --destination="${SBOM_BUCKET}" \
              --quiet || echo "Warning: gcloud artifacts sbom load returned non-zero; continuing with sbom export."
          fi

          echo "Triggering Artifact Analysis SBOM export for BCID / SCILo ingestion..."
          for attempt in $(seq 1 30); do
            if EXPORT_OUT=$(gcloud artifacts sbom export \
              --project="${PROJECT_NAME}" \
              --uri="${IMAGE_URI}" \
              --quiet 2>&1); then
              echo "${EXPORT_OUT}"
              break
            elif [[ "${EXPORT_OUT}" == *"SCANNING"* || "${EXPORT_OUT}" == *"NOT_FOUND"* ]] && [[ "${attempt}" -lt 30 ]]; then
              echo "Artifact Analysis scan still in progress (attempt ${attempt}/30); waiting 15s..."
              sleep 15
            else
              echo "Warning: gcloud artifacts sbom export returned non-zero: ${EXPORT_OUT}"
              break
            fi
          done

      - name: Promote Docker image from staging to production via Exit Gate
        if: inputs.repository_name == 'maxtext-images'
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          SBOM_BUCKET: ${{ vars.SBOM_BUCKET }}
          STAGING_REPO: ${{ env.BUILD_REPO }}
          PROD_REPO: ${{ inputs.repository_name }}
          INPUTS_IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest || steps.build_push_fast.outputs.digest }}
        run: |
          # Call the :promoteArtifact API directly without invoking local scripts from the
          # checked-out workspace, as this job checks out `inputs.maxtext_sha` with caching
          # enabled (which triggers CodeQL's actions/cache-poisoning rule on local script execution).
          echo "Promoting ${INPUTS_IMAGE_NAME}@${IMAGE_DIGEST} from ${STAGING_REPO} to ${PROD_REPO} in project ${PROJECT_NAME}..."
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          PROMOTE_URL="https://artifactregistry.googleapis.com/v1/projects/${PROJECT_NAME}/locations/us/repositories/${PROD_REPO}:promoteArtifact"
          SOURCE_REPO="projects/${PROJECT_NAME}/locations/us/repositories/${STAGING_REPO}"
          SOURCE_VERSION="${SOURCE_REPO}/packages/${INPUTS_IMAGE_NAME}/versions/${IMAGE_DIGEST}"
          PAYLOAD="{\"source_repository\":\"${SOURCE_REPO}\",\"source_version\":\"${SOURCE_VERSION}\",\"attachment_behavior\":\"PUBLIC_BCID_VSA_ONLY\"}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST "${PROMOTE_URL}" \
            -d "${PAYLOAD}")

          HTTP_STATUS=$(echo "${RESPONSE}" | tail -n 1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          echo "Promote API response (HTTP ${HTTP_STATUS}): ${BODY}"

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            if echo "${BODY}" | grep -qi "already exists"; then
              echo "Artifact version already exists in ${PROD_REPO}; skipping promotion."
            else
              echo "Error: promoteArtifact API failed with HTTP ${HTTP_STATUS}" >&2
              exit 1
            fi
          else
            OP_NAME=$(echo "${BODY}" | sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)
            if [[ -n "${OP_NAME}" ]]; then
              echo "Waiting for promotion operation ${OP_NAME} to complete..."
              for attempt in $(seq 1 60); do
                OP_STATUS=$(curl -s \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  "https://artifactregistry.googleapis.com/v1/${OP_NAME}")
                if echo "${OP_STATUS}" | grep -Eq '"done"[[:space:]]*:[[:space:]]*true'; then
                  echo "Final operation status: ${OP_STATUS}"
                  if echo "${OP_STATUS}" | grep -Eq '"error"[[:space:]]*:'; then
                    if echo "${OP_STATUS}" | grep -qi "already exists"; then
                      echo "Artifact version already exists in ${PROD_REPO}; skipping promotion."
                      break
                    fi
                    echo "Error: Promotion operation failed." >&2
                    exit 1
                  fi
                  break
                fi
                if [[ "${attempt}" -eq 60 ]]; then
                  echo "Error: Timed out waiting for promotion operation ${OP_NAME} to complete." >&2
                  exit 1
                fi
                echo "Promotion still in progress, retrying in 5 seconds..."
                sleep 5
              done
            fi
          fi

          PROD_IMAGE_URI="us-docker.pkg.dev/${PROJECT_NAME}/${PROD_REPO}/${INPUTS_IMAGE_NAME}@${IMAGE_DIGEST}"
          if [[ -f /tmp/sbom.spdx.json ]]; then
            echo "Attaching SPDX SBOM reference to promoted image ${PROD_IMAGE_URI}..."
            gcloud artifacts sbom load \
              --project="${PROJECT_NAME}" \
              --source=/tmp/sbom.spdx.json \
              --uri="${PROD_IMAGE_URI}" \
              --destination="${SBOM_BUCKET}" \
              --quiet || echo "Warning: gcloud artifacts sbom load on promoted image returned non-zero."
          fi

      - name: Add tags to Docker image
        shell: bash
        run: |
          STAGING_IMAGE="us-docker.pkg.dev/${PROJECT_NAME}/${BUILD_REPO}/${INPUTS_IMAGE_NAME}"
          SOURCE_IMAGE="us-docker.pkg.dev/${PROJECT_NAME}/${INPUTS_REPOSITORY_NAME}/${INPUTS_IMAGE_NAME}"
          TEMP_IMG="${SOURCE_IMAGE}:${GITHUB_RUN_ID}"

          # Ensure run_id tag is applied to the digest in the target repository
          gcloud container images add-tag "${SOURCE_IMAGE}@${IMAGE_DIGEST}" "${TEMP_IMG}" --quiet

          # Add date tag
          IMAGE_DATE="$(date +%Y-%m-%d)"
          gcloud container images add-tag "${SOURCE_IMAGE}@${IMAGE_DIGEST}" "$SOURCE_IMAGE:$IMAGE_DATE" --quiet

          # Convert date to YYYYMMDD format
          clean_date=$(echo "$IMAGE_DATE" | sed 's/[-:]//g' | cut -c1-8)

          # Add MaxText tag
          MAXTEXT_SHA=$(git rev-parse --short HEAD)
          gcloud container images add-tag "${SOURCE_IMAGE}@${IMAGE_DIGEST}" "${SOURCE_IMAGE}:maxtext_${MAXTEXT_SHA}_${clean_date}" --quiet

          # Also keep staging tags in sync when promoting
          if [[ "${BUILD_REPO}" != "${INPUTS_REPOSITORY_NAME}" ]]; then
            gcloud container images add-tag "${STAGING_IMAGE}@${IMAGE_DIGEST}" "${STAGING_IMAGE}:${IMAGE_DATE}" --quiet
            gcloud container images add-tag "${STAGING_IMAGE}@${IMAGE_DIGEST}" "${STAGING_IMAGE}:maxtext_${MAXTEXT_SHA}_${clean_date}" --quiet
          fi
        env:
          BUILD_REPO: ${{ env.BUILD_REPO }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest || steps.build_push_fast.outputs.digest }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INPUTS_REPOSITORY_NAME: ${{ inputs.repository_name }}
          INPUTS_IMAGE_NAME: ${{ inputs.image_name }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
