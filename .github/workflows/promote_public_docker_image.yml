# This workflow promotes customer-facing MaxText TPU Docker images
# (tpu_pre_training and tpu_post_training) in the cloud-tpu-images project
# from maxtext-images-staging to maxtext-images via the Artifact Registry
# :promoteArtifact Exit Gate API.

name: Promote Public MaxText TPU Docker Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag (e.g., 0.2.5) or sha256 digest of the image in cloud-tpu-images/maxtext-images-staging to promote'
        required: true
        type: string
      image_type:
        description: 'Public image variant to promote (all, tpu_pre_training, or tpu_post_training)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - tpu_pre_training
          - tpu_post_training
      mark_latest:
        description: 'Whether to also apply the latest tag on the promoted image in maxtext-images'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  promote_public_images:
    name: Promote ${{ matrix.image_name }} in cloud-tpu-images
    runs-on: linux-x86-n2-16-buildkit
    container: google/cloud-sdk:524.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: tpu_pre_training
          - image_name: tpu_post_training
    steps:
      - name: Configure Docker
        if: inputs.image_type == 'all' || inputs.image_type == matrix.image_name
        run: gcloud auth configure-docker us-docker.pkg.dev -q

      - name: Promote image from staging to production via Exit Gate
        if: inputs.image_type == 'all' || inputs.image_type == matrix.image_name
        shell: bash
        env:
          PROJECT_ID: cloud-tpu-images
          STAGING_REPO: maxtext-images-staging
          PROD_REPO: maxtext-images
          IMAGE_NAME: ${{ matrix.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          MARK_LATEST: ${{ inputs.mark_latest }}
        run: |
          STAGING_IMAGE="us-docker.pkg.dev/${PROJECT_ID}/${STAGING_REPO}/${IMAGE_NAME}"
          PROD_IMAGE="us-docker.pkg.dev/${PROJECT_ID}/${PROD_REPO}/${IMAGE_NAME}"

          if [[ "${IMAGE_TAG}" == sha256:* ]]; then
            IMAGE_DIGEST="${IMAGE_TAG}"
          else
            IMAGE_DIGEST=$(gcloud container images describe "${STAGING_IMAGE}:${IMAGE_TAG}" \
              --format="value(image_summary.digest)")
          fi

          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "Error: Could not resolve digest for ${STAGING_IMAGE}:${IMAGE_TAG}"
            exit 1
          fi

          echo "Promoting ${STAGING_IMAGE}@${IMAGE_DIGEST} to ${PROD_IMAGE}..."
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          PROMOTE_URL="https://artifactregistry.googleapis.com/v1/projects/${PROJECT_ID}/locations/us/repositories/${PROD_REPO}:promoteArtifact"
          SOURCE_REPO="projects/${PROJECT_ID}/locations/us/repositories/${STAGING_REPO}"
          SOURCE_VERSION="${SOURCE_REPO}/packages/${IMAGE_NAME}/versions/${IMAGE_DIGEST}"
          export SOURCE_REPO SOURCE_VERSION

          PAYLOAD=$(python3 -c 'import json, os
          print(json.dumps({
              "source_repository": os.environ["SOURCE_REPO"],
              "source_version": os.environ["SOURCE_VERSION"],
              "attachment_behavior": "PUBLIC_BCID_VSA_ONLY",
          }))')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST "${PROMOTE_URL}" \
            -d "${PAYLOAD}")

          HTTP_STATUS=$(echo "${RESPONSE}" | tail -n 1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          echo "Promote API response (HTTP ${HTTP_STATUS}): ${BODY}"

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 300 ]]; then
            if echo "${BODY}" | grep -qi "already exists"; then
              echo "Image digest ${IMAGE_DIGEST} already exists in ${PROD_REPO}; continuing to tagging."
            else
              echo "Error: promoteArtifact API failed with HTTP ${HTTP_STATUS}"
              exit 1
            fi
          else
            OP_NAME=$(echo "${BODY}" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("name", ""))')
            for _ in $(seq 1 60); do
              OP_STATUS=$(curl -s \
                -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                -H "Content-Type: application/json" \
                "https://artifactregistry.googleapis.com/v1/${OP_NAME}")
              DONE=$(echo "${OP_STATUS}" | python3 -c 'import json, sys; print(str(json.load(sys.stdin).get("done", False)).lower())')
              if [[ "${DONE}" == "true" ]]; then
                echo "Final operation status: ${OP_STATUS}"
                HAS_ERR=$(echo "${OP_STATUS}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          err = data.get("error")
          if not err:
              print("ok")
          elif err.get("code") == 6 and "already exists" in err.get("message", "").lower():
              print("ok")
          else:
              print(err.get("message", "unknown error"))
          ')
                if [[ "${HAS_ERR}" != "ok" ]]; then
                  echo "Error: Artifact promotion failed: ${HAS_ERR}"
                  exit 1
                fi
                break
              fi
              echo "Promotion still in progress, retrying in 5 seconds..."
              sleep 5
            done
          fi

          if [[ "${IMAGE_TAG}" != sha256:* ]]; then
            gcloud container images add-tag "${PROD_IMAGE}@${IMAGE_DIGEST}" "${PROD_IMAGE}:${IMAGE_TAG}" --quiet
            gcloud container images add-tag "${PROD_IMAGE}@${IMAGE_DIGEST}" "${PROD_IMAGE}:public-image-${IMAGE_TAG}" --quiet
          fi
          if [[ "${MARK_LATEST}" == "true" ]]; then
            gcloud container images add-tag "${PROD_IMAGE}@${IMAGE_DIGEST}" "${PROD_IMAGE}:latest" --quiet
          fi
