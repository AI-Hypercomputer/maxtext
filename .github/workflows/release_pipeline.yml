# This workflow verifies certified Release Candidate (RC) Docker images,
# builds and publishes the MaxText wheel to PyPI with signed attestations,
# publishes versioned documentation to Read the Docs, and promotes the
# certified Docker images in Artifact Registry.

name: MaxText Release Pipeline

# Triggers when a new "release" is published in the GitHub UI or when manually triggered via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MaxText release tag (e.g., maxtext-v0.2.6), or a release-prep branch/40-char SHA for dry-run.'
        required: true
        type: string
      mode:
        description: 'Execution mode: dry-run (verify without publishing), publish (certified release), or force-publish (bypass RC verification and skip Docker promotion; publishes PyPI and RTD only).'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - publish
          - force-publish

permissions:
  contents: read

jobs:
  get_maxtext_sha:
    name: Resolve MaxText SHA
    # `on: release` does not support tag filters, so skip pre-releases and non-PyPI tags (e.g., mlperf*, tpu-recipes*).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'maxtext-v'))
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.vars.outputs.release_sha }}
      rc_sha: ${{ steps.vars.outputs.rc_sha }}
      package_version: ${{ steps.vars.outputs.package_version }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Resolve SHA and Validate Release Commit
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          MODE: ${{ inputs.mode || 'publish' }}
        run: bash .github/scripts/resolve_release_commit.sh

  build_maxtext_package:
    name: Build MaxText Package
    needs: get_maxtext_sha
    uses: ./.github/workflows/build_package.yml
    with:
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.release_sha }}

  build_docs:
    name: Build Documentation
    needs: get_maxtext_sha
    uses: ./.github/workflows/check_docs_build.yml
    with:
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.release_sha }}

  tag_verification_gate:
    name: Verify Release Candidate Docker Images
    needs: get_maxtext_sha
    if: ${{ inputs.mode != 'force-publish' }}
    runs-on: linux-x86-n4-16-buildkit
    container: us-docker.pkg.dev/artifact-foundry-prod/docker-3p-trusted/google/cloud-sdk:528.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'TPU Pre-Training'
            image_name: tpu_pre_training
            check_perf: true
          - name: 'TPU Post-Training'
            image_name: tpu_post_training
            check_perf: false
    steps:
      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Verify Certification Tags
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          DOCKER_IMAGE_NAME: ${{ matrix.image_name }}
          RC_SHA: ${{ needs.get_maxtext_sha.outputs.rc_sha }}
          CHECK_PERF: ${{ matrix.check_perf }}
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_NAME}" || -z "${DOCKER_IMAGE_NAME}" || -z "${RC_SHA}" ]]; then
            echo "::error::PROJECT_NAME, DOCKER_IMAGE_NAME, and RC_SHA must be non-empty."
            exit 1
          fi

          SOURCE_IMAGE="us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images/${DOCKER_IMAGE_NAME}"

          # Resolve RC_SHA to its exact image digest. Keep stderr visible so auth/API errors are never masked.
          if ! RC_DIGEST="$(gcloud container images describe "${SOURCE_IMAGE}:${RC_SHA}" --format='value(image_summary.digest)')"; then
            echo "::error::Failed to resolve ${SOURCE_IMAGE}:${RC_SHA} in Artifact Registry."
            exit 1
          fi
          if [[ ! "${RC_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest '${RC_DIGEST}' returned for ${SOURCE_IMAGE}:${RC_SHA}."
            exit 1
          fi
          echo "Resolved ${SOURCE_IMAGE}:${RC_SHA} -> ${RC_DIGEST}"

          # Fetch all tags attached to this exact digest so stale tags on older digests cannot satisfy the gate.
          if ! DIGEST_TAGS="$(gcloud container images list-tags "${SOURCE_IMAGE}" \
            --limit=unlimited \
            --filter="digest=\"${RC_DIGEST}\"" \
            --flatten='tags[]' \
            --format='value(tags)')"; then
            echo "::error::Failed to list tags for ${SOURCE_IMAGE}@${RC_DIGEST}."
            exit 1
          fi

          has_tag() {
            grep -Fxq -- "$1" <<< "${DIGEST_TAGS}"
          }

          if ! has_tag "${RC_SHA}"; then
            echo "::error::Tag '${RC_SHA}' was not found on ${SOURCE_IMAGE}@${RC_DIGEST} (possible concurrent re-tag)."
            exit 1
          fi

          echo "Tags on ${SOURCE_IMAGE}@${RC_DIGEST}:"
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              echo "  ${tag}"
            fi
          done <<< "${DIGEST_TAGS}"

          FAIL_TAGS=("failed-e2e-${RC_SHA}" "unknown-e2e-${RC_SHA}")
          REQ_TAGS=("verified-ci-${RC_SHA}" "verified-e2e-${RC_SHA}")
          if [[ "${CHECK_PERF}" == "true" ]]; then
            FAIL_TAGS+=("failed-perf-${RC_SHA}" "failed-run-${RC_SHA}")
            REQ_TAGS+=("verified-perf-${RC_SHA}")
          fi

          PRESENT_FAIL_TAGS=()
          for tag in "${FAIL_TAGS[@]}"; do
            if has_tag "${tag}"; then
              PRESENT_FAIL_TAGS+=("${tag}")
            fi
          done
          if [[ ${#PRESENT_FAIL_TAGS[@]} -ne 0 ]]; then
            echo "::error::Failure tag(s) present on ${SOURCE_IMAGE}:${RC_SHA} (${RC_DIGEST}): ${PRESENT_FAIL_TAGS[*]}"
            exit 1
          fi

          MISSING_TAGS=()
          for tag in "${REQ_TAGS[@]}"; do
            if ! has_tag "${tag}"; then
              MISSING_TAGS+=("${tag}")
            fi
          done
          if [[ ${#MISSING_TAGS[@]} -ne 0 ]]; then
            echo "::error::${SOURCE_IMAGE}:${RC_SHA} (${RC_DIGEST}) is missing required certification tag(s): ${MISSING_TAGS[*]}"
            exit 1
          fi

          echo "All required certification tags are present on ${SOURCE_IMAGE}:${RC_SHA} (${RC_DIGEST})."

  publish_to_pypi:
    name: Publish MaxText to PyPI
    needs: [build_maxtext_package, build_docs, tag_verification_gate]
    runs-on: ubuntu-latest
    # "release" environment requires manual reviewer approval before proceeding and binds the PyPI OIDC claim.
    environment: release
    if: >-
      !cancelled() &&
      needs.build_maxtext_package.result == 'success' &&
      needs.build_docs.result == 'success' &&
      (needs.tag_verification_gate.result == 'success' || (inputs.mode == 'force-publish' && needs.tag_verification_gate.result == 'skipped')) &&
      (github.event_name == 'release' || endsWith(inputs.mode, 'publish'))
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC) & Sigstore attestations
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maxtext-wheel
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maxtext-wheel-sbom
          path: sbom/
      - name: Generate signed SLSA build provenance attestation for wheel
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'dist/*.whl'
      - name: Generate signed SPDX SBOM attestation for wheel
        uses: actions/attest-sbom@115c3be05ff3974bcbd596578934b3f9ce39bf68 # v2.2.0
        with:
          subject-path: 'dist/*.whl'
          sbom-path: 'sbom/maxtext-wheel.spdx.json'
      - name: Publish MaxText wheel to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  publish_to_rtd:
    name: Publish MaxText to Read the Docs
    needs: [get_maxtext_sha, publish_to_pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Trigger Read the Docs build
        shell: bash
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          PYPI_VERSION: ${{ needs.get_maxtext_sha.outputs.package_version }}
        run: bash .github/scripts/publish_readthedocs.sh

  promote_docker_images:
    name: Promote ${{ matrix.name }} Docker Image
    needs: [get_maxtext_sha, publish_to_pypi]
    if: ${{ inputs.mode != 'force-publish' }}
    runs-on: linux-x86-n4-16-buildkit
    container: us-docker.pkg.dev/artifact-foundry-prod/docker-3p-trusted/google/cloud-sdk:528.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'TPU Pre-Training'
            image_name: tpu_pre_training
          - name: 'TPU Post-Training'
            image_name: tpu_post_training
    steps:
      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Add tags to Docker image
        shell: bash
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          IMAGE_NAME: ${{ matrix.image_name }}
          RC_SHA: ${{ needs.get_maxtext_sha.outputs.rc_sha }}
          PYPI_VERSION: ${{ needs.get_maxtext_sha.outputs.package_version }}
        run: |
          set -euo pipefail
          SOURCE_IMAGE="us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images/${IMAGE_NAME}"
          if ! gcloud container images describe "${SOURCE_IMAGE}:${RC_SHA}" >/dev/null; then
            echo "::error::Failed to verify ${SOURCE_IMAGE}:${RC_SHA} in Artifact Registry."
            exit 1
          fi
          gcloud container images add-tag "${SOURCE_IMAGE}:${RC_SHA}" "${SOURCE_IMAGE}:${PYPI_VERSION}" --quiet
