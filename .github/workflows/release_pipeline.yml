# This workflow will build and test the MaxText package, and build Docker images
# for a Release Candidate when a new release tag is created.

name: MaxText Release Pipeline

# Triggers when a new "release" is published in the GitHub UI or when manually triggered via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MaxText Release tag to build and test (e.g., maxtext-v0.2.3).'
        required: true
        type: string
      dry_run:
        description: 'Set to true to only test SHA resolution and the Read the Docs default_version guard without running builds, tests, or publishing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  get_maxtext_sha:
    name: Resolve MaxText SHA
    runs-on: ubuntu-latest
    outputs:
      maxtext_sha: ${{ steps.vars.outputs.maxtext_sha }}
    steps:
      - name: Checkout MaxText
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ (inputs.dry_run && github.ref_name) || inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve SHA
        id: vars
        shell: bash
        run: |
          MAXTEXT_SHA=$(git rev-parse HEAD)
          echo "Using MaxText SHA: ${MAXTEXT_SHA}"
          echo "maxtext_sha=${MAXTEXT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Keep Read the Docs default version on latest published PyPI release
        continue-on-error: true
        shell: bash
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$READTHEDOCS_TOKEN" ] || [ -z "$RELEASE_TAG" ]; then
            echo "READTHEDOCS_TOKEN or RELEASE_TAG is not set; skipping Read the Docs default_version guard."
            exit 0
          fi

          VERSION="${RELEASE_TAG#maxtext-v}"
          VERSION="${VERSION#v}"
          HTTP_STATUS=$(curl -sS --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/maxtext/${VERSION}/json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "MaxText version '${VERSION}' is already published on PyPI; skipping Read the Docs default_version revert."
            exit 0
          fi

          RTD_PROJECT="maxtext"
          API_BASE="https://app.readthedocs.org/api/v3/projects/${RTD_PROJECT}"
          LATEST_PYPI_VERSION=$(curl -sS --retry 3 --retry-delay 5 "https://pypi.org/pypi/maxtext/json" | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])")
          if [ -z "$LATEST_PYPI_VERSION" ] || [ "$LATEST_PYPI_VERSION" = "null" ]; then
            echo "Could not determine latest published PyPI version; skipping."
            exit 0
          fi
          DEFAULT_RTD_VERSION="maxtext-v${LATEST_PYPI_VERSION}"

          # Wait briefly for the Read the Docs tag webhook / Automation Rule to register the new tag version.
          MAX_ATTEMPTS=12
          if [ "$DRY_RUN" = "true" ]; then
            MAX_ATTEMPTS=1
          fi
          TAG_EXISTS_ON_RTD=false
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
              "${API_BASE}/versions/${RELEASE_TAG}/")
            if [ "$STATUS" = "200" ]; then
              TAG_EXISTS_ON_RTD=true
              break
            fi
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting for Read the Docs to register tag ${RELEASE_TAG} (attempt ${i}/${MAX_ATTEMPTS})..."
              sleep 5
            fi
          done

          echo "Ensuring Read the Docs default_version stays on '${DEFAULT_RTD_VERSION}' until '${RELEASE_TAG}' is published to PyPI..."
          curl -f -sS -X PATCH \
            -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"default_version\": \"${DEFAULT_RTD_VERSION}\"}" \
            "${API_BASE}/"

          CURRENT_DEFAULT=$(curl -f -sS \
            -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
            "${API_BASE}/" | python3 -c "import sys, json; print(json.load(sys.stdin)['default_version'])")
          echo "Verified Read the Docs default_version is '${CURRENT_DEFAULT}'."

          if [ "$TAG_EXISTS_ON_RTD" = "true" ] && [ "$RELEASE_TAG" != "$DEFAULT_RTD_VERSION" ]; then
            echo "Deactivating unbuilt tag '${RELEASE_TAG}' on Read the Docs until PyPI release completes..."
            curl -f -sS -X PATCH \
              -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"active": false, "hidden": false}' \
              "${API_BASE}/versions/${RELEASE_TAG}/" || true
          fi

  release_approval:
    name: Approve Release Candidate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # "release" environment is configured in MaxText repository settings.
    # This environment requires manual approval before proceeding to the next job.
    environment: release
    steps:
      - name: Acknowledge Approval
        run: echo "Release candidate approved, proceeding to build and test MaxText package."

  build_maxtext_package:
    name: Build MaxText Package
    needs: [release_approval, get_maxtext_sha]
    if: |
      !cancelled() &&
      !inputs.dry_run &&
      needs.get_maxtext_sha.result == 'success' &&
      (needs.release_approval.result == 'success' || needs.release_approval.result == 'skipped')
    uses: ./.github/workflows/build_package.yml
    with:
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}

  run_ci_tests:
    name: Test MaxText Package
    needs: [build_maxtext_package, get_maxtext_sha]
    if: |
      !cancelled() &&
      needs.get_maxtext_sha.result == 'success' &&
      needs.build_maxtext_package.result == 'success'
    permissions:
      issues: write
      id-token: write
      pull-requests: write
      contents: write
      actions: read
    uses: ./.github/workflows/ci_pipeline.yml
    with:
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  build_tpu_release_candidate_images:
    name: Build ${{ matrix.name }} Docker Image
    needs: [build_maxtext_package, get_maxtext_sha]
    if: |
      !cancelled() &&
      needs.get_maxtext_sha.result == 'success' &&
      needs.build_maxtext_package.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'TPU Pre-Training Stable'
            device: tpu
            image_name: maxtext_jax_stable
            workflow: pre-training
            dockerfile: maxtext_tpu_dependencies.Dockerfile
          - name: 'TPU Post-Training Stable'
            device: tpu
            image_name: maxtext_post_training_stable
            workflow: post-training
            dockerfile: maxtext_tpu_dependencies.Dockerfile
    uses: ./.github/workflows/build_and_push_docker_image.yml
    with:
      image_name: ${{ matrix.image_name }}
      repository_name: 'maxtext-images'
      device: ${{ matrix.device }}
      build_mode: stable
      workflow: ${{ matrix.workflow }}
      dockerfile: ${{ matrix.dockerfile }}
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}
      image_date: ${{ needs.build_maxtext_package.outputs.image_date }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  build_gpu_release_candidate_images:
    name: Build ${{ matrix.name }} Docker Image
    needs: [build_maxtext_package, get_maxtext_sha]
    if: |
      !cancelled() &&
      needs.get_maxtext_sha.result == 'success' &&
      needs.build_maxtext_package.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'GPU Pre-Training Stable (amd64)'
            device: gpu
            image_name: maxtext_gpu_jax_stable
            workflow: pre-training
            dockerfile: maxtext_gpu_dependencies.Dockerfile
            platform: amd64
          - name: 'GPU Pre-Training Stable (arm64)'
            device: gpu
            image_name: maxtext_gpu_jax_stable
            workflow: pre-training
            dockerfile: maxtext_gpu_dependencies.Dockerfile
            platform: arm64
    uses: ./.github/workflows/build_and_push_docker_image.yml
    with:
      image_name: ${{ matrix.image_name }}
      repository_name: 'maxtext-images'
      device: ${{ matrix.device }}
      build_mode: stable
      workflow: ${{ matrix.workflow }}
      dockerfile: ${{ matrix.dockerfile }}
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}
      image_date: ${{ needs.build_maxtext_package.outputs.image_date }}
      platform: ${{ matrix.platform }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  run_e2e_tests:
    name: Run E2E tests
    needs: [build_tpu_release_candidate_images, get_maxtext_sha]
    # Ensure the SHA resolved and all image builds succeeded
    if: |
      !cancelled() &&
      needs.get_maxtext_sha.result == 'success' &&
      needs.build_tpu_release_candidate_images.result == 'success'
    uses: ./.github/workflows/run_e2e_tests.yml
    with:
      mode: stable
      run_id: ${{ github.run_id }}
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}
    secrets:
      AIRFLOW_CALLBACK_TOKEN: ${{ secrets.AIRFLOW_CALLBACK_TOKEN }}

  build_docs:
    name: Build Documentation
    needs: [release_approval, get_maxtext_sha]
    if: |
      !cancelled() &&
      !inputs.dry_run &&
      needs.get_maxtext_sha.result == 'success' &&
      (needs.release_approval.result == 'success' || needs.release_approval.result == 'skipped')
    uses: ./.github/workflows/check_docs_build.yml
    with:
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}

  check_links:
    name: Check Links in Documentation
    needs: [release_approval, get_maxtext_sha]
    if: |
      !cancelled() &&
      !inputs.dry_run &&
      needs.get_maxtext_sha.result == 'success' &&
      (needs.release_approval.result == 'success' || needs.release_approval.result == 'skipped')
    permissions:
      issues: write
      contents: read
    uses: ./.github/workflows/docs_link_check.yml
    with:
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}

  wait_for_tests_verification:
    name: Wait for Tests Verification
    needs: [run_ci_tests, run_e2e_tests]
    if: |
      !cancelled() &&
      needs.run_ci_tests.result == 'success' && needs.run_e2e_tests.result == 'success'
    runs-on: linux-x86-n4-16-buildkit
    container: google/cloud-sdk:524.0.0
    steps:
      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev -q
      - name: Poll for verified Docker images
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          check_tag() {
            gcloud container images describe "us-docker.pkg.dev/${PROJECT_NAME}/maxtext-images/$1" >/dev/null 2>&1
          }

          echo "Waiting for pre-training and post-training tests to complete..."
          while true; do
            PRETRAIN_READY=false
            POSTTRAIN_READY=false

            if check_tag "maxtext_jax_stable:verified-e2e-${GITHUB_RUN_ID}"; then
              PRETRAIN_READY=true
            fi
            if check_tag "maxtext_post_training_stable:verified-e2e-${GITHUB_RUN_ID}"; then
              POSTTRAIN_READY=true
            fi

            if [ "$PRETRAIN_READY" = "true" ] && [ "$POSTTRAIN_READY" = "true" ]; then
              echo "Both pre-training and post-training tests have passed. Proceeding to publish to PyPI."
              break
            fi

            echo "Either pre-training or post-training tests are still running. Checking again in 5 minutes..."
            sleep 300
          done

  publish_to_pypi:
    name: Publish MaxText to PyPI
    needs: [wait_for_tests_verification, get_maxtext_sha]
    if: |
      !cancelled() &&
      needs.get_maxtext_sha.result == 'success' &&
      needs.wait_for_tests_verification.result == 'success'
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: ./.github/workflows/pypi_release.yml
    with:
      maxtext_sha: ${{ needs.get_maxtext_sha.outputs.maxtext_sha }}
      run_id: ${{ github.run_id }}
      publish: true
    secrets:
      READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
