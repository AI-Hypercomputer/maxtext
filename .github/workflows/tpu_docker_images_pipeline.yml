# This workflow builds and pushes TPU MaxText images.
# It runs automatically daily at 19:00 Pacific time, or manually via Workflow Dispatch.

name: TPU Docker Images Pipeline

on:
  schedule:
    # Run daily at 19:00 Pacific time, one hour before the daily 20:00-24:00
    # Pacific TPU quota window of the queue that runs the E2E tests, so the TPU
    # jobs are submitted when the window opens.
    - cron: '0 19 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      repository_name:
        description: 'The name of the repository where the Docker images will be pushed'
        required: false
        type: string
        default: "maxtext-test-images"
      e2e_test_scope:
        description: 'Which E2E test suites to run after building the Docker images'
        required: false
        type: choice
        default: none
        options:
          - none
          - all
          - pre-training
          - post-training

permissions:
  contents: read
  actions: read

jobs:
  build_maxtext_package:
    name: Build MaxText Package
    uses: ./.github/workflows/build_package.yml

  build_and_push_docker_images:
    name: Build ${{ matrix.name }} Docker Image
    needs: build_maxtext_package
    if: ${{ !cancelled() && needs.build_maxtext_package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "TPU Pre-Training Stable"
            build_mode: stable
            workflow: pre-training
            image_name: maxtext_jax_stable
            deps_image_name: maxtext_tpu_pre_train_deps
          - name: "TPU Pre-Training Nightly"
            build_mode: nightly
            workflow: pre-training
            image_name: maxtext_jax_nightly
          - name: "TPU Post-Training Stable"
            build_mode: stable
            workflow: post-training
            image_name: maxtext_post_training_stable
            deps_image_name: maxtext_tpu_post_train_deps
          - name: "TPU Post-Training Nightly"
            build_mode: nightly
            workflow: post-training
            image_name: maxtext_post_training_nightly
    uses: ./.github/workflows/build_and_push_docker_image.yml
    with:
      image_name: ${{ matrix.image_name }}
      deps_image_name: ${{ matrix.deps_image_name || '' }}
      repository_name: ${{ inputs.repository_name || 'maxtext-images' }}
      device: tpu
      build_mode: ${{ matrix.build_mode }}
      workflow: ${{ matrix.workflow }}
      dockerfile: maxtext_tpu_dependencies.Dockerfile
      maxtext_sha: ${{ needs.build_maxtext_package.outputs.maxtext_sha }}
      image_date: ${{ needs.build_maxtext_package.outputs.image_date }}
      include_test_assets: true
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  run_ci_tests:
    name: Run ${{ matrix.name }} CI Tests
    needs: build_and_push_docker_images
    if: ${{ !cancelled() && needs.build_and_push_docker_images.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Pre-Training"
            image_name: maxtext_jax_stable
            workflow: pre-training
          - name: "Post-Training"
            image_name: maxtext_post_training_stable
            workflow: post-training
    uses: ./.github/workflows/run_ci_tests.yml
    with:
      image_name: ${{ matrix.image_name }}
      repository_name: ${{ inputs.repository_name || 'maxtext-images' }}
      image_tag: ${{ github.run_id }}
      device: tpu
      workflow: ${{ matrix.workflow }}

  run_e2e_tests:
    name: Run E2E tests
    needs: build_and_push_docker_images
    if: >-
      ${{ !cancelled() &&
      needs.build_and_push_docker_images.result == 'success' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e_test_scope != 'none')) }}
    uses: ./.github/workflows/run_e2e_tests.yml
    with:
      mode: stable
      # Scheduled runs always exercise the full suite; manual runs pick a scope.
      test_scope: ${{ github.event_name == 'schedule' && 'all' || inputs.e2e_test_scope }}
      run_id: ${{ github.run_id }}
      maxtext_sha: ${{ github.sha }}
    secrets:
      AIRFLOW_CALLBACK_TOKEN: ${{ secrets.AIRFLOW_CALLBACK_TOKEN }}

  notify_failure:
    name: Notify failed build
    needs: [build_and_push_docker_images, run_ci_tests, run_e2e_tests]
    if: ${{ failure() && (github.event_name == 'schedule' || inputs.repository_name == 'maxtext-images') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue-number }}
    steps:
      - name: Create issue on failure
        id: create_issue
        uses: jayqi/failed-build-issue-action@1a893bbf43ef1c2a8705e2b115cd4f0fe3c5649b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title-template: "MaxText TPU Docker Image Build Failure"
          label-name: "tpu-docker-image-build-failure"

  investigate_failure:
    name: Investigate failed build # investigates the failure and comments on the tracking issue
    needs: [build_and_push_docker_images, run_ci_tests, run_e2e_tests, notify_failure]
    if: ${{ failure() && (github.event_name == 'schedule' || inputs.repository_name == 'maxtext-images') }}
    uses: ./.github/workflows/gemini_investigate.yml
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
      actions: 'read'
    with:
      failed_run_id: '${{ github.run_id }}'
      tracking_issue_number: '${{ needs.notify_failure.outputs.issue_number }}'
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
