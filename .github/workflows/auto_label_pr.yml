# This workflow automatically adds a "pull ready" label to a PR
# when it has received at least 2 approving reviews and all checks have passed.
# It runs on pull request review events, workflow run completion events for the "MaxText Package Tests" workflow,
# and can also be triggered manually via workflow dispatch.

name: Add Pull Ready Label

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["MaxText Package Tests"]
    types: [completed]
  pull_request_review:
  pull_request_review_comment:
  workflow_dispatch:

jobs:
  AddPullReady:
    permissions:
      checks: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Add Pull Request Label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            let pull_number = -1
            if (context.payload.pull_request !== undefined) {
              pull_number = context.payload.pull_request.number
            } else if (context.payload.workflow_run !== undefined) {
              if (context.payload.workflow_run.pull_requests.length === 0) {
                core.setFailed("This workflow is NOT running within a PR's context")
                return
              }
              console.log(context.payload.workflow_run.pull_requests)
              pull_number = context.payload.workflow_run.pull_requests[0].number
            } else {
              core.setFailed("This workflow is running within an invalid context")
              return
            }

            const decision_query = `
              query($owner: String!, $repo: String!, $pull_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pull_number) {
                    reviewDecision # Fetches the overall review status
                    reviews(last: 100) {
                      nodes {
                        state
                        author { login }
                      }
                    }
                  }
                }
              }
            `;

            const decision_result = await github.graphql(decision_query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull_number
            });

            const pullRequest = decision_result.repository.pullRequest;
            const uniqueApprovers = new Set(
              pullRequest.reviews.nodes
                .filter(r => r.state === 'APPROVED')
                .map(r => r.author.login)
            );

            if (pullRequest.reviewDecision !== 'APPROVED' || uniqueApprovers.size < 2) {
              core.info(`PR is not ready. Decision: ${pullRequest.reviewDecision}, Approvals: ${uniqueApprovers.size}`);
              return;
            }

            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull_number,
              per_page: 100,
            })
            // Check that the number of commits in the PR is 1.
            if (commits.data.length !== 1) {
              core.setFailed("Not adding pull ready because the PR has more than one commit. Please squash your commits.")
              return
            }

            const last_commit_sha = commits.data.slice(-1)[0].sha

            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: last_commit_sha,
            });

            if (checkRuns.check_runs.length === 0) {
              core.info("Not adding pull ready because no check runs are associated with the last commit: " + last_commit_sha)
              return
            }

            // A PR that starts without the `ready_for_full_ci` label gets a failing "Full CI Gatekeeper"
            // and "All Required Tests Passed" from that run. After the label is added, a later run on the
            // same commit can pass, but GitHub keeps the earlier check runs. So once a newer "All Required
            // Tests Passed" succeeded in a run that really ran the pipeline (its Code Quality check
            // succeeded; runs triggered by unrelated labels skip it and report an all-skipped success),
            // ignore those two checks from earlier runs in which the gatekeeper failed. Every other check,
            // including those two from runs that were not gated, is still evaluated as before.
            // These check names must match the job names in ci_pipeline.yml and code_quality.yml.
            const ATP_CHECK = 'All Required Tests Passed'
            const GATEKEEPER_CHECK = 'Full CI Gatekeeper'
            const CODE_QUALITY_CHECK = 'Code Quality Check / Pre-commit Linters'
            const listChecksNamed = (name) => github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: last_commit_sha,
              check_name: name,
              per_page: 100,
            })
            const suitesWhere = (runs, conclusion) => new Set(runs
              .filter(run => run.status === 'completed' && run.conclusion === conclusion)
              .map(run => run.check_suite?.id)
              .filter(id => id !== undefined))
            const pipelineRanSuites = suitesWhere(await listChecksNamed(CODE_QUALITY_CHECK), 'success')
            const gatedSuites = suitesWhere(await listChecksNamed(GATEKEEPER_CHECK), 'failure')
            const supersedingAtpId = Math.max(0, ...(await listChecksNamed(ATP_CHECK))
              .filter(run => run.status === 'completed' && run.conclusion === 'success' &&
                pipelineRanSuites.has(run.check_suite?.id))
              .map(run => run.id))
            const isStaleGateFailure = (run) => (run.name === GATEKEEPER_CHECK || run.name === ATP_CHECK) &&
              run.id < supersedingAtpId && gatedSuites.has(run.check_suite?.id)
            core.info(`Newest passing full-pipeline "${ATP_CHECK}" id: ${supersedingAtpId || 'none'}; gated runs: ${gatedSuites.size}`)

            for (const checkRun of checkRuns.check_runs) {
              // Ignore the current running workflow and test duration tracking
              if (checkRun.name.endsWith(context.job) || checkRun.name.includes('Track Test Duration')) continue
              if (isStaleGateFailure(checkRun)) {
                core.info(`Ignoring stale check from an earlier gated run: ${checkRun.name} (id ${checkRun.id})`)
                continue
              }

              if (checkRun.status !== 'completed' || !['success', 'skipped'].includes(checkRun.conclusion)) {
                core.info(`Waiting for check: ${checkRun.name} (Status: ${checkRun.status}, Conclusion: ${checkRun.conclusion})`);
                return; // Exit without failing
              }
            }

            console.log("Adding pull ready label because the PR is approved AND all the check runs have passed")
            await github.rest.issues.addLabels({
              issue_number: pull_number,
              labels: ["pull ready"],
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
