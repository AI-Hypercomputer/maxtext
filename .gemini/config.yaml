# Gemini Code Assist configuration for https://github.com/AI-Hypercomputer/maxtext
# Reference: https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior-github
#
# Code review is done by the MaxText review workflow
# (.github/workflows/gemini_dispatch.yml -> gemini_review.yml, using
# .gemini/commands/maxtext-review.toml): automatically when a PR is opened or
# marked ready for review, incrementally after pushes when the
# GEMINI_REVIEW_ON_PUSH repository variable is 'true', and on demand with the
# `gemini-review` label or an `@gemini-cli /review` comment. Gemini Code Assist
# reviews and PR summaries are disabled to avoid duplicate bot comments.
have_fun: false
code_review:
  disable: true
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: false
    include_drafts: false
ignore_patterns: []
